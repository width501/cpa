.qz-late.solo .qc-open,.qz-late.solo .qc-imp{max-height:none}
.qz-late.solo .qc-late::after{display:none}
/* 공부 기록: 과목 색으로 쌓은 막대 */
.sv-stack{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:24px;opacity:.6;transform-origin:50% 100%;animation:growy .9s var(--ease) both;transition:opacity .25s}
.sv-stack i{display:block;width:100%;max-width:none;min-height:2px;border-radius:1px;animation:none}
.sv-b.sel .sv-stack,.sv-b.today .sv-stack{opacity:1}
@media (hover:hover){.sv-b:hover .sv-stack{opacity:1}}
.sv-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.sv-leg span{display:inline-flex;align-items:center}
.tl-seg{box-shadow:inset 1px 0 0 var(--surface),inset -1px 0 0 var(--surface)}
.sv-chips span .sdot{margin-right:0}
.ss-sub small+small{margin-left:4px}
.mk-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start;margin-top:18px}
@media (max-width:899px){.mk-two{grid-template-columns:minmax(0,1fr)}}
.mk-rl{display:flex;flex-direction:column;padding:4px 0}
.mk-rr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 16px;text-align:left;transition:background-color .15s}
.mk-rr+.mk-rr{box-shadow:inset 0 1px 0 var(--sep)}
.mk-rr:active{background:var(--surface-2)}
.mk-rr.low{background:var(--fail-soft)}
.mk-rd{font-size:12.5px;color:var(--muted)}
.mk-rn{overflow:hidden;font-size:14px;white-space:nowrap;text-overflow:ellipsis}
.mk-rn b{font-weight:700;color:var(--fg-2)}
.mk-rv{display:flex;align-items:baseline;gap:8px}
.mk-rv b{font-size:17px;font-weight:700}
.mk-rv small{font-size:12px;font-weight:500;color:var(--muted)}
.mk-rv small.up{color:var(--up)}
.mk-rv small.down{color:var(--down)}
.mk-rr.low .mk-rv b{color:var(--fail)}
.mk-wr{padding:12px 16px 14px}
.mk-h{margin:28px 4px 0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.mk-acts{display:flex;align-items:center;gap:8px}
.mk-cfg{height:40px;padding:0 14px;border-radius:var(--r);background:var(--fill);font-size:14px;font-weight:600;color:var(--fg-2);transition:transform .2s var(--ease)}
.mk-cfg:active{transform:scale(.95)}
.mc-n{font-size:15px;font-weight:600}
.grp-card.flash{animation:gflash 1.5s ease}
@keyframes gflash{0%,45%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:var(--card-shadow)}}

/* 모의고사 틀린 파트 한 줄 (회차 시트·오답 노트·장 상세 공통) */
.wr{display:block;min-height:0;padding:0}
.wr-main{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;text-align:left;color:inherit}
.wr-rs{flex:none;width:10px;height:10px;border-radius:var(--r)}
.wr-t{flex:1;min-width:0;overflow:hidden;font-size:15px;white-space:nowrap;text-overflow:ellipsis}
.wr.open .wr-t{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.wr-main .memo-dot{flex:none}
.wr-main .wr-q{flex:none;margin:0}
.wr-m{flex:none;max-width:42%;overflow:hidden;font-size:12.5px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.wr-mx>div>.wr-meta{margin:0 14px;font-size:12.5px;color:var(--muted)}
.wr-mx>div>.wr-mtext{margin:6px 14px 0;padding:0}
.wr-acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 12px}
.wr-act{height:32px;padding:0 12px;border-radius:var(--r);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--fg-2);transition:transform .2s var(--ease),background-color .2s,color .2s}
.wr-act:active{transform:scale(.95)}
.wr-act.accent{background:var(--accent-soft);color:var(--accent)}
.wr-act.danger{margin-left:auto;color:var(--danger)}
.wr-act.danger.armed{background:var(--danger);color:var(--on-danger)}
.wr-ed{padding:0 14px}
.wr-ed .field,.wr-ed .rs-pick,.wr-ed .pp-box{margin-top:8px}
.wr-ed .sub-pick{margin-bottom:8px}
.wr-ed .ch-pick{margin-bottom:0}
.wr-ed .wr-acts{padding:10px 0 12px}
.wr-list .wr-ed .field{background:var(--surface)}
.rs-btn[aria-checked="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.nt-card .wr-act,.ps-wl .wr-act,.nt-card .wr-ed .field,.ps-wl .wr-ed .field,.nt-card .rs-btn,.ps-wl .rs-btn{background:var(--fill)}
.nt-card .rs-btn[aria-checked="true"],.ps-wl .rs-btn[aria-checked="true"]{background:var(--accent-soft)}
.nt-card .wr-act.accent,.ps-wl .wr-act.accent{background:var(--accent-soft)}
.nt-card .wr-act.danger.armed,.ps-wl .wr-act.danger.armed{background:var(--danger)}
/* 장 상세 오답 칸 */
.ps-wl{margin:0 -14px -6px;border-radius:0;background:transparent}
/* 오답 노트 */
.wr-add-t{margin-top:18px}
.nt-card{margin:0;background:var(--surface);box-shadow:var(--card-shadow)}
.nt-chips{margin-bottom:10px}
.nt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.nt-tog{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);background:var(--fill);font-size:13.5px;font-weight:500;color:var(--fg-2);transition:background-color .2s,color .2s}
.nt-tog[aria-pressed="true"],.nt-tog.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.nt-x{font-size:16px;line-height:1}
.nt-imp{margin:0 0 14px}
.nt-gn{margin:18px 4px 8px}
.nt-box>.nt-gn:first-of-type{margin-top:4px}
.nt-none{margin:24px 4px;font-size:14px;color:var(--muted)}
.pn-link{display:inline-flex;align-items:center;gap:5px;height:32px;margin-left:auto;padding:0 0 0 8px;font-size:14px;font-weight:500;color:var(--accent)}
.pn-link .ic{width:7px;height:11px}
.ws-btn{width:100%;text-align:left;color:inherit;border-radius:var(--r);transition:background-color .15s}
.ws-btn:active{background:var(--surface-2)}
@media (hover:hover){.ws-btn:hover{background:var(--surface-2)}}
/* 모의고사에서 복사한 박스 */
.q-mk{flex:none;margin-left:6px;padding:1px 6px;border-radius:var(--r);background:var(--fill);font-size:11px;font-weight:600;color:var(--fg-2);vertical-align:1px}
.q-title .q-mk{margin-left:0}
.q-src{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:0;font-size:12.5px;font-weight:500;color:var(--accent);text-align:left}
.q-src .ic{width:6px;height:10px}
.q-src+p{padding-top:4px}
/* 홈 네 칸: 위 줄은 화면을 채우며 가운데, 아래 줄은 선 아래 */
.hm-grid{position:relative;flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,390px);grid-template-rows:minmax(0,1fr) auto;gap:0 40px}
.hm-grid>[data-unit]{min-width:0;container-type:inline-size}
.hm-grid>[data-unit]:nth-child(-n+2){align-self:center;margin:26px 0}
.hm-grid>.hm-dd:nth-child(-n+2){padding:0 2px}
.hm-grid>.hm-q{box-shadow:none}
.hm-grid>[data-unit]:nth-child(n+3){align-self:start}
.hm-grid::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;grid-row:2;grid-column:1/-1;background:var(--sep);pointer-events:none}
@supports (font-size:1cqi){
  .hm-grid .hm-big{font-size:clamp(64px,30cqi,224px)}
  .hm-grid .hm-qbig{font-size:clamp(52px,20cqi,132px)}
  .hm-grid .hm-off .off-word{font-size:clamp(44px,18cqi,120px)}
}
@media (max-width:899px){
  .hm-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;align-content:start}
  .hm-grid::after{display:none}
  .hm-grid>[data-unit]:nth-child(-n+2){align-self:start;margin:14px 0}
  .hm-grid>[data-unit]:nth-child(n+3){margin-top:14px;box-shadow:inset 0 1px 0 var(--sep)}
}
/* 퀘스트 오늘 할 일: 반복퀘스트 / 과목별 */
.q-units{display:flex;flex-direction:column;gap:28px}
.q-units>.rzone{margin-bottom:0}
/* 모의고사 첫 화면 칸 */
.mk-units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px var(--gap);align-items:start}
.mk-units>[data-unit]{grid-column:1/-1;min-width:0}
.mk-units>.mk-half{grid-column:auto}
.mk-units>.mk-sum{margin:0 4px}
.mk-list>.mk-h{margin-top:10px}
@media (max-width:899px){.mk-units>.mk-half{grid-column:1/-1}}
/* 모의고사 한 종류 화면 칸 */
.md-units{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.md-units>*{margin-top:0}
.md-units>[hidden]{display:none}
/* 회독표 과목 칸 */
.rd-units{display:flex;flex-direction:column;gap:var(--gap)}
/* 챕터별 성취도: 과목 이름 옆 성취도 · 장은 넓으면 세 줄 */
.ch-sh{align-items:center;gap:12px}
.ch-sh b{flex:none}
.ch-sb{flex:1 1 auto;max-width:300px;height:8px}
.ch-sh .sb-pct{flex:none;width:44px;text-align:left;font-size:14px;font-weight:600;color:var(--fg-2)}
.ch-panel .cb{columns:3 250px;column-gap:28px}
.ch-secs{columns:3 250px;column-gap:28px}
.cb-row{grid-template-columns:minmax(0,1.6fr) minmax(36px,1fr) 38px 40px 8px;gap:8px}
.cb-row .cb-wr{font-size:12px;color:var(--muted);white-space:nowrap}
.ch-flat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 28px;margin-top:22px}
.ch-flat .ch-sh{padding:6px 0 8px;box-shadow:inset 0 -1px 0 var(--sep)}
.ch-subj.flat+.ch-subj.flat{margin-top:0}
@media (max-width:520px){.cb-row{grid-template-columns:minmax(0,1fr) 48px 38px 40px 8px}}
/* 캘린더: 접으면 긴 막대(이번 주), 누르면 펼침 */
.cal-head{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 16px;text-align:left;color:inherit}
.cal-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.cal-head>.ic{flex:none;width:8px;height:13px;margin-left:auto;color:var(--faint);transform:rotate(90deg);transition:transform .45s var(--ease)}
.cal-sec.open .cal-head>.ic{transform:rotate(-90deg)}
.cal-strip{flex:1 1 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:560px;margin-left:auto;transition:opacity .3s}
.cal-strip i{display:flex;align-items:baseline;justify-content:center;gap:5px;height:28px;line-height:28px;border-radius:var(--r);background:rgba(var(--accent-rgb),var(--heat,0));font-style:normal;font-size:13px;font-weight:600;color:var(--fg-2)}
.cal-strip i small{font-size:11px;font-weight:500;color:var(--muted)}
.cal-strip i.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-strip i.off{color:var(--faint)}
.cal-strip i.out{opacity:.35}
.cal-sec.open .cal-strip{opacity:0;pointer-events:none}
.cal-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.cal-sec.open .cal-wrap{grid-template-rows:1fr}
.cal-wrap>div{min-height:0;overflow:hidden}
.cal-sec.open .cal-wrap>div{box-shadow:inset 0 1px 0 var(--sep)}
@media (max-width:599px){.cal-strip{display:none}}
/* 공부 기록 분석 칸 */
.sx{padding:14px 16px 14px}
.sx-pad{padding:16px}
.sx-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px}
.sx-big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sx-big.up{color:var(--up)}
.sx-big.down{color:var(--danger)}
.sx-cap{font-size:13px;color:var(--muted)}
.sx-leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-left:auto;font-size:12px;color:var(--muted)}
.sx-leg i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:var(--r);vertical-align:-1px}
.sx-leg i.c{background:var(--accent)}
.sx-leg i.p{background:var(--fill-2)}
.sx-plot{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:140px;box-shadow:inset 0 -1px 0 var(--sep)}
.sx-col{position:relative;min-width:0}
.sx-prev{position:absolute;left:0;right:0;bottom:0;background:var(--fill-2)}
.sx-cur{position:absolute;left:30%;right:30%;bottom:0;border-radius:var(--r) var(--r) 0 0;background:rgba(var(--accent-rgb),.55);transform-origin:50% 100%;animation:growy .9s var(--ease) both}
.sx-cur.now{background:var(--accent)}
.sx-x,.sb7x{display:grid;padding-top:5px;font-size:11px;color:var(--muted);text-align:center}
.sx-x{grid-template-columns:repeat(7,minmax(0,1fr))}
.sx-x .today,.sb7x .today,.se-x .today{font-weight:700;color:var(--accent)}
.sh-plot{position:relative;height:130px;box-shadow:inset 0 -1px 0 var(--sep)}
.sh-plot svg{display:block;width:100%;height:100%;overflow:visible}
.sh-area{fill:rgba(var(--accent-rgb),.16)}
.sh-line{fill:none;stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke}
.sh-peak{position:absolute;margin-top:-6px;font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;transform:translate(-50%,-100%)}
.sh-x{position:relative;height:16px;margin-top:5px;font-size:11px;color:var(--muted)}
.sh-x span{position:absolute;transform:translateX(-50%)}
.sh-x span:first-child{transform:none}
.sh-x span:last-child{transform:translateX(-100%)}
.sb7{position:relative;display:grid;gap:8px;height:130px;padding-top:16px;box-shadow:inset 0 -1px 0 var(--sep)}
.sb7x{gap:8px}
.sb7 .bb{position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0;height:100%}
.sb7 .bb i{display:block;width:70%;max-width:34px;border-radius:var(--r) var(--r) 0 0;background:rgba(var(--accent-rgb),.45);transform-origin:50% 100%;animation:growy .9s var(--ease) both}
.sb7 .bb.hi i{background:var(--accent)}
.sb7 .bb b{position:absolute;left:50%;font-size:11px;font-weight:600;color:var(--fg-2);white-space:nowrap;transform:translateX(-50%)}
.sx-key{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);background:var(--fill);font-size:13px;color:var(--fg-2)}
.sx-key b{color:var(--accent)}
.se-plot{position:relative;height:170px;margin-left:34px;box-shadow:inset 0 -1px 0 var(--sep)}
.se-gl{position:absolute;left:0;right:0;height:1px;background:var(--sep)}
.se-yl{position:absolute;left:-34px;width:30px;font-size:10px;color:var(--muted);text-align:right;transform:translateY(50%)}
.se-cols{position:absolute;inset:0;display:grid;gap:3px}
.se-c{position:relative;min-width:0}
.se-bar{position:absolute;left:50%;width:6px;margin-left:-3px;background:rgba(var(--accent-rgb),.4);transform-origin:50% 100%;animation:growy .8s var(--ease) both}
.se-bar::before,.se-bar::after{content:"";position:absolute;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:var(--r)}
.se-bar::before{bottom:-4px;background:var(--accent)}
.se-bar::after{top:-4px;background:var(--faint)}
.se-c.today .se-bar{background:rgba(var(--accent-rgb),.7)}
.se-x{display:grid;gap:3px;margin-left:34px;padding-top:5px;font-size:10px;color:var(--muted);white-space:nowrap}
.se-sum{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
.se-sum b{margin-left:4px;font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
/* 프로젝트 퀘스트 */
.pz-card{overflow:hidden;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow),inset 3px 0 0 var(--accent)}
.pz-row{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main rates" "prog prog";align-items:center;gap:7px 14px;padding:11px 14px 12px 19px}
.pz-row+.pz-row{box-shadow:inset 0 1px 0 var(--sep)}
.pz-row::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fillc,transparent);transform:scaleX(0);transform-origin:left center;transition:transform .6s var(--ease)}
.pz-row::after{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--barc,transparent);transform:scaleY(0);transition:transform .4s var(--ease)}
.pz-row.res::before{transform:scaleX(1)}
.pz-row.res::after{transform:scaleY(1)}
.pz-row[data-s="1"]{--fillc:var(--lv1-t);--barc:var(--lv1)}
.pz-row[data-s="5"]{--fillc:var(--lv5-t);--barc:var(--lv5)}
.pz-row.ask{display:block;padding:0}
.pz-ask{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px 10px 19px;text-align:left;color:inherit;transition:background-color .15s}
.pz-ask:active{background:var(--surface-2)}
.pz-t{flex:0 1 auto;max-width:55%;overflow:hidden;font-size:16px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.pz-left{flex:1 1 auto;min-width:0;overflow:hidden;font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;text-overflow:ellipsis}
.pz-ask .ic{flex:none;width:7px;height:11px;color:var(--faint)}
.pz-main{grid-area:main;display:flex;align-items:center;gap:8px;min-width:0;padding:0;text-align:left;color:var(--fg)}
.pz-main .q-text{flex:0 1 auto;min-width:0;font-size:16px;font-weight:600}
.pz-plan{flex:none;padding:2px 8px;border-radius:var(--r);background:var(--accent-soft);font-size:12.5px;font-weight:700;color:var(--accent)}
.pz-rates{grid-area:rates;justify-self:end;margin:0}
.pz-row.res .q-text{color:var(--done)}
.pz-row.res .q-text::after{transform:scaleX(1)}
.pz-row.res .rt[aria-pressed="false"]{opacity:.14;transform:scale(.76)}
.pz-prog{grid-area:prog;display:flex;align-items:center;gap:10px;min-width:0;font-size:12.5px;color:var(--muted)}
.pz-bar{flex:1 1 auto;max-width:280px;height:6px;border-radius:var(--r);background:var(--fill);overflow:hidden}
.pz-bar i{display:block;height:100%;background:var(--accent);transition:width .6s var(--ease),background-color .3s}
.pz-pct{flex:none;font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.pz-num{flex:none;white-space:nowrap}
.pz-row.fin .pz-bar i{background:var(--up)}
.pz-row.fin .pz-pct{color:var(--up)}
@media (max-width:520px){.pz-num{display:none}}
/* 오늘 할 분량 고르기 */
.pa-head{display:flex;flex-direction:column;gap:5px;margin:2px 2px 18px}
.pa-head b{font-size:17px;font-weight:600}
.pa-head span{font-size:14px;font-weight:600;color:var(--accent)}
.pa-row{display:flex;align-items:center;justify-content:center;gap:14px}
.pa-step{width:58px;height:58px;border-radius:var(--r);background:var(--fill);font-size:28px;font-weight:500;color:var(--accent);transition:transform .2s var(--ease)}
.pa-step:active{transform:scale(.92)}
.pa-box{display:flex;align-items:baseline;gap:6px;font-size:18px;font-weight:600;color:var(--muted)}
.pa-in{width:116px;height:66px;border:0;border-radius:var(--r);background:var(--fill);font-size:34px;font-weight:700;text-align:center;color:var(--fg);outline:none}
.pa-in:focus{box-shadow:0 0 0 2px var(--accent)}
.pa-row+.sh-err{text-align:center}
.pj-list{padding:2px 0}
.pj-row{display:block;width:100%;padding:12px 16px;text-align:left;color:inherit;transition:background-color .15s}
.pj-row+.pj-row{box-shadow:inset 0 1px 0 var(--sep)}
.pj-row:active{background:var(--surface-2)}
.pj-top{display:flex;align-items:baseline;gap:10px}
.pj-top b{flex:1;min-width:0;overflow:hidden;font-size:15px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.pj-tag{flex:none;font-size:12px;font-weight:600;color:var(--muted)}

<script>
(function(){
'use strict';

/*LOGIC_START*/
var MS_DAY=86400000;
var WD='일월화수목금토';
var IMP_GAP=3, IMP_NEED=3, ONES_TO_IMP=2;
function pad2(n){return (n<10?'0':'')+n;}
function ymdToIdx(ymd){var p=ymd.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/MS_DAY);}
function idxToYmd(i){var d=new Date(i*MS_DAY);return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());}
function addDays(ymd,n){return idxToYmd(ymdToIdx(ymd)+n);}
function diffDays(a,b){return ymdToIdx(a)-ymdToIdx(b);}
function weekdayOf(ymd){return new Date(ymdToIdx(ymd)*MS_DAY).getUTCDay();}
function weekStart(ymd){return addDays(ymd,-((weekdayOf(ymd)+6)%7));}
function isYmd(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function intervalFor(iv,stage){return iv[Math.min(stage,iv.length-1)];}
function stageDay(iv,stage){var s=0;for(var i=0;i<=stage;i++)s+=intervalFor(iv,i);return s;}
function copyItem(it){var o={};for(var k in it){if(k!=='before')o[k]=it[k];}o.history=(it.history||[]).slice();return o;}

/* 일반 일정: 새로 넣은 박스는 넣은 날이 0일 복습(fresh), 그다음 1·3·3·7·14일.
   1점이면 1일 단계로 리셋, 1점이 2번 연속이면 중요로 이동 */
function applyNormal(base,score,t,iv){
  var o=copyItem(base);
  var kind=(base.pulledOn===t&&base.nextDue>t)?'pull':(base.fresh?'first':'normal');
  o.history.push({date:t,stage:base.stage,score:score,kind:kind});
  o.score=score;
  delete o.fresh;
  if(score===1){
    var ones=(base.ones||0)+1;
    var fail=(ones===1||typeof base.failStage!=='number')?base.stage:base.failStage;
    if(ones>=ONES_TO_IMP){
      o.state='important';o.impStreak=0;o.impReturn=fail;o.ones=0;o.failStage=null;
      o.nextDue=addDays(t,IMP_GAP);
      return o;
    }
    o.ones=ones;o.failStage=fail;o.stage=0;
  }else{
    o.ones=0;o.failStage=null;o.stage=base.fresh?0:base.stage+1;
  }
  o.nextDue=addDays(t,intervalFor(iv,o.stage));
  return o;
}
/* 중요: 3일 간격, 5점 3번 연속이면 막혔던 단계의 바로 앞 단계를 끝낸 상태로 복귀 */
function applyImportant(base,score,t,iv){
  var o=copyItem(base);
  o.history.push({date:t,stage:base.stage,score:score,kind:'imp'});
  o.score=score;
  o.impStreak=(score===5)?(base.impStreak||0)+1:0;
  if(o.impStreak>=IMP_NEED){
    o.state='active';
    o.stage=(typeof base.impReturn==='number')?base.impReturn:0;
    o.impStreak=0;o.impReturn=null;o.ones=0;o.failStage=null;
    o.nextDue=addDays(t,intervalFor(iv,o.stage));
  }else{
    o.nextDue=addDays(t,IMP_GAP);
  }
  return o;
}
function reviewFrom(base,score,t,iv){return base.state==='important'?applyImportant(base,score,t,iv):applyNormal(base,score,t,iv);}
function viewBase(it,t){return (it.before&&it.before.date===t)?it.before.data:it;}
function isDoneToday(it,t){return !!(it.before&&it.before.date===t);}
function sectionOf(it,t){
  var b=viewBase(it,t);
  if(b.state==='important')return 'imp';
  if(b.nextDue===t)return 'daily';
  if(b.nextDue<t)return b.nextDue>=weekStart(t)?'short':'long';
  if(b.pulledOn===t)return 'pull';
  return null;
}
function isRequired(it,t){
  var s=sectionOf(it,t);
  if(s==='daily'||s==='short'||s==='long')return true;
  if(s==='imp')return viewBase(it,t).nextDue<=t;
  return false;
}
function canPull(it,t){return it.state==='active'&&!isDoneToday(it,t)&&it.nextDue>t;}
function homeLevel(it,t){
  if(it.score==null)return 0;
  if(isDoneToday(it,t))return it.score;
  var s=sectionOf(it,t);
  if(s==='daily'||s==='short'||s==='long'||s==='pull')return 0;
  if(s==='imp'&&it.nextDue<=t)return 0;
  return it.score;
}
/* 지난 날로 가서 볼 때: 그날 한 복습인데 그 뒤에 다시 복습해서 그날 기준으로는 고칠 수 없는 박스 (완료로만 셈) */
function lockedOn(it,t){
  if(isDoneToday(it,t))return false;
  return (it.history||[]).some(function(e){return e.date===t&&e.kind!=='pull';});
}
function reviewedAfter(it,t){return (it.history||[]).some(function(e){return e.date>t;});}
function dayStats(items,t){
  var goal=0,done=0;
  items.forEach(function(it){
    if(isRequired(it,t)){goal++;if(isDoneToday(it,t))done++;}
    else if(lockedOn(it,t)){goal++;done++;}
  });
  return {goal:goal,done:done};
}
function questCounts(items,t){
  var c={daily:0,open:0,imp:0};
  items.forEach(function(it){
    if(isDoneToday(it,t))return;
    var s=sectionOf(it,t);
    if(s==='daily'||s==='pull')c.daily++;
    else if(s==='short'||s==='long')c.open++;
    else if(s==='imp'&&it.nextDue<=t)c.imp++;
  });
  return c;
}
function achievement(items){var n=0,sum=0;items.forEach(function(i){if(i.score!=null){n++;sum+=(i.score-1)/4;}});return {n:n,pct:n?Math.round(sum/n*100):0};}
function historyCounts(items){var m={};items.forEach(function(it){(it.history||[]).forEach(function(e){m[e.date]=(m[e.date]||0)+1;});});return m;}
function streakDays(log,t){
  var n=0,d=t;
  for(var k=0;k<500;k++){
    var e=log[d];
    if(e&&e.off&&e.off.kind!=='half'){}
    else if(e&&e.goal>0&&e.done>=e.goal)n++;
    else if(e&&e.goal===0){}
    else if(k===0){}
    else break;
    d=addDays(d,-1);
  }
  return n;
}
function byDue(a,b,ka,kb){
  if(ka.nextDue!==kb.nextDue)return ka.nextDue<kb.nextDue?-1:1;
  if(a.createdAt!==b.createdAt)return a.createdAt<b.createdAt?-1:1;
  return a.id<b.id?-1:a.id>b.id?1:0;
}
function homeOrder(items){return items.slice().sort(function(a,b){return byDue(a,b,a,b);});}
function questOrder(items,t){return items.slice().sort(function(a,b){return byDue(a,b,viewBase(a,t),viewBase(b,t));});}
function detailOrder(items){
  return items.slice().sort(function(a,b){
    var sa=a.score==null?9:a.score,sb=b.score==null?9:b.score;
    if(sa!==sb)return sa-sb;
    return byDue(a,b,a,b);
  });
}
function niceMax(v){
  if(v<=4)return 4;
  var x=v/2,p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),c=[1,1.5,2,2.5,3,4,5,6,8,10];
  for(var i=0;i<c.length;i++){var s=c[i]*p;if(s>=x&&Math.round(s)===s)return 2*s;}
  return 20*p;
}
/* 여러 과목을 한 과목으로 합치기: 합쳐진 과목의 박스는 원래 과목 이름을 세부 분야(sub)로 가짐 */
function mergeGroup(subjects,target,members){
  var remap=Object.create(null),subName=Object.create(null);
  if(!subjects.some(function(s){return members.indexOf(s.name)>=0;}))return {subjects:subjects,remap:remap,subName:subName};
  var tgt=null,i;
  for(i=0;i<subjects.length;i++){if(subjects[i].name===target){tgt=subjects[i];break;}}
  if(!tgt){for(i=0;i<subjects.length;i++){if(members.indexOf(subjects[i].name)>=0){tgt=subjects[i];break;}}}
  var out=[];
  subjects.forEach(function(s){
    if(s===tgt){if(members.indexOf(s.name)>=0)subName[s.id]=s.name;out.push({id:s.id,name:target});}
    else if(members.indexOf(s.name)>=0){remap[s.id]=tgt.id;subName[s.id]=s.name;}
    else out.push(s);
  });
  return {subjects:out,remap:remap,subName:subName};
}
function mergeTaxSubjects(subjects){return mergeGroup(subjects,'세법',['법인세법','소득세법','부가가치세법']);}
function mergeEconSubjects(subjects){return mergeGroup(subjects,'경제학',['미시경제학','거시경제학']);}
function blankItem(id,subjectId,title,memo,created,iv){
  return {id:id,subject:subjectId,sub:null,ch:null,title:title,memo:memo,createdAt:created,stage:0,nextDue:created,fresh:true,score:null,state:'active',ones:0,failStage:null,impStreak:0,impReturn:null,pulledOn:null,history:[]};
}
/* 모의고사 회차: 글자 속 마지막 숫자를 회차 번호로 ("3회" → 3), 다음 회차는 가장 큰 번호 + 1 */
function roundNum(s){var m=/(\d+)(?!.*\d)/.exec(String(s==null?'':s));var n=m?+m[1]:0;return (n>=1&&n<=999)?n:0;}
function nextRoundNum(rounds){var mx=0;rounds.forEach(function(r){if(r.n>mx)mx=r.n;});return Math.min(999,mx+1);}
function upsertRound(rounds,n,score,date,id){
  var out=rounds.map(function(r){return {id:r.id,n:r.n,score:r.score,date:r.date,wrongs:(r.wrongs||[]).slice()};});
  for(var i=0;i<out.length;i++){if(out[i].n===n){out[i].score=score;return {rounds:out,status:'update'};}}
  out.push({id:id,n:n,score:score,date:date,wrongs:[]});
  out.sort(function(a,b){return a.n-b.n;});
  return {rounds:out,status:'add'};
}
/* 챕터 목록 붙여넣기: 한 줄에 하나, 앞의 숫자는 장 번호 ("4. CAPM과 APT", "제4장 …", "4) …"). 숫자가 없으면 앞 번호 + 1 */
function parseChapters(text){
  var out=[],used={},last=0;
  String(text==null?'':text).split(/\r?\n/).forEach(function(line){
    var s=line.trim();if(!s)return;
    var m=/^(?:제\s*)?(\d{1,3})\s*(?:장\.?|[.):,\-]|\s)\s*(.+)$/.exec(s);
    var n,name;
    if(m){n=+m[1];name=m[2].trim();}
    else if(/^\d{1,3}\.?$/.test(s))return;
    else{n=last+1;name=s;}
    if(!name||n<1||n>999||used[n])return;
    used[n]=1;last=Math.max(last,n);
    out.push({n:n,name:name.slice(0,60)});
  });
  out.sort(function(a,b){return a.n-b.n;});
  return out.slice(0,200);
}
/* 과목 구조 붙여넣기: '# 법인세법' 같은 줄로 세부 분야를 나누고, 그 아래는 장 목록. '#'이 없으면 장 목록만 */
function parseStruct(text){
  var lines=String(text==null?'':text).split(/\r?\n/);
  if(!lines.some(function(l){return /^\s*#/.test(l);})){var chs=parseChapters(text);return chs.length?[{name:null,chs:chs}]:[];}
  var out=[],cur=null,buf=[],seen={};
  function flush(){if(cur&&!seen[cur.name]){seen[cur.name]=1;cur.chs=parseChapters(buf.join('\n'));out.push(cur);}buf=[];}
  lines.forEach(function(l){
    var m=/^\s*#+\s*(.*)$/.exec(l);
    if(m){flush();var nm=m[1].trim().slice(0,30);cur=nm?{name:nm,chs:[]}:null;}
    else if(cur)buf.push(l);
  });
  flush();
  return out.slice(0,30);
}
/* 틀린 파트를 묶는 키: 목차로 고른 건 's:세부|장', 직접 적은 건 'p:글자' */
function wrongKey(w){return (w.ch!=null||!!w.sub)?'s:'+(w.sub||'')+'|'+(w.ch!=null?w.ch:''):'p:'+(w.part||'');}
/* 모의고사 오답을 파트별로 모아서 많이 틀린 순서로 */
function wrongSummary(seriesList){
  var map={},order=[];
  seriesList.forEach(function(s){(s.rounds||[]).forEach(function(r){(r.wrongs||[]).forEach(function(w){
    var byPart=w.ch!=null||!!w.sub,key=wrongKey(w);
    var g=map[key];
    if(!g){g=map[key]={key:key,sub:byPart?(w.sub||null):null,ch:w.ch!=null?w.ch:null,part:byPart?'':(w.part||''),count:0,by:{}};order.push(g);}
    g.count++;g.by[w.reason]=(g.by[w.reason]||0)+1;
  });});});
  return order.map(function(g,i){g._i=i;return g;}).sort(function(a,b){return b.count-a.count||a._i-b._i;}).map(function(g){delete g._i;return g;});
}
/* 휴무: 오늘을 달력에서 없는 날로 침. 오늘 이미 한 것은 그대로 두고,
   나머지(오늘 할 일 + 앞으로의 모든 일정)를 하루씩 뒤로. 지난 날짜에 멈춘 미해결은 그대로.
   계획 한 줄 = [id, 원래 날짜, 옮긴 날짜, 원래 가져온 날] → 취소할 때 그대로 되돌림 */
var OFF_KINDS=['week','plan','sick','skip'];
function offPlan(items,t){
  var out=[];
  items.forEach(function(it){
    if(isDoneToday(it,t)||it.nextDue<t||reviewedAfter(it,t))return;
    out.push([it.id,it.nextDue,addDays(it.nextDue,1),it.pulledOn||null]);
  });
  return out;
}
/* 무단 절반: 오늘 할 일(일일 + 날짜가 된 중요) 가운데 무작위 절반(올림)만 내일로 */
function halfPlan(items,t,rand){
  var pool=items.filter(function(it){
    if(isDoneToday(it,t))return false;
    var s=sectionOf(it,t);
    return s==='daily'||(s==='imp'&&it.nextDue<=t);
  });
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(rand()*(i+1));var x=pool[i];pool[i]=pool[j];pool[j]=x;}
  return pool.slice(0,Math.ceil(pool.length/2)).map(function(it){return [it.id,it.nextDue,addDays(t,1),it.pulledOn||null];});
}
function applyPlan(items,plan,t){
  var map={};items.forEach(function(it){map[it.id]=it;});
  plan.forEach(function(p){var it=map[p[0]];if(!it)return;it.nextDue=p[2];if(it.pulledOn===t)it.pulledOn=null;});
}
function undoPlan(items,plan,t){
  var map={},n=0;items.forEach(function(it){map[it.id]=it;});
  plan.forEach(function(p){
    var it=map[p[0]];
    if(!it||isDoneToday(it,t)||it.nextDue!==p[2])return;
    it.nextDue=p[1];if(p[3]===t)it.pulledOn=t;n++;
  });
  return n;
}
function offOf(log,d){var e=log[d];return (e&&e.off)?e.off:null;}
function isFullOff(log,d){var o=offOf(log,d);return !!(o&&o.kind!=='half');}
/* 사유별 결석 횟수 (무단 절반은 0.5) */
function offCounts(log){
  var c={week:0,plan:0,sick:0,skip:0};
  Object.keys(log).forEach(function(d){var o=offOf(log,d);if(!o)return;if(o.kind==='half')c.skip+=0.5;else if(c[o.kind]!=null)c[o.kind]+=1;});
  return c;
}
/* 이번 주(월~일)에 주휴무를 쓴 날 */
function weekRestDay(log,t){var ws=weekStart(t);for(var i=0;i<7;i++){var d=addDays(ws,i),o=offOf(log,d);if(o&&o.kind==='week')return d;}return null;}
/* 캘린더 예상: 지금 일정대로 제때 복습한다고 치고(1점 없이) 날짜마다 할 일을 이어서 셈.
   첫 번째는 정해진 날짜, 그 뒤는 예상(proj). 지난 날짜에 멈춘 미해결은 넣지 않음 */
function projectDays(items,t,iv,end){
  var map={};
  items.forEach(function(it){
    if(it.nextDue<t)return;
    var d=it.nextDue,stage=it.stage,imp=it.state==='important',fresh=!!it.fresh,proj=false;
    for(var g=0;g<400&&d<=end;g++){
      (map[d]||(map[d]=[])).push({id:it.id,proj:proj});
      proj=true;
      if(imp){d=addDays(d,IMP_GAP);continue;}

  return req.then(function(g){

/* 클라우드와 맞추기: 앱을 열 때, 다시 볼 때, 연결할 때 */
function cloudSync(){
  if(!cloud.meta||cloud.busy)return Promise.resolve();
  clearTimeout(cloud.retry);
  cloud.busy=true;setCloud('sync');
  return cloudFind().then(function(g){return g?gistData(g):null;}).then(function(remote){
    cloud.busy=false;cloud.stampOK=true;
    var base=cloud.meta.base||0,local=state.savedAt||0;
    if(!remote){cloud.ready=true;return cloudPush();}
    var rs=remote.savedAt||0;
    if(!base){
      /* 이 기기에서 처음 연결(또는 기기 저장이 날아간 뒤 다시 연결) */
      if(!hasData(state)||rs===local){cloud.ready=true;return cloudAdopt(remote,hasData(remote)?'클라우드에서 불러왔어요':'');}
      if(!hasData(remote)){cloud.ready=true;return cloudPush();}
      cloud.conflict=remote;cloud.ready=false;setCloud('ok');
      if(ui.tab==='settings')renderView();else toast('클라우드 연결 · 설정에서 어느 데이터를 쓸지 골라 주세요');
      return;
    }
    cloud.ready=true;
    if(rs>base&&local>base){
      /* 양쪽이 따로 바뀜: 더 최근 것을 쓰고 다른 쪽은 기기에 한 부 남김 */
      if(rs>=local){stash(state);return cloudAdopt(remote,'클라우드의 더 최근 데이터로 바꿨어요');}
      stash(remote);return cloudPush();
    }
    if(rs>base)return cloudAdopt(remote,'클라우드에서 최신 데이터를 받았어요');
    if(local>base)return cloudPush();
    cloud.lastAt=cloud.meta.lastAt||cloud.lastAt;setCloud('ok');
  },function(e){cloud.busy=false;cloud.stampOK=true;cloudFail(e);}).then(afterSyncPresets);
}
function cloudConnect(token){
  token=(token||'').trim();
  if(!/^[A-Za-z0-9_]{20,255}$/.test(token)){toast('토큰을 그대로 붙여 넣어 주세요');return;}
  cloud.meta={token:token,gistId:null,base:0,lastAt:0};cloud.ready=false;cloud.conflict=null;cloudMetaSave();
  cloud.connecting=true;cloud.stampOK=true;setCloud('sync');renderView();
  cloudSync().then(function(){
    cloud.connecting=false;
    if(cloud.status==='err'&&/토큰/.test(cloud.err)){cloud.meta=null;cloudMetaSave();toast('토큰이 맞지 않아요. gist 권한이 있는지 확인해 주세요');}

    if(ui.tab==='settings')renderView();

}

/* 사용자가 알려 준 모의고사 목록과 점수 기준(만점·목표·최소). 과락은 만점의 40%, 비율로 낸 값은 소수점 내림.
   앱에 한 번만 넣음(presets 표시). 같은 과목에 이름이 같은(띄어쓰기 무시, 한쪽이 다른 쪽을 품는) 모의고사가 있으면 기준만 바꿈 */
var MOCK_PRESET_ID='mock2611';
var MOCK_PRESET=[
  ['재무회계','기베모',35,32,28],['재무회계','함현재 모의고사',35,32,28],
  ['원가관리회계','기출',10,8,6],['원가관리회계','함현재 모의고사',10,8,6],
  ['세법','기출',40,32,25],['세법','함현재 모의고사',35,Math.floor(35*32/40),Math.floor(35*25/40)],
  ['재무관리','기출',24,22,20],['재무관리','이영우 모의고사',19,Math.floor(19*22/24),Math.floor(19*20/24)],
  ['상법','기출',40,38,32],['상법','빈지노',20,Math.floor(20*38/40),Math.floor(20*32/40)]

function presetKey(nm){return String(nm||'').replace(/\s+/g,'');}
function applyPresets(){
  if(!state)return false;
  if(state.presets&&state.presets[MOCK_PRESET_ID])return false;
  MOCK_PRESET.forEach(function(p){
    var sj=subjectByName(p[0]);if(!sj)return;
    p=[sj.id].concat(p.slice(1));
    var cfg={max:p[2],goal:p[3],min:p[4],fail:Math.floor(p[2]*0.4)},key=presetKey(p[1]);
    var ser=state.mocks.filter(function(m){
      if(m.subject!==p[0])return false;var mk=presetKey(m.name);
      return mk===key||(mk&&(mk.indexOf(key)>=0||key.indexOf(mk)>=0));
    })[0];
    if(ser)ser.cfg=cfg;
    else state.mocks.push({id:uid(),subject:p[0],name:p[1],rounds:[],cfg:cfg});
  });
  if(!state.presets)state.presets={};
  state.presets[MOCK_PRESET_ID]=1;

/* 복습 직전 상태(before)는 최근 14일 것까지 남겨 둠 → 지난 날로 가서 점수를 다시 고르거나 취소할 수 있음 */
function prune(t){
  var changed=false,rt=realToday(),keep=pastMin();
  state.items.forEach(function(it){
    if(it.before&&(it.before.date<keep||it.before.date>rt)){delete it.before;changed=true;}
    if(it.pulledOn&&it.pulledOn<t){it.pulledOn=null;changed=true;}
  });
  return changed;
}
/* 하루 기록(목표·완료). 지난 날로 와 있을 땐 다시 계산하지 않고, 이동한 뒤 고친 만큼만 원래 기록에 더하고 뺌
   (그 뒤에 늦게 해치운 박스는 지금 계산하면 그날 목표에서 빠져 버리기 때문) */
function logToday(t){
  var st=dayStats(state.items,t),e=state.dayLog[t],off=e&&e.off?e.off:null,goal=st.goal,done=st.done;
  if(t!==realToday()){
    var pb=ui.pastBase;
    if(!pb||pb.d!==t)return;
    if(!e&&st.goal===pb.sg&&st.done===pb.sd)return;
    done=Math.max(0,pb.done+(st.done-pb.sd));
    goal=Math.max(done,pb.goal+(st.goal-pb.sg));
  }
  if(off&&off.kind!=='half')goal=done;
  if(!e||e.goal!==goal||e.done!==done){
    var n={goal:goal,done:done};if(off)n.off=off;
    state.dayLog[t]=n;scheduleSave();
  }
}

/* ---------- DOM ---------- */
/* 자식 바꾸기 (null은 건너뜀. 기본 replaceChildren은 null을 'null' 글자로 넣음) */
function setKids(el,k){el.replaceChildren();addKids(el,k);return el;}
function addKids(el,k){
  if(k==null||k===false)return;
  if(Array.isArray(k)){k.forEach(function(x){addKids(el,x);});return;}
  el.appendChild(k&&k.nodeType?k:document.createTextNode(String(k)));
}
function h(tag,props){
  var el=document.createElement(tag);
  if(props){for(var k in props){
    var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='value')el.value=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,String(v));
  }}
  for(var i=2;i<arguments.length;i++)addKids(el,arguments[i]);
  return el;
}
var SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){var el=document.createElementNS(SVGNS,tag);for(var k in attrs)el.setAttribute(k,String(attrs[k]));return el;}
function iconEl(name){var s=document.createElement('span');s.className='ic';s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[name];return s;}

/* ---------- 움직임 ---------- */
var RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
function motion(){return !(RM&&RM.matches);}
function anim(el,kf,opt){if(!el||!motion()||!el.animate)return null;try{return el.animate(kf,opt);}catch(e){return null;}}
function finished(a){return (a&&a.finished)?a.finished.then(function(){},function(){}):Promise.resolve();}
function cancelAnims(el){if(el&&el.getAnimations)el.getAnimations().forEach(function(a){a.cancel();});}
function nextFrame(fn){requestAnimationFrame(function(){requestAnimationFrame(fn);});}
function flip(container,sel,mutate){
  var before={};
  container.querySelectorAll(sel).forEach(function(el){before[el.getAttribute('data-key')]=el.getBoundingClientRect();});
  mutate();
  if(!motion())return;
  container.querySelectorAll(sel).forEach(function(el){
    var b=before[el.getAttribute('data-key')],a=el.getBoundingClientRect();
    if(b){
      var dx=b.left-a.left,dy=b.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)anim(el,[{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:400,easing:EASE});
    }else anim(el,[{opacity:0,transform:'scale(.98)'},{opacity:1,transform:'none'}],{duration:300,delay:90,easing:EASE,fill:'backwards'});
  });
}
function measureSq(root){
  var m={};
  if(!root)return m;
  root.querySelectorAll('.sq[data-id]').forEach(function(el){
    var cs=getComputedStyle(el);
    m[el.getAttribute('data-id')]={r:el.getBoundingClientRect(),bg:cs.backgroundColor,fg:cs.color};
  });
  return m;
}
function morph(els,old){
  if(!motion())return;
  var i=0;
  els.forEach(function(el){
    var o=old[el.getAttribute('data-id')];if(!o)return;
    var r=el.getBoundingClientRect();if(!r.width)return;
    var cs=getComputedStyle(el);
    var dx=o.r.left-r.left,dy=o.r.top-r.top,sx=o.r.width/r.width,sy=o.r.height/r.height;
    anim(el,[{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',backgroundColor:o.bg,color:o.fg},{transform:'none',backgroundColor:cs.backgroundColor,color:cs.color}],{duration:580,easing:EASE,delay:Math.min(i++,40)*7,fill:'backwards'});
  });
}
function countUp(el,to,dur){
  if(!motion()){el.textContent=String(to);return;}
  var t0=null;
  function step(ts){if(t0==null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=String(Math.round(to*e));if(p<1)requestAnimationFrame(step);}
  el.textContent='0';requestAnimationFrame(step);
}

var toastEl=null,toastTimer=null,toastSeq=0;
function toast(msg){
  if(!toastEl){toastEl=h('div',{class:'toast',role:'status','aria-live':'polite'});document.body.appendChild(toastEl);}
  var seq=++toastSeq;
  cancelAnims(toastEl);
  toastEl.textContent=msg;toastEl.hidden=false;
  anim(toastEl,[{opacity:0,transform:'translate(-50%,10px) scale(.96)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:340,easing:EASE});
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){
    var a=anim(toastEl,[{opacity:1},{opacity:0}],{duration:240,fill:'forwards'});
    finished(a).then(function(){if(seq!==toastSeq)return;toastEl.hidden=true;if(a)a.cancel();});
  },1900);
}

/* ---------- 메모 수식: $…$ 는 줄 안에, $$…$$ 는 한 줄 크게 (노션처럼 \frac{1}{2}, \times …) ----------
   메모에만 씀. KaTeX로 MathML을 만들어 브라우저가 직접 그림(따로 글꼴·스타일 필요 없음).
   KaTeX는 수식이 든 메모를 처음 볼 때만 내려받고, 못 받으면(인터넷 없음) 글자 그대로 보여 줌.
   달러 기호를 글자로 쓰려면 \$ */
var KATEX_URL='https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js';
var katexState=null;
var TEX_RE=/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\s$](?:[^$\n]*?[^\s$\\])?)\$/g;

    out.push({m:(m[1]||m[2]||m[3]||m[4]).replace(/\u0000/g,'\\$'),d:m[1]!=null||m[2]!=null});
    last=TEX_RE.lastIndex;

function dayBrief(t){
  var req=state.items.filter(function(it){return isRequired(it,t);});
  var total=req.length,by={},doneN=0;
  req.forEach(function(it){var o=by[it.subject]||(by[it.subject]={n:0,left:0});o.n++;if(isDoneToday(it,t))doneN++;else o.left++;});
  var left=total-doneN;

  /* 평소 = 지난 14일 하루 할 일 평균 (휴무·할 일 없던 날 빼고, 3일 이상 있을 때만) */
  var sum=0,days=0;

  var avg=days>=3?sum/days:null,ratio=avg?total/avg:null;

  var nd=Object.keys(hd).length,c=questCounts(state.items,t);

  if(!total){tone='light';tag='가벼운 날';lines.push('오늘은 복습할 퀘스트가 없어요. 반복퀘스트나 새 진도에 시간을 쓰세요.');}
  else if(!left){tone='done';tag='다 했어요';lines.push('오늘 복습 '+total+'개를 다 끝냈어요.');}
  else{
    var top=subs[0],sec=subs[1];
    if(sec)lines.push((doneN?'남은 '+left+'개 중 ':'오늘은 ')+top.name+'('+top.left+'개)'+josa(top.name,'이','가')+' 가장 많고, '+sec.name+'('+sec.left+'개)'+josa(sec.name,'이','가')+' 그다음이에요.');
    else lines.push((doneN?'남은 건 ':'오늘은 ')+top.name+' '+top.left+'개뿐이에요.');
    if(ratio!=null){
      var av=Math.round(avg);
      if(ratio>=1.6){tone='heavy';tag='아주 많은 날';lines.push('평소(하루 '+av+'개)의 '+fmtNum(Math.round(ratio*10)/10)+'배예요. 오래 걸릴 수 있으니 시간을 넉넉히 잡고 일찍 시작하세요.');}
      else if(ratio>=1.25){tone='busy';tag='많은 날';lines.push('평소(하루 '+av+'개)보다 '+Math.round((ratio-1)*100)+'% 많아서 시간이 더 걸릴 거예요.');}
      else if(ratio<=0.75){tone='light';tag='가벼운 날';lines.push('평소(하루 '+av+'개)보다 적은 날이에요.');}
      else lines.push('평소(하루 '+av+'개)와 비슷한 양이에요.');
    }else if(total>=60){tone='heavy';tag='아주 많은 날';lines.push('오늘 '+total+'개라 오래 걸릴 수 있어요. 시간을 넉넉히 잡아 두세요.');}
    else if(total>=35){tone='busy';tag='많은 날';lines.push('오늘 '+total+'개로 양이 꽤 돼요.');}
    var u=(nd>=3&&hs[top.sid])?hs[top.sid]/nd:null;
    if(u&&top.left>=8&&top.left>=u*1.5)warn=top.name+josa(top.name,'은','는')+' 평소(하루 '+Math.round(u)+'개)의 '+fmtNum(Math.round(top.left/u*10)/10)+'배라 제일 오래 걸릴 거예요. 먼저 시작하는 걸 추천해요.';
    else if(c.open>=10)warn='미해결이 '+c.open+'개 밀려 있어요. 오래 둘수록 더 잊으니 먼저 털어내요.';
    else if(c.imp>=5)warn='중요 복습이 '+c.imp+'개 있어요. 틀렸던 것들이라 시간이 더 걸려요.';
  }

function classify(t){

/* 과목 안에서는 목차 순서(세부 분야 → 장)대로 */
function partKey(it){
  var secs=structOf(it.subject);if(!secs.length)return 0;
  var si=0;
  if(hasSubs(it.subject)){si=secs.length;for(var i=0;i<secs.length;i++){if(secs[i].name===it.sub){si=i;break;}}}
  return si*1000+(it.ch!=null?it.ch:999);
}
function boardOrder(items,t,dueFirst){
  return items.slice().sort(function(a,b){
    var ba=viewBase(a,t),bb=viewBase(b,t);
    if(dueFirst){var da=ba.nextDue<=t?0:1,db=bb.nextDue<=t?0:1;if(da!==db)return da-db;}
    var ka=partKey(a),kb=partKey(b);if(ka!==kb)return ka-kb;
    return byDue(a,b,ba,bb);
  });
}
function mixedRows(items,t,kind,keyp){

    /* 중요는 오늘 할 것 먼저, 아직 날짜가 안 된 것은 아래로 */
    var list=boardOrder(items.filter(function(i){return i.subject===s.id;}),t,kind==='imp');
    if(!list.length)return;
    out.push(h('div',{class:'qc-sub','data-key':'sub-'+(keyp||kind)+'-'+s.id},s.name));
    list.forEach(function(it){out.push(qRow(it,t,kind));});

/* 중요: 오늘 할 것만 펼쳐 두고, 날짜가 아직인 것은 '다음 차례'로 접어 둠 */
function impRows(items,t){

function todayKids(t,g){

    var card=qCard('qc-day'+(nocode?' nocode':''),'d-'+s.id,s.name,null,list.map(function(it){return qRow(it,t,'daily');}),'오늘 없음',hasSubs(s.id)?MIX_CODEW:'22px');

    cells.length?grid:h('p',{class:'qz-empty'},'오늘 할 과목 퀘스트가 없어요'),

/* ---------- 프로젝트 퀘스트 ----------

   누르면 오늘 할 분량을 고르고, 그 분량을 다른 퀘스트처럼 빨강(못 함)·초록(다 함)으로 처리 */

function projStrip(p,t){

function projPanel(t){

/* ---------- 칸 옮기기: 꾹 누르면(0.45초) 칸이 들리고, 끌어다 놓으면 그 자리로 ----------
   과목 칸([data-sid])은 과목 순서 자체를, 페이지 칸([data-unit])은 그 페이지의 칸 순서(state.layout)를 바꿈.

var RD={press:null,drag:null,suppress:false,supT:0};
var RD_HOLD=450,RD_TOL=9;
var RD_SKIP='.rt,.q-skip,.dt-edit,input,textarea,select,form,.td-chk,.q-src,.rd-c,.ch-plot';
function rdAttr(grid){return grid.hasAttribute('data-units')?'data-unit':'data-sid';}
function armReorder(grid,key){
  if(key)grid.setAttribute('data-units',key);
  grid.addEventListener('pointerdown',function(e){if(e.pointerType==='touch'||e.button!==0||e._rd)return;if(rdPress(grid,e.target,e.clientX,e.clientY))e._rd=1;});
  grid.addEventListener('touchstart',function(e){if(e._rd)return;if(e.touches.length!==1){rdCancel();return;}var p=e.touches[0];if(rdPress(grid,e.target,p.clientX,p.clientY))e._rd=1;},{passive:true});
  grid.addEventListener('touchmove',function(e){var p=e.touches[0];if(!p)return;if(RD.drag){if(RD.drag.grid!==grid)return;e.preventDefault();rdMove(p.clientX,p.clientY);}else if(RD.press&&RD.press.grid===grid)rdMaybeCancel(p.clientX,p.clientY);},{passive:false});

  grid.addEventListener('contextmenu',function(e){if(RD.press||RD.drag)e.preventDefault();});
  return grid;
}
function rdPress(grid,target,x,y){
  if(RD.drag||busy||activeSheet||!target||!target.closest)return false;
  if(target.closest(RD_SKIP))return false;
  var at=rdAttr(grid),card=target.closest('['+at+']');
  while(card&&card.parentNode!==grid)card=card.parentNode&&card.parentNode.closest?card.parentNode.closest('['+at+']'):null;
  if(!card)return false;
  if(Array.prototype.filter.call(grid.children,function(el){return el.hasAttribute(at);}).length<2)return false;
  rdCancel();
  RD.press={grid:grid,card:card,x:x,y:y,timer:setTimeout(rdBegin,RD_HOLD)};
  return true;
}
/* 페이지 칸: 저장된 순서대로 놓기. 저장에 없는 칸(새로 생긴 칸)은 기본 순서에서 바로 앞 칸 뒤에 */
function unit(el,k){if(el)el.setAttribute('data-unit',k);return el;}
function applyLayout(grid,key){
  var kids=Array.prototype.filter.call(grid.children,function(el){return el.hasAttribute('data-unit');});
  var def=kids.map(function(el){return el.getAttribute('data-unit');});
  grid._def=def;
  var ord=state.layout&&state.layout[key];
  if(ord&&kids.length>1){
    var pos={},base=LAYOUT_DEF[key]||def;
    ord.forEach(function(k,i){if(!(k in pos))pos[k]=i;});
    var eff=kids.map(function(el,i){
      var k=def[i];if(k in pos)return {el:el,p:pos[k],i:i};
      var j=base.indexOf(k),p=-1;
      for(var b=(j<0?i:j)-1;b>=0;b--){var bk=(j<0?def:base)[b];if(bk in pos){p=pos[bk];break;}}
      return {el:el,p:p+0.5,i:i};
    });
    eff.sort(function(a,b){return a.p-b.p||a.i-b.i;});
    eff.forEach(function(x){grid.appendChild(x.el);});
  }
  return armReorder(grid,key);
}
/* 끌어서 바꾼 순서 저장: 지금 안 보이는 칸(조건부로 숨은 칸)은 예전 자리 그대로 두고 보이는 칸끼리만 새 순서로 */
function saveLayout(grid){
  var key=grid.getAttribute('data-units');if(!key)return false;
  var vis=Array.prototype.filter.call(grid.children,function(el){return el.hasAttribute('data-unit');}).map(function(el){return el.getAttribute('data-unit');});
  var old=(state.layout&&state.layout[key])||LAYOUT_DEF[key]||grid._def||vis,inVis={},q=vis.slice(),out=[];
  vis.forEach(function(k){inVis[k]=1;});
  old.forEach(function(k){if(inVis[k]){if(q.length)out.push(q.shift());}else if(out.indexOf(k)<0)out.push(k);});
  out=out.concat(q);
  var prev=(state.layout&&state.layout[key])||LAYOUT_DEF[key]||grid._def||[];
  if(out.join('\n')===prev.join('\n'))return false;
  if(!state.layout)state.layout={};
  state.layout[key]=out.slice(0,80);saveNow();
  return true;
}
var LAYOUT_DEF={
  home:['dd','brief','quest','rep'],quest:['proj','rep','subj'],late:['open','imp'],
  stats:['kpis','wh','rep','proj','ch','cal','daily','weekly'],study:['kpis','cols','grass','day','subj','week','hours','wday','sess','range','rest'],
  mock:['sum','tiles','recent','wrongs','list'],series:['chart','sum','list'],
  settings:['cloud','exam','past','intro','study','review','color','subj','ch','layout','backup','data']

function rdMaybeCancel(x,y){if(RD.press&&(Math.abs(x-RD.press.x)>RD_TOL||Math.abs(y-RD.press.y)>RD_TOL))rdCancel();}
function rdCancel(){if(RD.press){clearTimeout(RD.press.timer);RD.press=null;}}
function rdBegin(){

function rdPlace(){

function rdHit(){
  var d=RD.drag,gr=d.grid.getBoundingClientRect(),px=d.x-gr.left,py=d.y-gr.top,at=rdAttr(d.grid);
  var cards=Array.prototype.filter.call(d.grid.children,function(el){return el.hasAttribute(at);});
  for(var i=0;i<cards.length;i++){
    var c=cards[i];if(c===d.card)continue;
    if(px>=c.offsetLeft&&px<=c.offsetLeft+c.offsetWidth&&py>=c.offsetTop&&py<=c.offsetTop+c.offsetHeight)return c;
  }

}
function stopFlips(el){if(el.getAnimations)el.getAnimations().forEach(function(a){if(!(window.CSSAnimation&&a instanceof window.CSSAnimation))a.cancel();});}
function rdMove(x,y){
  var d=RD.drag;if(!d)return;
  d.x=x;d.y=y;

  if(over&&over!==d.last){
    var grid=d.grid,kids=Array.prototype.slice.call(grid.children);
    var others=kids.filter(function(el){return el!==d.card;});
    var before=others.map(function(el){return el.getBoundingClientRect();});
    if(kids.indexOf(d.card)<kids.indexOf(over))grid.insertBefore(d.card,over.nextSibling);
    else grid.insertBefore(d.card,over);
    others.forEach(function(el,i){
      stopFlips(el);
      var a=el.getBoundingClientRect(),b=before[i],dx=b.left-a.left,dy=b.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)anim(el,[{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:320,easing:EASE});
    });

/* 끌고 있는 손가락이 화면 위아래 끝에 가면 천천히 스크롤 */

  if(v){var y0=window.scrollY;window.scrollBy(0,v);if(window.scrollY!==y0)rdMove(d.x,d.y);}
  d.raf=requestAnimationFrame(rdAuto);
}
function rdEnd(){
  var d=RD.drag;if(!d)return;
  RD.drag=null;cancelAnimationFrame(d.raf);

  if(rdAttr(d.grid)==='data-unit'){if(saveLayout(d.grid))toast('배치를 바꿨어요');return;}
  var prev=c.previousElementSibling;while(prev&&!prev.hasAttribute('data-sid'))prev=prev.previousElementSibling;
  var next=c.nextElementSibling;while(next&&!next.hasAttribute('data-sid'))next=next.nextElementSibling;
  if(moveSubject(c.getAttribute('data-sid'),prev?prev.getAttribute('data-sid'):null,next?next.getAttribute('data-sid'):null))toast('과목 순서를 바꿨어요');
}
function moveSubjectBy(sid,d){
  var i=-1;state.subjects.forEach(function(x,k){if(x.id===sid)i=k;});
  var j=i+d;if(i<0||j<0||j>=state.subjects.length)return;
  var a=state.subjects.slice(),x=a[i];a[i]=a[j];a[j]=x;state.subjects=a;
  saveNow();drawTrail();renderView();
}
/* 과목 삭제: 그 과목의 박스·모의고사·반복퀘스트·목차·회독표도 함께 */
function deleteSubject(sid){
  if(state.subjects.length<=1){toast('과목은 하나 이상 있어야 해요');return;}
  var nm=subjName(sid);
  if(state.timer&&state.timer.sid===sid&&state.timer.start)timerStop();
  state.subjects=state.subjects.filter(function(x){return x.id!==sid;});
  state.items=state.items.filter(function(x){return x.subject!==sid;});
  state.mocks=state.mocks.filter(function(x){return x.subject!==sid;});
  state.reps=state.reps.filter(function(x){return x.sid!==sid;});
  delete state.chapters[sid];delete state.lastCh[sid];
  if(state.reads)Object.keys(state.reads).forEach(function(k){if(k.indexOf(sid+'|')===0)delete state.reads[k];});
  if(state.timer&&state.timer.last===sid)state.timer.last=null;
  if(state.lastSubject===sid)state.lastSubject=null;
  if(state.mockSubject===sid)state.mockSubject=null;
  saveNow();drawTrail();renderView();toast(nm+' 과목을 지웠어요');
}
/* 옮긴 과목 하나만 새 이웃 옆으로. 다른 과목끼리의 순서는 그대로 */
function moveSubject(sid,afterSid,beforeSid){
  var list=state.subjects.slice(),i=-1,k;
  for(k=0;k<list.length;k++){if(list[k].id===sid)i=k;}
  if(i<0)return false;
  var s=list.splice(i,1)[0],j=-1;
  if(afterSid){for(k=0;k<list.length;k++){if(list[k].id===afterSid)j=k+1;}}
  else if(beforeSid){for(k=0;k<list.length;k++){if(list[k].id===beforeSid)j=k;}}
  if(j<0)j=afterSid?list.length:0;
  list.splice(j,0,s);
  var changed=list.some(function(x,k2){return x!==state.subjects[k2];});
  if(changed){state.subjects=list;saveNow();drawTrail();}
  return changed;
}

/* ---------- 공부 타이머 (왼쪽 틀) ----------
   시작 시각만 저장하고 지금 시각과의 차이로 셈 → 화면이 꺼지거나 앱을 닫아도 계속 잼.
   멈추면 새벽 4시 경계로 잘라 날짜·과목별로 쌓음. 6시간 넘게 켜져 있으면 다음에 열 때 확인 */
var LONG_RUN=6*3600000,trailTick=null,trailSig='';
var GOAL_DEF=12;
function goalSecs(){return (state&&state.studyGoal||GOAL_DEF)*3600;}
/* 페이스: from~to(하루 중 분) 동안 h시간을 고르게 채움. 새벽 4시 하루 경계 기준이라 자정 넘는 끝 시각도 됨 */
var PACE_DEF={from:450,to:1410,h:12};
function paceOf(){return state&&state.pace||PACE_DEF;}
function paceSecs(at){
  var p=paceOf();if(!(p.h>0))return 0;
  var d=at?new Date(at):new Date(),off=DAY_START_H*60,rel=function(x){return ((x-off)%1440+1440)%1440;};
  var a=rel(p.from),b=rel(p.to),now=rel(d.getHours()*60+d.getMinutes()+d.getSeconds()/60);
  return b>a?p.h*3600*Math.max(0,Math.min(1,(now-a)/(b-a))):0;
}
function timerOn(){return !!(state&&state.timer&&state.timer.sid&&state.timer.start);}
function studyOn(day,sid){
  var e=state.study[day],n=sid?((e&&e[sid])||0):sumDay(e);
  if(timerOn()&&(!sid||state.timer.sid===sid))n+=splitSession(state.timer.start,Date.now(),DAY_START_H,0)[day]||0;
  return n;
}
function fmtHM(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/3600)+':'+pad2(Math.floor(sec%3600/60));}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/3600)+':'+pad2(Math.floor(sec%3600/60))+':'+pad2(sec%60);}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));var hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60);if(hh&&mm)return hh+'시간 '+mm+'분';if(hh)return hh+'시간';if(mm)return mm+'분';return sec>0?'1분 미만':'0분';}
function subjName(id){var s=subjectById(id);return s?s.name:'';}
function timerCommit(end){
  var tm=state.timer;if(!timerOn())return 0;
  end=Math.max(tm.start,Math.min(end||Date.now(),Date.now()));
  var tot=addStudy(tm.sid,tm.start,end,false);
  tm.last=tm.sid;tm.sid=null;tm.start=null;tm.ok=null;
  return tot;
}
/* 공부 기록 더하기·빼기: 날짜별 합계와 시간대 기록을 같이 고침 (30초 미만 조각은 합계에만) */
function addStudy(sid,s,e,manual){
  var parts=splitSession(s,e,DAY_START_H,0),tot=0;
  for(var d in parts){var sec=Math.round(parts[d]);if(sec<=0)continue;var o=state.study[d]||(state.study[d]={});o[sid]=(o[sid]||0)+sec;tot+=sec;}
  if(e-s>=30000){var x={sid:sid,s:s,e:e};if(manual)x.m=true;state.sessions.push(x);state.sessions.sort(function(a,b){return a.s-b.s;});}
  return tot;
}
function removeStudy(x){
  var parts=splitSession(x.s,x.e,DAY_START_H,0);
  for(var d in parts){
    var o=state.study[d];if(!o)continue;
    var v=(o[x.sid]||0)-Math.round(parts[d]);
    if(v>0)o[x.sid]=v;else delete o[x.sid];
    if(!Object.keys(o).length)delete state.study[d];
  }
  state.sessions=state.sessions.filter(function(y){return y!==x;});
}
/* 공부 기록 탭을 보고 있으면 타이머를 켜고 끌 때 바로 다시 그림 */
function afterTimer(){if(ui.tab==='study'&&!activeSheet&&!busy)renderView();}
function timerStart(sid){
  var prev=timerOn()?state.timer.sid:null,got=prev?timerCommit():0;
  state.timer.sid=sid;state.timer.start=Date.now();state.timer.last=sid;state.timer.ok=null;
  saveNow();
  return {prev:prev,got:got};
}
function timerStop(){var sid=state.timer.sid,got=timerCommit();saveNow();return {sid:sid,got:got};}
/* 과목 줄: 꺼져 있으면 그 과목 시작, 다른 과목이 켜져 있으면 바꿔 잼, 같은 과목이면 멈춤 */
function onTrailSubject(sid){
  if(timerOn()&&state.timer.sid===sid){var r=timerStop();toast(subjName(r.sid)+' '+fmtDur(r.got)+' 기록했어요');}
  else{var reo=closedAt(realToday()),r2=timerStart(sid);toast(r2.prev?subjName(r2.prev)+' '+fmtDur(r2.got)+' 기록 · '+subjName(sid)+' 시작':reo?'마감을 풀고 '+subjName(sid)+' 다시 시작':subjName(sid)+' 측정 시작');}
  drawTrail();afterTimer();
}
function trailNext(){
  var tm=state.timer;
  if(tm.last&&subjectById(tm.last))return tm.last;
  return (state.lastSubject&&subjectById(state.lastSubject))?state.lastSubject:state.subjects[0].id;
}
function onTrailGo(){
  if(timerOn()){var r=timerStop();toast(subjName(r.sid)+' '+fmtDur(r.got)+' 기록했어요');}
  else{var reo=closedAt(realToday()),sid=trailNext();timerStart(sid);toast(reo?'마감을 풀고 '+subjName(sid)+' 다시 시작':subjName(sid)+' 측정 시작');}

  var go=document.getElementById('tr-go');if(go)anim(go,[{transform:'scale(.9)'},{transform:'scale(1.04)'},{transform:'none'}],{duration:420,easing:EASE});

function buildTrail(){

     뒤에는 페이스대로 차오르는 회색 물. 파란 물에 가려지면 회색 수면 선만 남음 */

/* 과목 줄은 과목 목록(순서·이름)이 바뀔 때만 다시 만들고, 나머지는 글자·위치만 고침 */
function drawTrail(){
  var el=document.getElementById('trail');if(!el||!state)return;
  var list=el.querySelector('#tr-list'),sig=state.subjects.map(function(s){return s.id+':'+s.name+':'+subjShortOf(s);}).join('|');
  if(sig!==trailSig){
    trailSig=sig;
    var kids=[h('span',{class:'tr-hl','aria-hidden':'true'})];
    state.subjects.forEach(function(s){
      var b=h('button',{class:'tr-sub',type:'button','data-sid':s.id},h('span',{class:'ts-n'},subjShort(s.name)),h('span',{class:'ts-t'},'0:00'),h('i',{class:'ts-bar'}));
      b.addEventListener('click',function(){onTrailSubject(s.id);});
      kids.push(b);
    });
    list.replaceChildren.apply(list,kids);
  }
  var on=timerOn(),cur=on?state.timer.sid:null,idx=-1;
  el.classList.toggle('on',on);
  document.body.classList.toggle('timing',on);
  list.querySelectorAll('.tr-sub').forEach(function(b,i){var me=b.getAttribute('data-sid')===cur;if(me)idx=i;b.classList.toggle('on',me);b.setAttribute('aria-pressed',String(me));});
  list.style.setProperty('--ti',String(Math.max(0,idx)));
  list.classList.toggle('has-on',idx>=0);
  var go=el.querySelector('#tr-go');
  go.setAttribute('aria-label',on?subjName(cur)+' 측정 멈추기':trailNext()&&subjName(trailNext())+' 측정 시작');
  go.querySelector('.tr-ic').innerHTML=ICONS[on?'stop':'play'];
  syncRing(on);
  tickTrail();
  if(on&&!trailTick)trailTick=setInterval(tickTrail,1000);
  if(!on&&trailTick){clearInterval(trailTick);trailTick=null;}
  updateCloseBtn();
}
/* 네모 테두리가 1분에 한 바퀴. 다시 그릴 때마다 측정 시작 시각에 맞춰 위치를 바로잡음 */
var ringAnim=null;
function syncRing(on){
  var r=document.querySelector('#tr-go .tr-ring rect');if(!r)return;
  if(!on){if(ringAnim){ringAnim.cancel();ringAnim=null;}return;}
  if(!ringAnim){if(!r.animate)return;ringAnim=r.animate([{strokeDashoffset:100},{strokeDashoffset:0}],{duration:60000,iterations:Infinity});}
  ringAnim.currentTime=Math.max(0,Date.now()-state.timer.start)%60000;
}
function tickTrail(){
  var el=document.getElementById('trail');if(!el||!state)return;
  var t=realToday(),on=timerOn(),max=60,tot=studyOn(t),lv=Math.min(1,tot/goalSecs()),cl=on?0:closedAt(t);
  el.querySelector('#tr-total').textContent=fmtHM(tot);
  el.classList.toggle('closed',!!cl);
  var wt=el.querySelector('.tr-water'),ps=paceSecs(cl),pl=Math.min(1,ps/goalSecs());
  wt.style.setProperty('--lvl',(lv*100).toFixed(2)+'%');
  wt.style.setProperty('--pace',(pl*100).toFixed(2)+'%');
  wt.classList.toggle('has-pace',ps>0);
  wt.classList.toggle('pace-hid',ps>0&&pl<=lv);
  el.querySelector('#tr-goal').textContent='목표 '+Math.floor(lv*100)+'%';
  var sess=el.querySelector('#tr-sess'),pick=el.querySelector('#tr-pick');
  if(on){
    var nm=subjShort(subjName(state.timer.sid)),clk=fmtClock((Date.now()-state.timer.start)/1000);
    sess.replaceChildren(h('span',{class:'tr-live'},h('i'),'측정 중'),h('b',null,nm),h('span',{class:'tr-clk'},clk));
    pick.textContent=subjName(state.timer.sid)+' · '+clk;
  }else if(cl){
    setKids(sess,[h('span',{class:'tr-cl'},'마감'),h('b',{class:'tr-clt'},hhmm(cl))]);
    pick.textContent='마감 '+hhmm(cl);
  }else{
    var nx=trailNext(),rs=liveRest();if(rs<60000)rs=0;
    setKids(sess,[rs?h('span',{class:'tr-rest'},'휴식'):null,rs?h('b',{class:'tr-rt'},fmtRest(rs)):null,h('span',{class:'tr-next'},nx?subjShort(subjName(nx)):'')]);
    pick.textContent=nx?subjName(nx):'과목';
  }
  var secs={};
  state.subjects.forEach(function(s){secs[s.id]=studyOn(t,s.id);if(secs[s.id]>max)max=secs[s.id];});
  el.querySelectorAll('.tr-sub').forEach(function(b){
    var id=b.getAttribute('data-sid'),v=secs[id]||0;
    b.querySelector('.ts-t').textContent=fmtHM(v);
    b.querySelector('.ts-bar').style.width=(v/max*100).toFixed(1)+'%';
    b.setAttribute('aria-label',subjName(id)+' 오늘 '+fmtDur(v)+(b.classList.contains('on')?', 측정 중, 누르면 멈춤':', 누르면 측정 시작'));
  });
}
/* 폰에서는 왼쪽 틀 대신 위 줄: 과목 이름을 누르면 고르는 창 */

/* 멈추는 걸 잊었을 때: 6시간 넘게 켜져 있으면 앱을 다시 열 때 한 번 물어봄 */
function checkLongRun(){
  if(!timerOn()||activeSheet||busy||intro)return;
  var tm=state.timer,el=Date.now()-tm.start;
  if(el<LONG_RUN||tm.ok===tm.start)return;
  var name=subjName(tm.sid),st=new Date(tm.start);
  var timeIn=h('input',{class:'field',type:'time',id:'tm-end','aria-label':'끝낸 시각'});
  var err=h('p',{class:'sh-err'});
  var keep=h('button',{class:'off-go ghost',type:'button'},'계속 공부 중이었어');
  var cut=h('button',{class:'off-go',type:'button',style:'--off-c:var(--accent)'},'이 시각에 끝냄');
  var drop=h('button',{class:'off-go ghost danger',type:'button'},'이번 기록 지우기');
  var api=openSheet({title:'타이머 확인',primary:false,cancel:'닫기',body:[h('div',{class:'off-box'},
    h('p',{class:'off-lead'},name+' 타이머가 '+(st.getMonth()+1)+'/'+st.getDate()+' '+pad2(st.getHours())+':'+pad2(st.getMinutes())+'부터 '+fmtDur(el/1000)+'째 켜져 있어. 멈추는 걸 잊었다면 끝낸 시각을 골라 줘.'),
    keep,h('div',{class:'tm-cut'},timeIn,cut),err,drop)]});
  keep.addEventListener('click',function(){tm.ok=tm.start;saveNow();api.close();});
  cut.addEventListener('click',function(){
    var v=timeIn.value;
    if(!/^\d{2}:\d{2}$/.test(v)){err.textContent='끝낸 시각을 골라 줘';return;}
    var now=new Date(),c=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+v.slice(0,2),+v.slice(3,5)).getTime();
    if(c>Date.now())c-=86400000;
    if(c<=tm.start){err.textContent='시작한 시각보다 뒤로 골라 줘';return;}
    var got=timerCommit(c);saveNow();api.close();drawTrail();renderView();toast(name+' '+fmtDur(got)+' 기록했어요');
  });
  drop.addEventListener('click',function(){tm.last=tm.sid;tm.sid=null;tm.start=null;tm.ok=null;saveNow();api.close();drawTrail();afterTimer();toast('이번 기록을 지웠어요');});
}

/* ---------- 하루 마감 · 휴식 ----------
   마감은 레일의 버튼을 눌러야만 됨(저절로 마감되는 일 없음). 누른 시각을 날짜별로 쌓아 둠.
   마감한 뒤 타이머를 다시 켜면 그날은 다시 열림(마감 시각은 남아서 그 사이는 휴식으로 안 셈).
   휴식 = 공부 사이 빈 시간. 4시간 넘게 비었거나 사이에 마감이 있으면 휴식이 아님 */
function closesOf(d){return (state.closed&&state.closed[d])||[];}
/* 새벽 4시가 지나 하루가 끝났는데 마감을 안 눌렀으면 그날 마지막 공부가 끝난 시각으로 마감(최근 7일) */
var acDay=null;
function autoCloseCheck(){var t=realToday();if(acDay===t||!state)return;acDay=t;if(autoClose(t)==='wait')acDay=null;}
function autoClose(t){
  var ch=false,wait=false;
  for(var i=1;i<=7;i++){
    var d=addDays(t,-i);
    if(timerOn()&&splitKey(state.timer.start)===d){wait=true;continue;}  /* 밤새 켜 둔 타이머: 멈춘 뒤 다음 확인 때 마감 */
    var segs=sessOnDay(state.sessions,d,DAY_START_H,0);if(!segs.length||closedAt(d))continue;
    var end=0;segs.forEach(function(g){if(g.e>end)end=g.e;});
    if(!state.closed)state.closed={};
    state.closed[d]=closesOf(d).concat([end]).slice(-6);ch=true;
  }
  if(ch)saveNow();
  return wait?'wait':ch;
}
function closedAt(d){
  var a=closesOf(d);if(!a.length)return 0;
  var c=a[a.length-1];

/* ---------- 검색: 박스(제목·메모·단원·과목)와 모의고사 오답. 띄어쓰기 상관없이, 여러 낱말은 모두 들어간 것만 ---------- */
var srchQ='';

function searchAll(q){
  var toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length)return null;
  var full=toks.join(''),items=[],wrongs=[];
  state.items.forEach(function(it){
    var sj=subjectById(it.subject);if(!sj)return;
    var tt=normQ(it.title),hay=tt+'|'+normQ(noteText(it))+'|'+normQ(partFull(it.subject,it.sub,it.ch))+'|'+normQ(sj.name)+'|'+normQ(subjShortOf(sj));
    if(!hitAll(hay,toks))return;
    items.push({it:it,sc:tt.indexOf(full)===0?4:tt.indexOf(full)>=0?3:hitAll(tt,toks)?2:1});
  });
  items.sort(function(a,b){return b.sc-a.sc||(a.it.createdAt<b.it.createdAt?1:a.it.createdAt>b.it.createdAt?-1:0);});
  allWrongs().forEach(function(x){
    var sid=studySid(x.ser.subject),tt=normQ(wrongTitle(sid,x.w));
    var hay=tt+'|'+normQ(x.w.memo)+'|'+normQ(wrongLabel(sid,x.w))+'|'+normQ(reasonName(x.w.reason))+'|'+normQ(x.ser.name)+'|'+normQ(mockSubjName(x.ser.subject));
    if(!hitAll(hay,toks))return;
    wrongs.push({x:x,sc:tt.indexOf(full)>=0?3:hitAll(tt,toks)?2:1});
  });

/* 찾은 낱말을 칠함(띄어쓰기 건너뛰고 맞춤) */
function markText(text,toks){
  text=String(text==null?'':text);
  var map=[],norm='',on=[],i;
  for(i=0;i<text.length;i++){var ch=text.charAt(i),lo=ch.toLowerCase();if(lo.length!==1)lo=ch;if(!/\s/.test(ch)){map.push(i);norm+=lo;}}
  toks.forEach(function(k){var p=0,j;while((j=norm.indexOf(k,p))>=0){for(var x=j;x<j+k.length;x++)on[map[x]]=1;p=j+k.length;}});
  var out=[],cur='',st=false;
  for(i=0;i<text.length;i++){var o=!!on[i];if(o!==st&&cur){out.push(st?h('mark',null,cur):cur);cur='';}st=o;cur+=text.charAt(i);}
  if(cur)out.push(st?h('mark',null,cur):cur);
  return out;
}
/* 메모에서 찾은 곳 앞뒤만 잘라 보여 줌 */
function snippet(text,toks){
  text=String(text||'').replace(/\s+/g,' ').trim();
  var map=[],norm='',i,best=-1;
  for(i=0;i<text.length;i++){var ch=text.charAt(i),lo=ch.toLowerCase();if(lo.length!==1)lo=ch;if(ch!==' '){map.push(i);norm+=lo;}}
  toks.forEach(function(k){var j=norm.indexOf(k);if(j>=0&&(best<0||j<best))best=j;});
  if(best<0)return '';
  var at=map[best],a=Math.max(0,at-14),b=Math.min(text.length,at+46);
  return (a>0?'…':'')+text.slice(a,b)+(b<text.length?'…':'');
}

function lineChart(key,series,ticks){

  if(cur.length)segs.push(cur);

  }));
  return h('div',{class:'chart-card'},
    h('div',{class:'ch-read','aria-live':'polite'},rb,rs),

function studyRangeBox(t){

function openStudyAdd(d){
  if(activeSheet||busy)return;
  var t=today();if(!isYmd(d)||d>t)d=t;
  var sid=[state.timer.last,state.lastSubject].filter(function(x){return x&&subjectById(x);})[0]||state.subjects[0].id;
  var picks=h('div',{class:'subj-pick',role:'radiogroup','aria-label':'과목',style:'margin:0 0 14px'});
  state.subjects.forEach(function(s){
    var p=h('button',{class:'pick',type:'button',role:'radio','data-sid':s.id,'aria-checked':String(s.id===sid)},s.name);
    p.addEventListener('click',function(){sid=s.id;picks.querySelectorAll('.pick').forEach(function(q){q.setAttribute('aria-checked',String(q.getAttribute('data-sid')===sid));});});
    picks.appendChild(p);

    h('div',{class:'sa-row'},h('label',null,h('span',null,'날짜'),dateIn),h('label',null,h('span',null,'시작'),sIn),h('label',null,h('span',null,'끝'),eIn)),
    h('p',{class:'set-note',style:'margin:10px 2px 0'},'새벽 4시 전은 그날 밤으로 쳐요'),err],onPrimary:save});
  function save(){
    var day=dateIn.value;
    if(!isYmd(day)||day>t){err.textContent='오늘까지의 날짜를 골라 주세요';return;}
    if(!/^\d{2}:\d{2}$/.test(sIn.value)||!/^\d{2}:\d{2}$/.test(eIn.value)){err.textContent='시작과 끝 시각을 골라 주세요';return;}
    var w=dayWindow(day,DAY_START_H,0);
    var at=function(v){var hh=+v.slice(0,2),mm=+v.slice(3,5),b=new Date(w[0]);b.setHours(hh,mm,0,0);var ms=b.getTime();if(hh<DAY_START_H)ms+=86400000;return ms;};
    var s=at(sIn.value),e=at(eIn.value);

    if(e>Date.now()){err.textContent='아직 지나지 않은 시각이에요';return;}
    var clash=null;
    state.sessions.forEach(function(x){if(x.s<e&&x.e>s)clash=x;});
    if(!clash&&timerOn()&&state.timer.start<e)clash={sid:state.timer.sid,s:state.timer.start,e:Date.now()};
    if(clash){err.textContent=hhmm(clash.s)+'–'+hhmm(clash.e)+' '+subjName(clash.sid)+' 기록과 겹쳐요';return;}
    var got=addStudy(sid,s,e,true);saveNow();api.close();ui.studySel=day;
    if(ui.tab==='study')renderView();
    drawTrail();toast(subjName(sid)+' '+fmtDur(got)+' 넣었어요');
  }
}

function cfgInputs(c,label){
  var ins={},row=h('div',{class:'cf-row'});

  return {el:row,ins:ins,read:function(){
    var v={};
    for(var j=0;j<CFG_F.length;j++){var raw=ins[CFG_F[j][0]].value.trim().replace(',','.'),x=Number(raw);if(raw===''||!isFinite(x)||x<0||x>1000)return {err:CFG_F[j][1]+' 점수를 숫자로 넣어 주세요',el:ins[CFG_F[j][0]]};v[CFG_F[j][0]]=Math.round(x*10)/10;}
    if(v.max<1)return {err:'만점은 1 이상이어야 해요',el:ins.max};

function chapterSection(){

  function pctTxt(list){var a=achievement(list);return a.n?a.pct+'%':'—';}
  /* 과목 이름 옆에 과목 성취도 막대 */
  function subjHead(sb,items){
    var a=achievement(items),lv=a.n?Math.max(1,Math.min(5,Math.round(1+4*a.pct/100))):0;
    return h('div',{class:'ch-sh','aria-label':sb.name+' 성취도 '+(a.n?a.pct+'%':'없음')},h('b',null,sb.name),
      h('span',{class:'sb-track ch-sb'},a.n?h('i',{class:'lv'+lv,style:'width:'+Math.max(a.pct,2)+'%'}):null),
      h('span',{class:'sb-pct'},a.n?a.pct+'%':'—'));

function chapterCard(sid,sub){

  var mk=subjectById(sid)?sid:null;
  var wmap={},wNone=0,wAll=0;
  if(mk)wrongSummary(state.mocks.filter(function(m){return m.subject===mk;})).forEach(function(g){
    if(g.key.slice(0,2)!=='s:'||(named&&g.sub!==sub))return;

  var known={};chs.forEach(function(c){known[c.n]=1;});

function closeSheet(instant){
  if(!activeSheet)return;
  var s=activeSheet;activeSheet=null;
  if(s.detach)s.detach();
  var fe=document.activeElement;if(fe&&s.wrap.contains(fe)&&fe.blur)fe.blur();
  if(instant||!motion()){s.wrap.remove();return;}
  var a1=anim(s.scrim,[{opacity:1},{opacity:0}],{duration:240,fill:'forwards'}),a2;
  if(s.kind==='drawer'){
    /* 반쪽 시트는 지금 자리(끌던 자리 포함)에서 아래로 떨어짐 */
    var y=sheetY(s.sheet);cancelAnims(s.sheet);s.sheet.style.transform='';
    a2=anim(s.sheet,[{transform:'translateY('+y+'px)'},{transform:'translateY('+(s.sheet.offsetHeight+24)+'px)'}],{duration:Math.max(170,280-y*.4),easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
  }else a2=anim(s.sheet,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(18px) scale(.985)'}],{duration:220,easing:'ease-in',fill:'forwards'});
  Promise.all([finished(a1),finished(a2)]).then(function(){s.wrap.remove();});
}

/* 감쇠 스프링을 프레임으로 뽑아 WAAPI에 넘김: 살짝 넘쳤다가 제자리 */
function springKF(fromPx,toPx,dur,w0,z){
  var n=Math.max(2,Math.round(dur/16.7)),wd=w0*Math.sqrt(1-z*z),out=[];
  for(var i=0;i<=n;i++){
    var s=i/n*dur/1000,e=Math.exp(-z*w0*s);
    var p=i===n?1:1-e*(Math.cos(wd*s)+(z*w0/wd)*Math.sin(wd*s));
    out.push({transform:'translateY('+(fromPx+(toPx-fromPx)*p).toFixed(2)+'px)'});
  }
  return out;
}
function sheetY(el){
  var tf=getComputedStyle(el).transform;
  if(!tf||tf==='none')return 0;
  try{return new DOMMatrixReadOnly(tf).m42;}catch(e){var m=tf.match(/matrix\(([^)]+)\)/);return m?(+m[1].split(',')[5]||0):0;}
}

/* 손잡이·머리줄을 잡고 아래로 끌면 닫힘. 덜 끌었으면 튕겨서 제자리 */
function armDrawerDrag(api,els){
  var g=null;
  function down(e){
    if(e.button>0||e.target.closest('button,input,textarea,select'))return;
    var y0=sheetY(api.sheet);cancelAnims(api.sheet);
    api.sheet.style.transform='translateY('+y0+'px)';
    g={id:e.pointerId,start:e.clientY-y0,dy:y0,ly:e.clientY,lt:e.timeStamp,v:0};
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(x){}
  }
  function move(e){
    if(!g||e.pointerId!==g.id)return;
    var dy=e.clientY-g.start;if(dy<0)dy*=.22;
    var dt=Math.max(1,e.timeStamp-g.lt);g.v=(e.clientY-g.ly)/dt;g.ly=e.clientY;g.lt=e.timeStamp;
    g.dy=dy;api.sheet.style.transform='translateY('+dy+'px)';
    if(e.cancelable)e.preventDefault();
  }
  function up(e){
    if(!g||e.pointerId!==g.id)return;
    var dy=g.dy,v=g.v;g=null;
    if(dy>110||(dy>24&&v>.55)){api.close();return;}
    api.sheet.style.transform='';
    anim(api.sheet,springKF(dy,0,460,17,.7),{duration:460,easing:'linear'});
  }
  els.forEach(function(el){el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});
}

function similarItems(title,sid,lim){

function backupJson(){
  return JSON.stringify(Object.assign({app:'CPAH',exportedAt:new Date().toISOString()},state),null,2);
}
function goSettingsWith(msg){
  ui.set.exportText=backupJson();ui.set.msg=msg;
  if(ui.tab==='settings')renderView();else switchTab('settings',true);
}
async function exportFile(){
  var name='CPAH_'+today()+'.json';
  var dl=null;
  try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  if(!dl){
    /* 아티팩트 밖(예: 홈 화면 앱)에서는 브라우저 내려받기로 */
    try{
      var url=URL.createObjectURL(new Blob([backupJson()],{type:'application/json'}));
      var a=document.createElement('a');a.href=url;a.setAttribute('download',name);document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      state.lastBackup=today();saveNow();toast('백업 파일을 내려받았어요');
      if(ui.tab!=='quest')renderView();
    }catch(e){goSettingsWith('여기서는 파일 저장이 안 돼요. 아래 텍스트를 복사해서 보관해 주세요.');}
    return;
  }
  try{
    await dl.save({filename:name,data:backupJson()});
    state.lastBackup=today();saveNow();toast('백업 파일을 저장했어요');
    if(ui.tab!=='quest')renderView();
  }catch(e){
    if(e&&e.code==='declined')toast('저장을 취소했어요');
    else goSettingsWith('파일 저장에 실패했어요. 아래 텍스트를 복사해서 보관해 주세요.');
  }
}

function applyTheme(){
  var th=(state&&state.theme)||{},root=document.documentElement;
  var mode=th.bg==='white'?'light':th.bg?'dark':null;
  if(mode)root.setAttribute('data-theme',mode);else root.removeAttribute('data-theme');
  THEME_BG.forEach(function(b){if(THEME_DARKBG[b.k])root.classList.toggle('bg-'+b.k,th.bg===b.k);});
  THEME_AC.forEach(function(a){root.classList.toggle('ac-'+a.k,th.accent===a.k);});
}
function setTheme(key,val){
  if(!state.theme)state.theme={};
  if(val)state.theme[key]=val;else delete state.theme[key];
  if(!state.theme.accent&&!state.theme.bg)delete state.theme;
  applyTheme();saveNow();renderView();
}

function renderView(){
  var view=document.getElementById('view');
  if(ui.pastDay&&(ui.pastDay>=realToday()||ui.pastDay<pastMin())){ui.pastDay=null;ui.pastBase=null;}
  syncPastBar();
  var t=today();
  lastDay=t;
  if(prune(t))saveNow();
  logToday(t);
  var v;
  try{
    if(!state.subjects.length)state.subjects=defaultSubjects();
    if(ui.tab==='home')v=homeView(t);
    else if(ui.tab==='quest')v=questView(t);
    else if(ui.tab==='stats')v=statsView(t);
    else if(ui.tab==='study')v=studyView(t);
    else if(ui.tab==='mock')v=mockView(t);
    else if(ui.tab==='reads')v=readsView(t);
    else if(ui.tab==='anal')v=analView(t);
    else v=settingsView(t);
  }catch(e){
    v=h('div',{class:'err-box'},'화면을 그리다 오류가 났어요: '+(e&&e.message?e.message:e));
    if(window.console)console.error(e);
  }
  /* 퀘스트 보드를 다시 그려도 미해결·중요 칸 안의 스크롤 위치는 그대로 */
  var keep={};
  view.querySelectorAll('[data-cell]>.qc-body').forEach(function(b){if(b.scrollTop)keep[b.parentNode.getAttribute('data-cell')]=b.scrollTop;});
  view.replaceChildren(v);
  Object.keys(keep).forEach(function(k){var b=view.querySelector('[data-cell="'+k+'"]>.qc-body');if(b)b.scrollTop=keep[k];});
  updateBadges();
  applyTheme();
}
