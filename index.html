/* 처음 디자인: 연회색 바탕 위 흰 카드(그림자만, 테두리 없음), 반투명 유리 레일·바, 파란 포인트.
   모서리만 각지게. 배치는 오른쪽 레일 + 왼쪽 본문 + 퀘스트 탭 아래 바.
   색은 점수 5단계, 미해결(주황)·중요(보라), 휴무 사유에만 쓴다. 다크 모드는 아이패드 설정을 따름 */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f6f6f9;

  --sep:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.24);
  --accent:#007aff; --accent-rgb:0,122,255; --accent-soft:rgba(0,122,255,.11); --on-accent:#ffffff;
  --ring:#34c759; --up:#1e8a4c; --down:#d70015; --danger:#ff3b30; --on-danger:#ffffff;
  --open:#ff9500; --open-soft:rgba(255,149,0,.12);
  --imp:#af52de; --imp-soft:rgba(175,82,222,.11);
  --card-shadow:0 1px 1px rgba(0,0,0,.03),0 4px 18px rgba(0,0,0,.045);
  --glass:rgba(250,250,252,.8); --glass-line:rgba(0,0,0,.08);
  --fail:#6e0d12; --fail-soft:rgba(110,13,18,.09);
  --water:#dbe8fc; --water-b:#e9f1fd; --water-on:#cadffb; --water-b-on:#dde9fc;
  --water-avg:#e4e4e9; --water-avg-b:#ececf0; --water-avg-line:rgba(60,60,67,.34);
  --water-pace:#e4e4e9; --water-pace-b:#ececf0; --water-pace-line:rgba(60,60,67,.34);
  --scrim:rgba(0,0,0,.26); --sheet-shadow:0 24px 70px rgba(0,0,0,.28); --lift:0 18px 40px rgba(0,0,0,.18);
  --toast-bg:#1d1d1f; --toast-fg:#ffffff;
  --off-week:#30b0c7; --off-plan:#5856d6; --off-sick:#af52de; --off-skip:#ff3b30; --off-half:#ff3b30;
  --offday:rgba(118,118,128,.2);
  --rs-time:#8e8e93; --rs-slip:#c7c7cc;
  --lv0:#d1d1d6; --lv0-fg:#48484a;
  --lv1:#ff3b30; --lv1-fg:#ffffff; --lv1-t:rgba(255,59,48,.1);
  --lv2:#ffcc00; --lv2-fg:#3d3000; --lv2-t:rgba(255,204,0,.16);
  --lv3:#c9eed2; --lv3-fg:#1f5130; --lv3-t:rgba(124,207,142,.14);
  --lv4:#7ccf8e; --lv4-fg:#0b3819; --lv4-t:rgba(124,207,142,.24);
  --lv5:#1d8f4e; --lv5-fg:#ffffff; --lv5-t:rgba(29,143,78,.14);
  --late-bg:#fbf6ee; --late-bg-0:rgba(251,246,238,0);
  --bad-bg:#fff0ee; --bad-line:rgba(255,59,48,.55);
  --sc-blue:#007aff; --sc-green:#28a55f; --sc-orange:#f08a24; --sc-brown:#9c6b3c; --sc-red:#e5484d; --sc-yellow:#e8b500; --sc-gray:#8e8e93; --sc-purple:#8b5cf6;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --rail:68px; --lrail:72px; --tbar:0px; --pbar:0px; --r:2px; --gap:12px; --head-h:54px; --bar-h:56px;
}

    --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.38);
    --accent:#0a84ff; --accent-rgb:10,132,255; --accent-soft:rgba(10,132,255,.2); --on-accent:#ffffff;
    --ring:#30d158; --up:#30d158; --down:#ff6961; --danger:#ff453a; --on-danger:#ffffff;

    --toast-bg:#f5f5f7; --toast-fg:#1d1d1f;
    --off-week:#40c8e0; --off-plan:#5e5ce6; --off-sick:#bf5af2; --off-skip:#ff453a; --off-half:#ff453a;
    --offday:rgba(118,118,128,.3);
    --rs-time:#98989d; --rs-slip:#545458;
    --lv0:#48484a; --lv0-fg:#e5e5ea;
    --lv1:#ff453a; --lv1-fg:#ffffff; --lv1-t:rgba(255,69,58,.16);
    --lv2:#ffd60a; --lv2-fg:#2e2400; --lv2-t:rgba(255,214,10,.14);

    color-scheme:dark;
  }
}

  --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.38);

  --ring:#30d158; --up:#30d158; --down:#ff6961; --danger:#ff453a; --on-danger:#ffffff;
  --open:#ff9f0a; --open-soft:rgba(255,159,10,.16);
  --imp:#bf5af2; --imp-soft:rgba(191,90,242,.18);
  --card-shadow:none;
  --glass:rgba(30,30,32,.8); --glass-line:rgba(255,255,255,.1);
  --fail:#a01c24; --fail-soft:rgba(160,28,36,.24);
  --water:#1a2c41; --water-b:#1c2531; --water-on:#193554; --water-b-on:#1b2a3b;
  --water-avg:#2b2b2f; --water-avg-b:#242427; --water-avg-line:rgba(235,235,245,.3);
  --water-pace:#2b2b2f; --water-pace-b:#242427; --water-pace-line:rgba(235,235,245,.3);
  --scrim:rgba(0,0,0,.55); --sheet-shadow:0 24px 70px rgba(0,0,0,.6); --lift:0 18px 40px rgba(0,0,0,.6);
  --toast-bg:#f5f5f7; --toast-fg:#1d1d1f;
  --off-week:#40c8e0; --off-plan:#5e5ce6; --off-sick:#bf5af2; --off-skip:#ff453a; --off-half:#ff453a;
  --offday:rgba(118,118,128,.3);
  --rs-time:#98989d; --rs-slip:#545458;
  --lv0:#48484a; --lv0-fg:#e5e5ea;
  --lv1:#ff453a; --lv1-fg:#ffffff; --lv1-t:rgba(255,69,58,.16);
  --lv2:#ffd60a; --lv2-fg:#2e2400; --lv2-t:rgba(255,214,10,.14);
  --lv3:#4a7653; --lv3-fg:#e3f8e7; --lv3-t:rgba(74,118,83,.26);
  --lv4:#2f9e52; --lv4-fg:#f0fff3; --lv4-t:rgba(47,158,82,.2);
  --lv5:#30d158; --lv5-fg:#03250f; --lv5-t:rgba(48,209,88,.18);
  --late-bg:#251f17; --late-bg-0:rgba(37,31,23,0);
  --bad-bg:#3a1c1a; --bad-line:rgba(255,105,97,.6);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);letter-spacing:-.01em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;border-radius:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;z-index:10;height:env(safe-area-inset-top,0px);background:var(--bg)}
.wrap{margin-left:var(--lrail);margin-right:var(--rail);padding-block:calc(14px + var(--tbar) + var(--pbar)) 110px}
.lt{margin:0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.page-title{margin:6px 2px 18px}
.ic{display:inline-flex;flex:none}
.ic svg{display:block;width:100%;height:100%}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
.lv0{--c:var(--lv0);background:var(--lv0);color:var(--lv0-fg)}
.lv1{--c:var(--lv1);background:var(--lv1);color:var(--lv1-fg)}
.lv2{--c:var(--lv2);background:var(--lv2);color:var(--lv2-fg)}
.lv3{--c:var(--lv3);background:var(--lv3);color:var(--lv3-fg)}
.lv4{--c:var(--lv4);background:var(--lv4);color:var(--lv4-fg)}
.lv5{--c:var(--lv5);background:var(--lv5);color:var(--lv5-fg)}
@keyframes fade{from{opacity:0}}
@keyframes rowin{from{opacity:0;transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.82)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes reveal{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0)}to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}}
.reveal{animation:reveal 1.1s var(--ease) both}

/* 흰 카드 */
.panel{min-width:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--card-shadow)}
.pn-head{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--sep)}
.pn-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.pn-meta{margin-left:auto;overflow:hidden;font-size:13px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.pn-body{padding:12px 16px}

/* 오른쪽 레일: 반투명 유리 */
.tabbar{position:fixed;top:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;width:calc(var(--rail) + env(safe-area-inset-right,0px));padding:calc(env(safe-area-inset-top,0px) + 12px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 10px) 0;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:-.5px 0 0 var(--glass-line)}
.rail-dd{margin:0 6px 8px;padding:2px 0 11px;box-shadow:inset 0 -1px 0 var(--sep);font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--fg);text-align:center;white-space:nowrap}
.rail-tabs{position:relative;display:flex;flex-direction:column}
.tab-hl{position:absolute;top:0;left:6px;right:6px;height:58px;border-radius:var(--r);background:var(--fill);transform:translateY(calc(var(--i,0)*60px));transition:transform .6s var(--spring)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;margin:0 6px 2px;font-size:11px;font-weight:500;color:var(--muted);transition:color .3s}
.tab .ic{width:23px;height:23px;transition:transform .3s var(--ease)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ic{animation:tabPop .55s var(--spring)}
@keyframes tabPop{0%{transform:scale(.8)}100%{transform:none}}
.tab:active .ic{transform:scale(.88)}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:17px;padding:0 4px;border-radius:var(--r);background:var(--danger);color:var(--on-danger);font-size:11px;font-weight:600;line-height:17px;text-align:center}
.rail-clock{display:flex;flex-direction:column;align-items:center;gap:2px;margin:auto 6px 0;padding:10px 0 8px;box-shadow:inset 0 1px 0 var(--sep);color:var(--muted);white-space:nowrap}
.rail-clock b{font-size:14px;font-weight:600;color:var(--fg-2)}
.rail-clock span{font-size:11px}
.tab.tab-off{height:56px;margin:0 6px;border-radius:var(--r);color:var(--danger)}
.tab.tab-off.on{background:var(--danger);color:var(--on-danger)}
@media (max-width:599px){
  .wrap{margin-right:0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .tabbar{top:auto;left:0;flex-direction:row;width:auto;height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-shadow:0 -.5px 0 var(--glass-line)}
  .rail-dd,.rail-clock{display:none}
  .rail-tabs{flex:7;flex-direction:row}
  .tab{flex:1;height:58px;margin:0}
  .tab.tab-off{flex:1;height:58px;margin:0}
  .tab-hl{top:5px;left:0;right:auto;width:calc(100% / 7);height:48px;transform:translateX(calc(var(--i,0)*100%))}
}

/* 레일의 퀘스트 아이콘: 진행률만큼 차오름, 다 하면 초록 */
.qi-fill{fill:var(--accent);opacity:.32;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--qp,0));transition:transform .9s var(--ease),opacity .4s,fill .4s}
.qi-check{transition:stroke .3s}
.tab.qdone .ic{color:var(--ring)}
.tab.qdone .qi-fill{fill:var(--ring);opacity:1}
.tab.qdone .qi-check{stroke:var(--on-accent)}

/* 왼쪽 틀: 오늘 공부 시간, 측정 버튼, 과목별 시간. 오른쪽 레일과 같은 유리 */
.trail{position:fixed;top:0;left:0;bottom:0;z-index:20;display:flex;flex-direction:column;width:calc(var(--lrail) + env(safe-area-inset-left,0px));padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(env(safe-area-inset-bottom,0px) + 10px) env(safe-area-inset-left,0px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:.5px 0 0 var(--glass-line);font-variant-numeric:tabular-nums}
.tr-total{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;margin:0 6px;padding:0 0 11px;box-shadow:inset 0 -1px 0 var(--sep)}
.tr-total span{font-size:11px;font-weight:500;color:var(--muted)}
.tr-total b{font-size:21px;font-weight:700;letter-spacing:-.03em;color:var(--fg)}
.tr-go{position:relative;flex:none;display:grid;place-items:center;width:52px;height:52px;margin:16px auto 0;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);transition:background-color .3s,color .3s,box-shadow .3s}
.trail.on .tr-go{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(var(--accent-rgb),.32)}
.tr-ic{display:grid;place-items:center;width:20px;height:20px}
.tr-ic svg{display:block;width:100%;height:100%}
.tr-ring{position:absolute;inset:-5px;pointer-events:none;opacity:0;transition:opacity .4s}
.tr-ring svg{display:block;width:100%;height:100%;overflow:visible}
.tr-ring rect{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:100}
.trail.on .tr-ring{opacity:1}
.tr-sess{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:36px;margin:8px 4px 10px;text-align:center;white-space:nowrap}
.tr-sess b{font-size:11px;font-weight:600;color:var(--accent)}
.tr-sess span{font-size:13px;font-weight:600;color:var(--accent)}
.tr-sess .tr-next{font-size:11px;font-weight:500;color:var(--muted)}
.tr-pick{display:none}
.tr-list{position:relative;flex:0 1 auto;display:flex;flex-direction:column;gap:2px;min-height:0;margin:0 6px;padding-top:10px;overflow-y:auto;scrollbar-width:none;box-shadow:inset 0 1px 0 var(--sep)}
.tr-list::-webkit-scrollbar{display:none}
.tr-hl{position:absolute;top:10px;left:0;right:0;height:44px;border-radius:var(--r);background:var(--accent-soft);opacity:0;transform:translateY(calc(var(--ti,0)*46px));transition:transform .6s var(--spring),opacity .3s}
.tr-list.has-on .tr-hl{opacity:1}
.tr-sub{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:44px;border-radius:var(--r)}
.tr-sub:active{background:var(--fill)}
.ts-n{font-size:12.5px;font-weight:600;color:var(--fg-2);transition:color .3s}
.ts-t{font-size:11px;color:var(--muted);transition:color .3s}
.ts-bar{position:absolute;left:9px;bottom:4px;width:0;max-width:calc(100% - 18px);height:2px;background:var(--fill-2);transition:width .6s var(--ease),background-color .3s}
.tr-sub.on .ts-n,.tr-sub.on .ts-t{color:var(--accent)}
.tr-sub.on .ts-bar{background:var(--accent)}
@media (max-width:599px){
  :root{--lrail:0px;--tbar:52px}
  .trail{right:0;bottom:auto;flex-direction:row;align-items:center;gap:10px;width:auto;height:calc(var(--tbar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));box-shadow:0 .5px 0 var(--glass-line)}
  .tr-total{flex-direction:row;align-items:baseline;gap:6px;margin:0;padding:0;box-shadow:none}
  .tr-total b{font-size:18px}
  .tr-sess,.tr-list{display:none}
  .tr-pick{display:block;flex:1;min-width:0;height:36px;padding:0 12px;border-radius:var(--r);background:var(--fill);font-size:14px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trail.on .tr-pick{background:var(--accent-soft);color:var(--accent)}
  .tr-go{order:3;width:40px;height:40px;margin:0}
  .tr-ring{inset:-4px}
}

/* 홈: 시험까지 남은 날 + 오늘 퀘스트(한 칸이 퀘스트 하나) */
.home{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 124px - var(--tbar) - var(--pbar))}
.hm-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;padding:4px 2px 12px;box-shadow:inset 0 -1px 0 var(--sep);font-size:15px;color:var(--muted)}
.hm-top b{font-weight:600;color:var(--fg-2)}
.hm-top .warn{color:var(--open)}
.hm-lbl{margin-bottom:6px;font-size:16px;font-weight:600;color:var(--muted)}
.hm-dd{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:28px 2px}
.hm-big{margin:0;font-size:clamp(96px,17vw,224px);line-height:.9;font-weight:700;letter-spacing:-.055em;color:var(--fg)}
.hm-sub{margin:14px 0 0;font-size:16px;color:var(--muted)}
.hm-q{display:flex;flex-direction:column;gap:16px;width:100%;padding:20px 2px 4px;box-shadow:inset 0 1px 0 var(--sep);text-align:left;transition:opacity .2s}
.hm-q:active{opacity:.7}
.hm-qrow{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 40px}
.hm-qbig{font-size:clamp(64px,10vw,132px);line-height:.9;font-weight:700;letter-spacing:-.05em;color:var(--fg)}
.hm-qmeta{display:flex;gap:30px;padding-bottom:.3em;font-size:14px;color:var(--muted)}
.hm-qmeta span{display:flex;flex-direction:column;gap:4px}
.hm-qmeta b{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.hm-qmeta b.rest{color:var(--danger)}
.hm-q.full .hm-qmeta b.rest{color:var(--up)}
.hm-cells{display:grid;grid-template-columns:repeat(auto-fill,12px);gap:4px}
.hm-cells i{height:18px;border-radius:var(--r)}
.hm-cells i:not([class]){background:var(--fill-2)}
.hm-none{margin:0;font-size:15px;color:var(--muted)}
.hm-off{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 28px}
.hm-off .off-word{font-size:clamp(56px,9vw,120px);line-height:.9;font-weight:800;letter-spacing:-.055em;color:var(--off-c)}

/* 상태 */
.st-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:6px 2px 16px}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{min-height:30px;padding:5px 12px;border-radius:var(--r);background:var(--fill);font-size:13px;color:var(--muted);transition:transform .2s var(--ease)}
.hchip:active{transform:scale(.96)}
.st-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px var(--gap);align-items:start}
.st-sec{grid-column:span 12;min-width:0}
.st-sec.half{grid-column:span 6}
@media (max-width:899px){.st-sec.half{grid-column:span 12}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi .bar{height:6px;border-radius:var(--r);background:var(--fill);overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--ring);transform-origin:left center;animation:growx 1s var(--ease) both}
.kpi.abs{grid-column:span 2}
@media (max-width:640px){.kpi.abs{grid-column:auto}}
.abs-list{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--fg-2)}
.abs-list span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.abs-list i{width:9px;height:9px;border-radius:var(--r);background:var(--off-c)}
.abs-list b{font-size:18px;font-weight:700;color:var(--fg)}
/* 과목 칸: 이름은 카드 밖 위, 카드 안에는 박스마다 남은 날 */
.wh-grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px var(--gap)}
@media (max-width:599px){.wh-grid{grid-template-columns:minmax(0,1fr)}}
.wh{display:flex;flex-direction:column;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wh-head{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px 8px}
.wh-name{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.wh-cnt{font-size:14px;color:var(--muted)}
.more{margin-left:auto;height:30px;padding:0 13px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:500;transition:transform .2s var(--ease)}
.more:active{transform:scale(.95)}
.wh .sqs,.wh .empty-s{flex:1 1 auto;padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}
.sqs{display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px}
.sq{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r);font-size:12px;font-weight:600;line-height:1;letter-spacing:-.03em;transform-origin:0 0}
.wh .sq{transition:filter .15s}
.wh .sq:active{filter:brightness(.9)}
.empty-s{margin:0;font-size:14px;color:var(--faint)}
.sb{display:grid;grid-template-columns:minmax(0,1fr);column-gap:36px;padding:8px 20px}
@media (min-width:640px){.sb{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sb-row{display:grid;grid-template-columns:100px minmax(0,1fr) 46px;align-items:center;gap:12px;min-height:44px}
.sb-name{overflow:hidden;font-size:15px;white-space:nowrap;text-overflow:ellipsis}
.sb-track{height:8px;border-radius:var(--r);background:var(--fill);overflow:hidden}
.sb-track i{display:block;height:100%;transform-origin:left center;animation:growx 1s var(--ease) both}
.sb-pct{text-align:right;font-size:15px;color:var(--fg-2)}
.cb{padding:2px 0}
.cb-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,1fr) 46px 54px;align-items:center;gap:12px;min-height:44px}
.cb-row+.cb-row{border-top:1px solid var(--sep)}
@media (max-width:520px){.cb-row{grid-template-columns:minmax(0,1fr) 56px 40px 46px;gap:8px}}
.cb-name{overflow:hidden;font-size:15px;white-space:nowrap;text-overflow:ellipsis}
.cb-name b{font-weight:600;color:var(--muted)}
.cb-wr{font-size:12px;font-weight:500;color:var(--down);text-align:right;white-space:nowrap}
.chart-card{padding:14px 16px 12px}
.ch-read{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;min-height:34px;margin-bottom:12px}
.ch-read b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.ch-read span{font-size:14px;color:var(--muted)}
.ch{display:grid;grid-template-columns:minmax(0,1fr) 34px;column-gap:8px}
.ch-plot{position:relative;height:150px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.ch-grid i{position:absolute;left:0;right:0;height:1px;background:var(--sep)}
.ln-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ln-area{fill:var(--accent-soft)}
.ln-done{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ln-goal{fill:none;stroke:var(--faint);stroke-width:2;stroke-dasharray:3 4;stroke-linejoin:round;stroke-linecap:round}
.ln-guide{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:var(--fill-2);pointer-events:none;transition:left .22s var(--ease)}
.ln-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:var(--r);background:var(--accent);box-shadow:0 0 0 2.5px var(--surface);pointer-events:none;transition:left .22s var(--ease),top .22s var(--ease);animation:fade .4s ease .8s both}
.ln-dot.goal{background:var(--faint)}
.ln-dot.iso{width:6px;height:6px;margin:-3px 0 0 -3px;box-shadow:none;animation-delay:.6s}
.ln-hit{position:absolute;top:-8px;bottom:-8px;transform:translateX(-50%)}
.ln-hit:focus-visible{outline-offset:-2px}
.ch-y{position:relative;height:150px}
.ch-y span{position:absolute;left:0;font-size:11px;color:var(--muted);transform:translateY(50%)}
.ch-xwrap{padding-right:42px}
.ch-x{position:relative;height:18px;margin-top:6px}
.ch-x span{position:absolute;top:0;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.ch-x span.first{transform:none}
.ch-x span.last{transform:translateX(-100%)}
.ch-legend{display:flex;justify-content:flex-end;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i{width:14px;height:3px}

/* 공부 시간 패널 */
.sd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px 36px;padding:14px 16px 16px}
@media (max-width:760px){.sd{grid-template-columns:minmax(0,1fr)}}
.sd-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:12px}
.sd-big b{font-size:28px;font-weight:700;letter-spacing:-.03em}
.sd-big span{font-size:13px;color:var(--muted)}
.sd-subs{display:flex;flex-direction:column;gap:2px}
.sd-row{display:grid;grid-template-columns:88px minmax(0,1fr) 44px;align-items:center;gap:10px;min-height:30px}
.sd-n{overflow:hidden;font-size:14px;white-space:nowrap;text-overflow:ellipsis}
.sd-track{height:8px;border-radius:var(--r);background:var(--fill);overflow:hidden}
.sd-track i{display:block;height:100%;background:var(--accent);transform-origin:left center;animation:growx 1s var(--ease) both}
.sd-v{font-size:13px;font-weight:600;color:var(--fg-2);text-align:right}
.sd-empty{margin:0;font-size:14px;line-height:1.55;color:var(--faint)}
.sd-cols{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;height:176px}
.sd-col{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.sd-cv{height:14px;overflow:visible;font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.sd-cb{flex:1;display:flex;align-items:flex-end;min-height:0;box-shadow:inset 0 -1px 0 var(--sep)}
.sd-cb i{display:block;width:100%;border-radius:var(--r) var(--r) 0 0;background:rgba(var(--accent-rgb),.3);transform-origin:50% 100%;animation:growy .9s var(--ease) both}
.sd-col.today .sd-cb i{background:var(--accent)}
.sd-col.today .sd-cv,.sd-col.today .sd-cd{font-weight:700;color:var(--accent)}
.sd-cd{height:14px;font-size:11px;color:var(--muted);text-align:center}
@keyframes growy{from{transform:scaleY(0)}}
@media (max-width:700px){.sd-cv{visibility:hidden}}

/* 캘린더 */
.cal{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:899px){.cal{grid-template-columns:minmax(0,1fr)}}
.cal-main{min-width:0;padding:12px 14px 14px;box-shadow:inset -1px 0 0 var(--sep)}
@media (max-width:899px){.cal-main{box-shadow:inset 0 -1px 0 var(--sep)}}
.cal-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-title{min-width:84px;font-size:16px;font-weight:700;letter-spacing:-.01em;text-align:center}
.cal-nav{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r);background:var(--fill);color:var(--fg-2);transition:transform .2s var(--ease),opacity .2s}
.cal-nav .ic{width:7px;height:11px}
.cal-nav.prev .ic{transform:scaleX(-1)}
.cal-nav:active{transform:scale(.92)}
.cal-nav:disabled{opacity:.3;cursor:default}
.seg2{display:inline-flex;margin-left:auto;padding:2px;border-radius:var(--r);background:var(--fill)}
.seg2 button{height:26px;padding:0 13px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--fg-2);transition:background-color .25s,color .25s,box-shadow .25s}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.cal-today{height:30px;padding:0 11px;border-radius:var(--r);background:var(--accent-soft);font-size:13px;font-weight:500;color:var(--accent)}
.cal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px;font-size:12px;line-height:1.6;color:var(--faint);text-align:center}
.cal-wd span:nth-child(6){color:var(--accent)}
.cal-wd span:nth-child(7){color:var(--danger)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:52px;padding:5px 7px;background:linear-gradient(rgba(var(--accent-rgb),var(--heat,0)),rgba(var(--accent-rgb),var(--heat,0))),var(--surface-2);border-radius:var(--r);text-align:left;transition:background-color .2s,transform .2s var(--ease)}
.cd:active{transform:scale(.95)}
.cd-d{font-size:12px;color:var(--muted)}
.cd-n{align-self:flex-end;font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.cd.zero .cd-n{color:var(--faint)}
.cd.out{visibility:hidden}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.today .cd-d{font-weight:700;color:var(--accent)}
.cd.off{background:var(--offday)}
.cd.off .cd-n{color:var(--muted)}
.cd.halfoff{background:linear-gradient(135deg,var(--offday) 0 50%,transparent 50%),var(--surface-2)}
.cd-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:var(--r);background:var(--off-c)}
.cd[aria-pressed="true"]{background:var(--accent)}
.cd[aria-pressed="true"] .cd-d,.cd[aria-pressed="true"] .cd-n{color:var(--on-accent)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wkd{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:210px;padding:7px 6px;background:linear-gradient(rgba(var(--accent-rgb),var(--heat,0)),rgba(var(--accent-rgb),var(--heat,0))),var(--surface-2);border-radius:var(--r);text-align:left;transition:transform .2s var(--ease)}
.wkd:active{transform:scale(.97)}
.wkd-h{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:var(--muted)}
.wkd-n{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--fg)}
.wkd-s{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-2)}
.wkd-s span{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.wkd-s b{font-weight:600;color:var(--muted)}
.wkd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wkd.off{background:var(--offday)}
.wkd.halfoff{background:linear-gradient(135deg,var(--offday) 0 50%,transparent 50%),var(--surface-2)}
.wkd.out{opacity:.25;pointer-events:none}
.wkd[aria-pressed="true"]{background:var(--accent)}
.wkd[aria-pressed="true"] *{color:var(--on-accent)!important}
.cal-day{display:flex;flex-direction:column;min-width:0}
.cdl-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:13px 16px 10px;box-shadow:inset 0 -1px 0 var(--sep)}
.cdl-head b{font-size:16px;font-weight:700}
.cdl-head span{margin-left:auto;font-size:13px;color:var(--muted)}
.cdl-off{margin:10px 16px 0;padding:8px 11px;border-left:3px solid var(--off-c);background:var(--surface-2);font-size:13px;color:var(--fg-2)}
.cdl-list{max-height:430px;overflow-y:auto;overscroll-behavior:contain;padding:2px 0 8px}
.cdl-sub{display:flex;justify-content:space-between;padding:11px 16px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.cdl-row{display:grid;grid-template-columns:12px 46px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:30px;padding:1px 16px}
.cdl-mk{width:11px;height:11px;border-radius:var(--r)}
.cdl-mk:not([class*="lv"]){background:var(--fill-2)}
.cdl-code{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.cdl-t{overflow:hidden;font-size:14px;white-space:nowrap;text-overflow:ellipsis}
.cdl-tag{font-size:11px;color:var(--faint)}
.cdl-row.proj .cdl-t{color:var(--muted)}
.cdl-row.miss .cdl-tag{font-weight:600;color:var(--open)}
.cdl-row.done .cdl-t{color:var(--done)}
.cdl-empty{padding:20px 16px;font-size:13px;color:var(--faint)}
.cdl-note{padding:6px 16px 12px;font-size:12px;color:var(--faint)}

/* 자세히 보기 */
.dt-top{margin:0 0 2px}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding-right:10px;font-size:17px;color:var(--accent)}
.back .ic{width:11px;height:18px}
.dt-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:2px 2px 16px}
.dt-sub{font-size:15px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 9px;border-radius:var(--r);background:var(--surface);font-size:14px;font-weight:500;color:var(--fg-2);box-shadow:var(--card-shadow);transition:opacity .3s,box-shadow .3s,transform .2s var(--ease)}
.fchip i{width:16px;height:16px;border-radius:var(--r)}
.fchip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.filters.some .fchip[aria-pressed="false"]{opacity:.42}
.fchip:active{transform:scale(.95)}
.dt-card{border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--card-shadow)}
.dt-list{margin:0;padding:4px 0;list-style:none}
.dt-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:14px;min-height:54px;padding:10px 16px}
.dt-row>.dt-memo{grid-column:2/4}
.dt-row+.dt-row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep);transition:opacity .4s ease .2s}
.dt-list.enter .dt-row::before{opacity:0}
.dt-row .sq{width:32px;height:32px;font-size:13px}
.dt-main{min-width:0;cursor:pointer}
.dt-title{font-size:16px;line-height:1.38;word-break:keep-all;overflow-wrap:anywhere}
.has-memo .dt-title::after{content:"";display:inline-block;width:5px;height:5px;margin-left:8px;background:var(--faint);vertical-align:middle;transform:translateY(-1px)}
.dt-ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 4px}
.dt-ch:not(:first-child){margin-top:4px;box-shadow:inset 0 1px 0 var(--sep)}
.dt-ch-name{min-width:0;overflow:hidden;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap;text-overflow:ellipsis}
.dt-ch-meta{flex:none;font-size:12.5px;color:var(--muted)}
.dt-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 16px 2px}
.dt-sec:first-child{padding-top:14px}
.dt-sec:not(:first-child){margin-top:6px;box-shadow:inset 0 1px 0 var(--sep)}
.dt-sec-name{font-size:17px;font-weight:700;letter-spacing:-.015em}
.dt-sec+.dt-ch{box-shadow:none;margin-top:0}
.dt-memo,.q-memo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.dt-memo>div,.q-memo>div{min-height:0;overflow:hidden}
.dt-memo p,.q-memo p{margin:0;padding-top:5px;font-size:14px;line-height:1.5;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.open .dt-memo,.open .q-memo{grid-template-rows:1fr}
.dt-edit{margin:8px 0 2px;height:30px;padding:0 12px;border-radius:var(--r);background:var(--fill);font-size:13px;font-weight:500;color:var(--accent)}
.tag{padding:5px 11px;border-radius:var(--r);background:var(--fill);font-size:13px;color:var(--muted);white-space:nowrap}
.tag.imp{background:var(--imp-soft);color:var(--imp)}
.tag.open{background:var(--open-soft);color:var(--open)}
.pull{height:32px;padding:0 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px;font-weight:500;color:var(--accent);white-space:nowrap;transition:background-color .25s,color .25s,transform .2s var(--ease)}
.pull[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pull:active{transform:scale(.94)}
@keyframes flash{0%,35%{background-color:var(--accent-soft)}100%{background-color:transparent}}
.dt-row.flash{animation:flash 1.6s ease}

/* 퀘스트: 위 줄(따라 내려옴) + 두 줄 보드 + 아래 바 */
.qhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tbar) + var(--pbar));z-index:12;display:flex;align-items:center;gap:18px;min-height:var(--head-h);margin:-14px 0 16px;padding:0 4px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--glass-line)}
.qhead h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.qh-meter{flex:0 1 220px;height:6px;border-radius:var(--r);background:var(--fill-2);overflow:hidden}
.qh-meter i{display:block;width:0;height:100%;background:var(--accent);transition:width .6s var(--ease),background-color .4s}
.qhead.full .qh-meter i{background:var(--ring)}
.qh-stat{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.qh-stat b{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.qs-goal{font-size:14px;color:var(--muted)}
.qh-pct{font-size:16px;font-weight:700;color:var(--accent);transition:color .4s}
.qhead.full .qh-pct{color:var(--up)}
.qh-left b{color:var(--danger);transition:color .4s}
.qhead.full .qh-left b{color:var(--up)}
@media (max-width:760px){.qh-meter{display:none}.qhead{gap:12px}}
/* 아래 바: 레일과 이어지는 반투명 틀. 누르면 시트가 아래에서 튀어 오름 */
.newbar{position:fixed;left:calc(var(--lrail) + env(safe-area-inset-left,0px));right:calc(var(--rail) + env(safe-area-inset-right,0px));bottom:0;z-index:18;display:flex;align-items:center;justify-content:center;gap:8px;height:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));padding:0 16px env(safe-area-inset-bottom,0px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--glass-line);color:var(--accent);font-size:17px;font-weight:600;transition:background-color .2s}
.newbar:active{background:var(--fill)}
.nb-plus{display:inline-flex}
.nb-plus .ic{width:18px;height:18px}
@media (max-width:599px){.newbar{left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));height:var(--bar-h);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}}
.halfbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 16px;padding:10px 14px;border-left:3px solid var(--off-skip);border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow);font-size:14px;color:var(--fg-2)}
.halfbar b{color:var(--off-skip)}
.halfbar button{margin-left:auto;height:30px;padding:0 12px;border-radius:var(--r);background:var(--fill);font-size:13px;font-weight:500;color:var(--accent)}
.qzone{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start;margin-bottom:28px}
@media (max-width:699px){.qzone{grid-template-columns:minmax(0,1fr)}}
.qc-late .qc-body{background:var(--late-bg)}
/* 칸이 넘치면 아래를 살짝 흐리게: 더 있다는 표시 (끝까지 내리면 사라짐) */
.qc-late::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;border-radius:0 0 var(--r) var(--r);background:linear-gradient(to bottom,var(--late-bg-0),var(--late-bg) 88%);pointer-events:none;opacity:0;transition:opacity .25s}
.qc-late.has-below::after{opacity:1}
.qz-head{display:flex;align-items:baseline;gap:10px;margin:0 4px 12px}
.qz-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em}
.qz-n{font-size:14px;font-weight:600;color:var(--muted);transition:color .4s}
.qz-n.full{color:var(--up)}
.qz-idle{margin:22px 4px 0;font-size:13px;color:var(--faint)}
.qz-idle b{margin-right:4px;font-weight:600;color:var(--muted)}
.qz-empty{margin:0 4px;font-size:14px;color:var(--faint)}
.qc-more{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:42px;padding:0 16px 0 14px;border-top:1px solid var(--sep);font-size:13px;font-weight:600;color:var(--muted);text-align:left}
.qc-more i{width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .3s var(--ease)}
.qc-more[aria-expanded="true"] i{transform:translateY(2px) rotate(225deg)}
.qc-later{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.qc-later>div{min-height:0;overflow:hidden}
.qc-later.open{grid-template-rows:1fr}
.qgrid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px var(--gap);align-items:start}
.qgrid>.idle{align-self:start}
@media (max-width:699px){.qgrid{grid-template-columns:minmax(0,1fr)}}
/* 칸: 이름은 카드 밖 위(설정 앱의 묶음 제목처럼), 오른쪽에 한 것/전체 */
.qcard{position:relative;display:flex;flex-direction:column;min-width:0;container:qcell/inline-size}
.qgrid>.qcard[data-sid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qc-head{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 4px 8px}
.qc-head h2{margin:0;min-width:0;overflow:hidden;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;text-overflow:ellipsis}
.qc-n{flex:none;margin-left:auto;font-size:13px;font-weight:500;color:var(--muted);transition:color .4s}
.qcard.all-done .qc-n{color:var(--up)}
.qc-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}
.qc-open,.qc-imp{max-height:clamp(260px,46vh,460px)}
.qc-open .qc-body,.qc-imp .qc-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.qc-open{--mk:var(--open)}
.qc-imp{--mk:var(--imp)}
.qc-open .qc-head::before,.qc-imp .qc-head::before{content:"";flex:none;width:9px;height:9px;border-radius:var(--r);background:var(--mk)}
.qc-open .qc-head h2,.qc-imp .qc-head h2{color:var(--mk)}
.qc-empty{margin:0;padding:13px 14px;font-size:13px;color:var(--faint)}
.qc-sec{padding:12px 14px 2px;font-size:12px;font-weight:700;color:var(--open)}
.qc-sec~.qc-sec{margin-top:6px;box-shadow:inset 0 1px 0 var(--sep)}
.qc-sub{padding:9px 14px 3px;font-size:12px;font-weight:600;color:var(--muted)}
.qc-sec+.qc-sub{padding-top:4px}
.qcard.idle .qc-head h2{color:var(--muted)}
.qcard.idle .qc-empty{padding:10px 14px}
/* 줄: 장 코드 · 제목 · 점수칸. 좁으면 점수칸은 제목 아래, 제목 시작선에 맞춤 */
.qrow{position:relative;isolation:isolate;display:grid;grid-template-columns:var(--codew,22px) minmax(0,1fr) auto;grid-template-areas:"code title title" ". rates skip" "memo memo memo";align-items:center;column-gap:10px;padding:8px 12px 9px 14px;border-top:1px solid var(--sep)}
.qc-body>.qrow:first-child,.qc-sub+.qrow,.qc-sec+.qrow{border-top-color:transparent}
.qrow::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fillc,transparent);transform:scaleX(0);transform-origin:left center;transition:transform .6s var(--ease)}
.qrow::after{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--barc,transparent);transform:scaleY(0);transition:transform .4s var(--ease)}
.qrow.done::before{transform:scaleX(1)}
.qrow.done::after{transform:scaleY(1)}
.qrow[data-s="1"]{--fillc:var(--lv1-t);--barc:var(--lv1)}
.qrow[data-s="2"]{--fillc:var(--lv2-t);--barc:var(--lv2)}
.qrow[data-s="3"]{--fillc:var(--lv3-t);--barc:var(--lv3)}
.qrow[data-s="4"]{--fillc:var(--lv4-t);--barc:var(--lv4)}
.qrow[data-s="5"]{--fillc:var(--lv5-t);--barc:var(--lv5)}
.q-ch{grid-area:code;overflow:hidden;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;transition:opacity .35s}
.q-title{grid-area:title;display:flex;align-items:center;gap:7px;min-width:0;min-height:28px;text-align:left;color:var(--fg)}
.q-rates,.q-wait{grid-area:rates;justify-self:start;margin-top:4px}
.q-skip{grid-area:skip;justify-self:end;margin-top:4px}
.q-memo{grid-area:memo}
.nocode .q-ch{display:none}
.nocode .qrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title title" "rates skip" "memo memo"}
@container qcell (min-width:380px){
  .qrow{grid-template-columns:var(--codew,22px) minmax(0,1fr) auto auto;grid-template-areas:"code title rates skip" "memo memo memo memo";padding-bottom:8px}
  .nocode .qrow{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"title rates skip" "memo memo memo"}
  .q-rates,.q-wait,.q-skip{margin-top:0}
  .q-rates,.q-wait{justify-self:end}
}
.q-text{position:relative;display:inline-block;max-width:100%;overflow:hidden;font-size:15px;line-height:1.4;white-space:nowrap;text-overflow:ellipsis;transition:color .35s ease}
.q-text::after{content:"";position:absolute;top:calc(50% - 1px);left:0;right:0;height:2px;background:var(--barc,currentColor);transform:scaleX(0);transform-origin:left center;transition:transform .55s var(--ease) .06s}
.qrow.done .q-text{color:var(--done)}
.qrow.done .q-text::after{transform:scaleX(1)}
.qrow.done .q-ch{opacity:.5}
.qrow.open .q-text{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.qrow.open .q-text::after{display:none}
.qrow.open.done .q-text{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--barc)}
.memo-dot{flex:none;width:5px;height:5px;background:var(--faint)}
.q-new{flex:none;padding:1px 6px;border-radius:var(--r);background:var(--accent-soft);font-size:11px;font-weight:600;color:var(--accent)}
.q-meta{flex:none;font-size:12px;color:var(--muted)}
.dots{flex:none;display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;background:var(--fill-2);transition:background-color .35s}
.dots i.on{background:var(--lv5)}
.q-rates{display:flex;gap:5px}
.rt{position:relative;width:28px;height:28px;border-radius:var(--r);transition:opacity .35s ease,transform .38s var(--ease)}
.q-rates .rt{background:var(--fill)}
.q-rates .rt::after{content:"";position:absolute;inset:0;border-radius:var(--r);background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);transform:scale(.36);transition:transform .34s var(--ease)}
.q-rates .rt[aria-pressed="true"]::after{transform:none}
@media (hover:hover){.q-rates .rt:hover::after{transform:scale(.52)}}
.rt::before{content:"";position:absolute;inset:-5px -3px}
.rt:active{transform:scale(.86)}
.qrow.done .rt[aria-pressed="false"]{opacity:.14;transform:scale(.76)}
.rt.pop{animation:pop .44s var(--ease)}
.q-skip{height:32px;padding:0 2px 0 6px;font-size:13px;color:var(--muted);white-space:nowrap;transition:opacity .3s}
.qrow.done .q-skip{opacity:0;pointer-events:none}
.q-wait{font-size:13px;color:var(--muted)}
.qrow.dim .q-title,.qrow.dim .q-ch{opacity:.42}
.q-memo .dt-edit{margin-bottom:2px}
/* 기타 할 일: 한 줄 띠에 칩처럼 */
.todo-strip{display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:8px 10px 8px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}
.ts-lbl{flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.ts-list{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.td-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:32px;padding:4px 12px 4px 9px;border-radius:var(--r);background:var(--fill)}
.td-chk{position:relative;flex:none;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:var(--r);transition:background-color .15s,border-color .15s}
.td-chk::before{content:"";position:absolute;inset:-9px}
.td-chip.gone .td-chk{background:var(--accent);border-color:var(--accent)}
.td-text{min-width:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.ts-form{flex:1 1 140px;min-width:120px}

.ts-in::placeholder{color:var(--faint)}
.ts-in:focus{background:var(--accent-soft)}
/* 칸 순서 바꾸기 (퀘스트 과목 칸, 상태 과목 칸) */
.lifted{position:relative;z-index:30;background:var(--bg);box-shadow:var(--lift),0 0 0 2px var(--accent);cursor:grabbing}
.arranging>[data-sid]:not(.lifted){animation:jiggle .27s ease-in-out infinite alternate}
.arranging>[data-sid]:nth-child(even):not(.lifted){animation-delay:-.135s}
.arranging [data-sid] *{pointer-events:none}
@keyframes jiggle{from{rotate:-.4deg}to{rotate:.4deg}}
/* 페이지 칸: 크기가 커서 덜 흔들림 */
.arranging>[data-unit]:not(.lifted){animation:jiggleS .3s ease-in-out infinite alternate}
.arranging>[data-unit]:nth-child(even):not(.lifted){animation-delay:-.15s}
.arranging>[data-unit] *{pointer-events:none}
@keyframes jiggleS{from{rotate:-.15deg}to{rotate:.15deg}}
/* 끌기 위치 계산(offsetLeft/Top)이 이 묶음 기준이 되도록 */
[data-units],.mt-row{position:relative}
[data-units]>[data-unit],.mt-row>[data-sid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-units] input,[data-units] textarea{-webkit-user-select:text;user-select:text}
/* 휴무 날 */
.dayoff{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--head-h) - 140px);padding:24px 0;text-align:center}

.sec{margin:30px 2px 0;font-size:22px;font-weight:700;letter-spacing:-.018em}
.grp{margin-top:20px}

.md-sub{margin:6px 0 0;font-size:15px;color:var(--muted)}
.md-entry{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}

/* 회독표 */
.reads{display:flex;flex-direction:column;gap:var(--gap)}

/* 스프링 곡선(감쇠비 0.7): 지원하면 linear(), 아니면 비슷한 베지어 */
:root{--spring:cubic-bezier(.34,1.26,.64,1)}
@supports (transition-timing-function:linear(0, 1)){:root{--spring:linear(0, 0.0255, 0.0908, 0.1814, 0.2858, 0.395, 0.5023, 0.6032, 0.6945, 0.7747, 0.8429, 0.8993, 0.9446, 0.9796, 1.0057, 1.0241, 1.0361, 1.0429, 1.0458, 1.0456, 1.0432, 1.0395, 1.0349, 1.0299, 1.0249, 1.0201, 1.0157, 1.0118, 1.0085, 1.0056, 1.0034, 1.0016, 1.0002, 0.9992, 0.9985, 0.9981, 1)}}
/* 하루 첫 화면 */
html.intro-on,html.intro-on body{overflow:hidden}
.intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--fg);overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .7s var(--ease),color .7s}
.intro.dark{background:#000;color:#f5f5f7}
.in-stage{position:relative;display:flex;justify-content:center;width:100%;max-width:900px}
.in-scene{display:flex;flex-direction:column;align-items:center;text-align:center}
.in-skip{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));height:34px;padding:0 14px;border-radius:var(--r);background:rgba(128,128,128,.16);font-size:13px;font-weight:600;color:inherit;opacity:.75}
.in-hint{position:absolute;left:0;right:0;bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 16px);margin:0;font-size:12px;text-align:center;opacity:.4}
.in-prog{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;transform:translateX(-50%)}
.in-prog i{width:30px;height:3px;border-radius:2px;background:rgba(128,128,128,.28);overflow:hidden}
.in-prog b{display:block;width:100%;height:100%;background:currentColor;transform:scaleX(0);transform-origin:0 50%}
.in-prog i.done b{transform:none}
.in-prog i.on b{animation:inProg linear forwards}
@keyframes inProg{to{transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
.in-hello{margin:0;font-size:clamp(56px,10.5vw,138px);font-weight:700;line-height:1.05;letter-spacing:-.05em;white-space:nowrap}
.in-hello span{display:inline-block;opacity:0}
.in-s1.play .in-hello span{animation:inChar 1.15s var(--ease) both;animation-delay:var(--d)}
@keyframes inChar{0%{opacity:0;transform:translateY(.3em) scale(.94);filter:blur(16px);color:var(--accent)}55%{color:var(--accent)}100%{opacity:1;transform:none;filter:blur(0);color:var(--fg)}}
.in-sub{margin:20px 0 0;font-size:clamp(15px,1.9vw,21px);font-weight:500;color:var(--muted);opacity:0}
.in-s1.play .in-sub{animation:inUp .8s var(--ease) .8s both}
.in-dlab,.in-dfoot{font-size:clamp(15px,2vw,22px);font-weight:600;color:rgba(245,245,247,.55);opacity:0}
.in-dnum{display:flex;align-items:flex-start;margin:.04em 0 .08em;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.in-dpre{margin-right:.02em;color:rgba(245,245,247,.38);opacity:0}
.od{display:inline-block;height:1em;margin-right:-.035em;overflow:hidden;letter-spacing:0}
.od-s{display:flex;flex-direction:column}
.od-s span{display:block;height:1em;line-height:1}
.in-s2.play .in-dlab{animation:inUp .7s var(--ease) both}
.in-s2.play .in-dpre{animation:inFade .6s ease .1s both}
.in-s2.play .in-dfoot{animation:inUp .7s var(--ease) .55s both}
.in-s3{align-items:stretch;width:min(660px,100%);text-align:left}
.in-s3 [data-in]{opacity:0}
.in-s3.play [data-in]{animation:inUp .7s var(--ease) both;animation-delay:var(--d)}
.in-bhead{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--muted)}
.in-btitle{margin:10px 0 24px;font-size:clamp(30px,4.6vw,46px);font-weight:700;line-height:1.15;letter-spacing:-.035em}
.in-bnum{color:var(--accent);font-variant-numeric:tabular-nums}
.in-rows{display:flex;flex-direction:column;gap:12px}
.in-row{display:grid;grid-template-columns:56px minmax(0,1fr) 32px;align-items:center;gap:12px}
.in-rn{overflow:hidden;font-size:15px;font-weight:600;color:var(--fg-2);white-space:nowrap;text-overflow:ellipsis}
.in-sqs{display:flex;flex-wrap:wrap;gap:4px}
.in-sqs i,.in-leg i{width:14px;height:14px;border-radius:var(--r);background:var(--accent)}
.in-leg i{width:10px;height:10px}
.in-sqs i.k-late,.in-leg i.k-late{background:var(--open)}
.in-sqs i.k-imp,.in-leg i.k-imp{background:var(--imp)}
.in-rv{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.in-more{margin:0;font-size:13px;color:var(--muted)}
.in-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:20px;font-size:13px;color:var(--muted)}
.in-leg span{display:inline-flex;align-items:center;gap:6px}
.in-text{margin:20px 0 0;font-size:16px;line-height:1.65;color:var(--fg-2)}
.in-warn{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--open);border-radius:var(--r);background:var(--open-soft);font-size:14.5px;line-height:1.55;color:var(--fg-2)}
@media (max-width:599px){.in-row{grid-template-columns:44px minmax(0,1fr) 28px;gap:8px}.in-sqs i{width:11px;height:11px}}
/* 설정 스위치 */
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:var(--r);background:var(--fill-2);transition:background-color .3s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:var(--r);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .5s var(--spring)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(20px)}

/* 왼쪽 '오늘 공부' 칸: 측정 중이면 오른쪽으로 넓어지며 옅은 파랑이 돌고, 오늘 공부한 만큼 물이 차서 출렁임 */
@media (min-width:600px){body.timing{--lrail:98px}}
.trail{transition:width .55s var(--ease)}
.wrap{transition:margin-left .55s var(--ease)}
.newbar{transition:background-color .2s,left .55s var(--ease)}
.past-bar{transition:left .55s var(--ease)}
.trail>*:not(.tr-water){position:relative;z-index:1}
.trail::after{content:"";position:absolute;inset:0;z-index:0;background:rgba(var(--accent-rgb),.07);box-shadow:inset -2px 0 0 rgba(var(--accent-rgb),.55);opacity:0;transition:opacity .5s;pointer-events:none}
.trail.on::after{opacity:1}
.tr-water{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.tw{position:absolute;left:0;right:0;bottom:0;z-index:2;height:max(16px,var(--lvl,0%));background:var(--water);transition:height 1.6s var(--ease),background-color .6s}
.tw-wb{position:absolute;left:0;width:200%;animation:twBob 4.2s ease-in-out infinite}
.tw-wb svg{display:block;width:100%;height:100%;animation:twSlide 8s linear infinite}
.tw-wb path{fill:var(--water);transition:fill .6s}
.tw-wb.f{top:-11px;height:12px;z-index:1}
.tw-wb.b{top:-15px;height:15px;animation-duration:5.4s;animation-delay:-1.7s}
.tw-wb.b svg{animation-duration:13s;animation-direction:reverse}
.tw-wb.b path{fill:var(--water-b)}
.trail.on .tw{background:var(--water-on)}
.trail.on .tw-wb.f path{fill:var(--water-on)}
.trail.on .tw-wb.b path{fill:var(--water-b-on)}
.trail.on .tw-wb{animation-duration:2s}
.trail.on .tw-wb.b{animation-duration:2.6s}
.trail.on .tw-wb svg{animation-duration:3.2s}
.trail.on .tw-wb.b svg{animation-duration:5s}
@keyframes twSlide{to{transform:translateX(-50%)}}
/* 물 두 겹: 파랑 = 오늘(앞) · 회색 = 페이스(뒤, 정한 시간 동안 목표 시간을 고르게 채움).
   파란 물이 페이스를 넘으면 회색 수면 선만 옅게 보임 */
.tw-avg,.tw-pace{position:absolute;left:0;right:0;bottom:0;opacity:0;transition:height 1.6s var(--ease),opacity .6s}
.tw-avg{z-index:1;height:var(--avg,0%);background:var(--water-avg)}
.tw-pace{z-index:0;height:var(--pace,0%);background:var(--water-pace)}
.tr-water.has-avg .tw-avg,.tr-water.has-pace .tw-pace{opacity:1}
.ta-wb,.tp-wb{position:absolute;left:0;width:200%;animation:twBob 5.6s ease-in-out infinite}
.ta-wb svg,.tp-wb svg{display:block;width:100%;height:100%;overflow:visible;animation:twSlide 11s linear infinite}
.ta-wb.f,.tp-wb.f{top:-11px;height:12px;z-index:1}
.ta-wb.b,.tp-wb.b{top:-15px;height:15px;animation-duration:7.2s;animation-delay:-2.3s}
.ta-wb.b svg,.tp-wb.b svg{animation-duration:17s;animation-direction:reverse}
.ta-wb path{fill:var(--water-avg)}
.ta-wb.b path{fill:var(--water-avg-b)}
.tp-wb{animation-duration:4.8s}
.tp-wb svg{animation-duration:9.5s}
.tp-wb.b{animation-duration:6.2s;animation-delay:-1.1s}
.tp-wb.b svg{animation-duration:15s}
.tp-wb path{fill:var(--water-pace)}
.tp-wb.b path{fill:var(--water-pace-b)}
.tw-line{position:absolute;left:0;right:0;height:0;opacity:0;transition:bottom 1.6s var(--ease),opacity .8s}
.tw-line path{fill:none;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.tw-line.avg{z-index:4;bottom:var(--avg,0%)}
.tw-line.avg path{stroke:var(--water-avg-line)}
.tw-line.pace{z-index:3;bottom:var(--pace,0%)}
.tw-line.pace path{stroke:var(--water-pace-line)}
.tr-water.has-avg.win .tw-line.avg,.tr-water.has-pace.pace-hid .tw-line.pace{opacity:1}
@keyframes twBob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.tr-total small{margin-top:2px;font-size:10.5px;font-weight:500;color:var(--muted)}
.trail.on .tr-total small{color:var(--accent)}
.tr-sess .tr-live{display:flex;align-items:center;gap:4px;margin-bottom:2px;font-size:10.5px;font-weight:600;color:var(--accent)}
.tr-live i{width:6px;height:6px;border-radius:var(--r);background:var(--accent);animation:liveDot 1.6s ease-in-out infinite}
@keyframes liveDot{50%{opacity:.25;transform:scale(.7)}}
.tr-sess .tr-clk{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--accent)}
@media (max-width:599px){.tr-water,.trail::after{display:none}}
/* 모의고사 회차: 틀린 파트를 일퀘로 */
.wr-imp{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin:0 0 4px;border-radius:var(--r);background:var(--accent-soft);font-size:15px;font-weight:600;color:var(--accent);transition:transform .2s var(--ease),opacity .2s}
.wr-imp .ic{width:16px;height:16px}
.wr-imp:active{transform:scale(.98)}
.wr-imp:disabled{background:var(--fill);color:var(--muted)}
.wr-imp:disabled .ic{display:none}
.wr-imp.pop{animation:pop .4s var(--ease)}
.wr-q{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:var(--r);background:var(--accent-soft);font-size:11px;font-weight:600;color:var(--accent);vertical-align:1px}
.set-unit{font-size:15px;color:var(--muted)}

.cloud-st{font-size:14px;font-weight:500;color:var(--fg-2)}
.cloud-st.bad{color:var(--danger)}
.cl-sub{display:block;margin-top:2px;font-size:12px;color:var(--muted);font-weight:400}
.rail-save{display:flex;align-items:center;justify-content:center;gap:6px;height:28px;margin:0 6px 6px;border-radius:var(--r);font-size:11px;font-weight:600;color:var(--muted);transition:background-color .2s}
.rail-save:active{background:var(--fill)}
.rs-dot{width:8px;height:8px;border-radius:var(--r);background:var(--fill-2);transition:background-color .4s,box-shadow .4s}
.rail-save.green .rs-dot{background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.2)}
.rail-save.yellow .rs-dot{background:#ffcc00;box-shadow:0 0 0 3px rgba(255,204,0,.24)}
.rail-save.red .rs-dot{background:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.22);animation:liveDot 1.4s ease-in-out infinite}
.rail-save.red{color:var(--danger)}
.rail-save.sync .rs-dot{animation:liveDot 1s ease-in-out infinite}
@media (max-width:599px){.rail-save{display:none}}
.hchip.bad{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}

/* 지난 날 고치기: 이동해 있는 동안 화면 위에 뒤집힌 색 띠 */
body.past{--pbar:44px}
.past-bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--tbar));left:var(--lrail);right:var(--rail);z-index:30;display:flex;align-items:center;gap:12px;height:var(--pbar);padding:0 8px 0 16px;background:var(--fg);color:var(--bg);font-size:14px;white-space:nowrap;animation:pbIn .38s var(--ease) both}
.past-bar .pb-t b{font-weight:650}
.past-bar .pb-s{overflow:hidden;opacity:.62;font-size:13px;text-overflow:ellipsis}
.past-bar .pb-back{flex:none;height:30px;margin-left:auto;padding:0 12px;border-radius:var(--r);box-shadow:inset 0 0 0 1px currentColor;font-size:13px;font-weight:600;color:inherit}
.past-bar .pb-back:active{opacity:.7}
@keyframes pbIn{from{transform:translateY(-100%)}to{transform:none}}
@media (max-width:599px){.past-bar{right:0}.past-bar .pb-s{display:none}}
.q-locked{margin:-4px 0 14px;padding:0 4px;font-size:13px;color:var(--muted)}
.pd-row{padding:12px 16px}
.pd-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%}
.pd{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:8px 2px 7px;border-radius:var(--r);background:var(--fill);font-size:15px;line-height:1.25;transition:transform .2s var(--ease),background-color .2s}
.pd:active{transform:scale(.95)}
.pd b{font-weight:600}
.pd small{font-size:11px;color:var(--muted)}
.pd.sun small{color:var(--lv1)}
.pd-s{margin-top:2px;font-size:11px;font-weight:500;color:var(--muted)}
.pd-s.miss{color:var(--lv1)}
.pd[aria-current="date"]{background:var(--fg);color:var(--bg)}
.pd[aria-current="date"] small,.pd[aria-current="date"] .pd-s{color:inherit;opacity:.7}

.set-pend{margin:0;font-size:14px;color:var(--fg-2)}

/* 가운데 창 (편집·휴무·모의고사): 취소 | 제목 | 저장 */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 6vh) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:540px;max-height:calc(100% - 8px);border-radius:var(--r);background:var(--surface);overflow:auto;box-shadow:var(--sheet-shadow)}
.sh-head{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--sep);background:var(--surface)}
.sh-head h2{margin:0;font-size:17px;font-weight:600;text-align:center}
.sh-btn{justify-self:start;min-height:36px;font-size:17px;color:var(--accent)}
.sh-btn.strong{justify-self:end;font-weight:600}
.sh-btn:disabled{color:var(--faint);cursor:default}
.sh-body{padding:16px 16px 20px}
.subj-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pick{height:34px;padding:0 14px;border-radius:var(--r);background:var(--fill);font-size:14px;font-weight:500;transition:background-color .25s,color .25s,transform .2s var(--ease)}
.pick[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.pick:active{transform:scale(.95)}
.pp-box{margin-bottom:4px}
.sub-pick{margin:-6px 0 12px}
.sub-pick .pick{height:30px;padding:0 12px;font-size:13px}
.sub-pick .pick[aria-checked="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.field{display:block;width:100%;padding:12px 14px;border:0;border-radius:var(--r);background:var(--fill);font-size:16px;color:var(--fg);outline:none;transition:box-shadow .2s}
.field::placeholder{color:var(--faint)}
.field:focus{box-shadow:0 0 0 2px var(--accent)}
.field.big{font-size:19px;font-weight:600}
textarea.field{min-height:96px;margin-top:10px;line-height:1.5;resize:none}
.sh-flash{min-height:20px;margin-top:12px;font-size:13px;color:var(--muted)}
.f-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
input[type="date"].field{min-height:47px;-webkit-appearance:none;appearance:none}
.field.score{margin-top:10px;font-size:24px;font-weight:700}
.sh-err{min-height:18px;margin:10px 2px 0;font-size:13px;color:var(--danger)}
.sh-del{width:100%;height:46px;margin-top:14px;border-radius:var(--r);background:var(--fill);font-size:16px;font-weight:500;color:var(--danger)}
.sh-del.armed{background:var(--danger);color:var(--on-danger)}

/* 아래에서 튀어 오르는 반쪽 시트 (새 주제). 아래로 끌거나 바깥을 누르면 닫힘.
   스프링이 살짝 넘칠 때 틈이 안 보이게 화면 밖으로 치마(--skirt)를 늘어뜨림 */
.dw-wrap{position:fixed;inset:0;z-index:40}
.drawer{--skirt:90px;--dh:min(clamp(340px,52dvh,600px),calc(100dvh - var(--kb,0px) - env(safe-area-inset-top,0px) - 24px));position:absolute;left:calc(var(--lrail) + env(safe-area-inset-left,0px));right:calc(var(--rail) + env(safe-area-inset-right,0px));bottom:calc(var(--kb,0px) - var(--skirt));display:flex;flex-direction:column;height:calc(var(--dh) + var(--skirt) + env(safe-area-inset-bottom,0px));padding-bottom:calc(var(--skirt) + env(safe-area-inset-bottom,0px));border-radius:var(--r) var(--r) 0 0;background:var(--surface);box-shadow:0 -10px 40px rgba(0,0,0,.16);transition:bottom .25s var(--ease)}
@media (max-width:599px){.drawer{left:0;right:0}}
.dw-grip{flex:none;display:grid;place-items:center;height:20px;touch-action:none;cursor:grab}
.dw-grip i{width:36px;height:5px;border-radius:var(--r);background:var(--fill-2)}
.dw-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 16px 6px max(16px,env(safe-area-inset-left,0px));touch-action:none}
.dw-head h2{margin:0;font-size:17px;font-weight:600;text-align:center}
.dw-tabs{flex:none;position:relative;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px 0 max(3px,calc(env(safe-area-inset-left,0px) - 13px));box-shadow:inset 0 -1px 0 var(--sep)}
.dw-tabs::-webkit-scrollbar{display:none}
.dw-tab{flex:none;height:44px;padding:0 13px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .25s}
.dw-tab[aria-checked="true"]{font-weight:600;color:var(--accent)}
.dw-ink{position:absolute;left:0;bottom:0;width:0;height:2.5px;background:var(--accent);pointer-events:none}
.dw-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px 14px max(16px,env(safe-area-inset-left,0px))}
.dw-grid{flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 24px;max-width:1100px}
@media (max-width:760px){.dw-grid{flex:none;grid-template-columns:minmax(0,1fr)}}
@media (min-width:761px){.dw-col textarea.field{flex:1 1 auto}}
.dw-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.dw-lbl{font-size:13px;font-weight:500;color:var(--muted)}
.dw-col textarea.field{min-height:96px;margin-top:0}
.dw-col .sh-flash{margin-top:0}
.dw-part .subj-pick{margin:0 0 10px}
.dw-note{margin:0;font-size:14px;line-height:1.55;color:var(--faint)}
/* 휴무 창 */
.off-box{display:flex;flex-direction:column;gap:10px}
.off-lead{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.off-list{display:flex;flex-direction:column;gap:8px}
.off-opt{display:grid;grid-template-columns:4px minmax(0,1fr) 8px;align-items:center;gap:14px;min-height:60px;padding:0 14px 0 0;border-radius:var(--r);background:var(--fill);text-align:left;overflow:hidden;transition:background-color .2s,transform .2s var(--ease),opacity .2s}
.off-opt>i{align-self:stretch;background:var(--off-c)}
.off-opt b{display:block;font-size:16px;font-weight:600;color:var(--fg)}
.off-opt small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.off-opt .ic{width:8px;height:13px;color:var(--faint)}
.off-opt:active{transform:scale(.985);background:var(--fill-2)}
.off-opt:disabled{opacity:.38;cursor:default;transform:none}
.off-back{align-self:flex-start;height:32px;font-size:15px;color:var(--accent)}
.off-go{height:46px;border:0;border-radius:var(--r);background:var(--off-c);font-size:16px;font-weight:600;color:var(--on-accent);transition:opacity .2s,transform .2s var(--ease)}
.off-go:disabled{opacity:.35;cursor:default}
.off-go:active{transform:scale(.97)}
.off-go.ghost{background:var(--fill);color:var(--accent)}
.off-go.ghost.danger{color:var(--danger)}
.tm-cut{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.tm-cut .off-go{padding:0 18px}
.off-now{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px;font-weight:700}
.off-now i{width:11px;height:11px;border-radius:var(--r)}
.nag{display:flex;flex-direction:column;gap:12px;padding:4px 0 2px}
.nag-step{font-size:13px;font-weight:700;color:var(--off-skip)}
.nag-q{margin:0;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.025em;text-wrap:balance}
.nag-sub{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.nag-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.nag-btns button{min-height:50px;padding:6px 10px;border-radius:var(--r);font-size:15px;font-weight:600;line-height:1.25;transition:transform .2s var(--ease)}
.nag-btns button:active{transform:scale(.96)}
.nag-give{background:var(--fill);color:var(--danger)}
.nag-keep{background:var(--accent);color:var(--on-accent)}
.nag-half{background:var(--lv5);color:var(--lv5-fg)}

/* 토스트, 오류 */
.toast{position:fixed;left:calc(var(--lrail) + (100% - var(--lrail) - var(--rail))/2);bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom,0px));z-index:50;padding:10px 16px;border-radius:var(--r);background:var(--toast-bg);color:var(--toast-fg);font-size:14px;font-weight:500;white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);transform:translateX(-50%)}
@media (max-width:599px){.toast{left:50%;bottom:calc(58px + var(--bar-h) + 16px + env(safe-area-inset-bottom,0px))}}
.err-box{padding:16px;border-radius:var(--r);background:var(--surface);color:var(--danger)}


/* 반복퀘스트 (퀘스트 탭) */
.rzone{margin-bottom:28px}
.rz-head{align-items:center}
.rz-add{display:inline-flex;align-items:center;gap:5px;height:30px;margin-left:auto;padding:0 12px 0 9px;border-radius:var(--r);background:var(--accent-soft);font-size:13px;font-weight:600;color:var(--accent);transition:transform .2s var(--ease)}
.rz-add .ic{width:13px;height:13px}
.rz-add:active{transform:scale(.95)}
.rz-card{columns:2 340px;column-gap:0;column-rule:1px solid var(--sep);padding:2px 0 6px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}
.rz-grp{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
.qrow.rrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title rates";padding:6px 12px 6px 14px}
.rrow .q-rates{margin-top:0;justify-self:end}
.rz-empty{display:flex;flex-direction:column;gap:4px;width:100%;padding:16px 18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow);text-align:left;transition:transform .2s var(--ease)}
.rz-empty:active{transform:scale(.99)}
.rz-empty b{font-size:15px;font-weight:600;color:var(--accent)}
.rz-empty span{font-size:13px;line-height:1.5;color:var(--muted)}
.todo-strip.old{margin:10px 0 0}
.rp-list{display:flex;flex-direction:column;gap:6px}
.rp-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:0 12px 0 14px;border-radius:var(--r);background:var(--fill);font-size:15px;text-align:left;transition:transform .2s var(--ease)}
.rp-item span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rp-item .ic{width:7px;height:11px;color:var(--faint)}
.rp-item:active{transform:scale(.98)}
.rp-item.new{animation:rowin .5s var(--ease) both}

/* 홈: 디데이 옆 브리핑, 아래 오늘 퀘스트 · 반복퀘스트 */
.hm-hero{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,390px);align-items:center;align-content:center;gap:24px 40px;padding:26px 0}
.hm-hero .hm-dd{padding:0 2px}
@media (max-width:899px){.hm-hero{grid-template-columns:minmax(0,1fr);align-items:start}}
.hm-qs{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:0 44px;box-shadow:inset 0 1px 0 var(--sep)}
.hm-qs>.hm-q{box-shadow:none}
@media (max-width:760px){.hm-qs{grid-template-columns:minmax(0,1fr)}.hm-qs>.hm-q+.hm-q{margin-top:14px;box-shadow:inset 0 1px 0 var(--sep)}}
.hm-brief{display:flex;flex-direction:column;gap:12px;padding:16px 18px 18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow)}
.hb-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hb-head b{font-size:15px;font-weight:700}
.hb-tag{flex:none;padding:3px 9px;border-radius:var(--r);background:var(--fill);font-size:12px;font-weight:700;color:var(--muted)}
.hb-tag.busy{background:var(--open-soft);color:var(--open)}
.hb-tag.heavy{background:var(--bad-bg);color:var(--danger)}
.hb-tag.light,.hb-tag.done{background:var(--lv5-t);color:var(--up)}
.hb-text{margin:0;font-size:15px;line-height:1.6;color:var(--fg-2);word-break:keep-all;overflow-wrap:anywhere}
.hb-bars{display:flex;flex-direction:column;gap:7px}
.hb-row{display:grid;grid-template-columns:86px minmax(0,1fr) 30px;align-items:center;gap:10px;font-size:13px}
.hb-row .nm{overflow:hidden;color:var(--fg-2);white-space:nowrap;text-overflow:ellipsis}

.ps-t{margin-bottom:10px;font-size:13px;font-weight:600;color:var(--muted)}
.ps-bar{display:flex;gap:2px;height:14px}

.dt-empty{margin:4px 2px;font-size:14px;line-height:1.6;color:var(--muted)}

/* 캘린더: 반복퀘스트 % (칸 아래 색 줄) */
.cd-rep{position:absolute;left:0;bottom:0;height:3px;max-width:100%}
.wkd{position:relative}

.wkd-rp i{position:absolute;left:0;bottom:0;height:3px;max-width:100%}

/* 공부 기록 탭 */

.sv-chart{padding:14px 16px 12px}

.sv-v{position:absolute;left:50%;z-index:2;font-size:11px;font-weight:600;color:var(--fg-2);white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .2s;pointer-events:none}

.sv-y{position:absolute;top:0;right:0;bottom:0;width:42px}

.sv-dates{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-right:46px;padding-top:5px;font-size:11px;color:var(--muted);text-align:center}
.sv-dates .today{font-weight:700;color:var(--accent)}
.sg-box{padding:14px 16px 12px}
.sg-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;max-width:520px}
.sg-m,.sg{display:grid;grid-template-columns:repeat(var(--wk),minmax(0,1fr));gap:3px}
.sg-m span{overflow:visible;font-size:10px;color:var(--muted);white-space:nowrap}
.sg-wd{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:3px;font-size:10px;line-height:1;color:var(--faint)}
.sg-wd span{display:flex;align-items:center}
.sg-col{display:grid;grid-template-rows:repeat(7,auto);gap:3px}
.sg-c{display:block;aspect-ratio:1;width:100%;padding:0;border-radius:var(--r);background:var(--fill);transition:transform .15s}
.sg-c[data-l="1"]{background:rgba(var(--accent-rgb),.2)}
.sg-c[data-l="2"]{background:rgba(var(--accent-rgb),.38)}
.sg-c[data-l="3"]{background:rgba(var(--accent-rgb),.56)}
.sg-c[data-l="4"]{background:rgba(var(--accent-rgb),.76)}
.sg-c[data-l="5"]{background:var(--accent)}
.sg-c.out{visibility:hidden}
.sg-c.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.sg-c.today{box-shadow:inset 0 0 0 1.5px var(--accent)}

button.sg-c:active{transform:scale(.85)}
.sg-leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:12px;font-size:11px;color:var(--muted)}
.sg-leg i{width:11px;height:11px;border-radius:var(--r);background:var(--fill)}
.sg-leg i[data-l="1"]{background:rgba(var(--accent-rgb),.2)}
.sg-leg i[data-l="2"]{background:rgba(var(--accent-rgb),.38)}
.sg-leg i[data-l="3"]{background:rgba(var(--accent-rgb),.56)}
.sg-leg i[data-l="4"]{background:rgba(var(--accent-rgb),.76)}
.sg-leg i[data-l="5"]{background:var(--accent)}
.sg-step{margin-left:auto;color:var(--faint)}
.sv-tot{font-size:15px;font-weight:700;color:var(--fg)}
.sv-db{padding-top:14px}
.tl{margin-bottom:12px}
.tl-bar{position:relative;height:32px;border-radius:var(--r);background:var(--fill);overflow:hidden}
.tl-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--sep)}
.tl-seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--accent);box-shadow:inset 1px 0 0 var(--surface),inset -1px 0 0 var(--surface);font-size:11px;font-weight:600;color:var(--on-accent);white-space:nowrap;transform-origin:left center;animation:growx .7s var(--ease) both}
.tl-seg.live{animation:tlpulse 1.4s ease-in-out infinite alternate}
@keyframes tlpulse{to{opacity:.55}}
.tl-x{position:relative;height:16px;margin-top:4px}
.tl-x span{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
.tl-x span:first-child{transform:none}
.tl-x span:last-child{transform:translateX(-100%)}
.sv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sv-chips span{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:var(--r);background:var(--fill);font-size:13px;color:var(--fg-2)}
.sv-chips b{font-weight:700;color:var(--fg)}
.ss-list{display:flex;flex-direction:column}
.ss-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;min-height:42px;border-top:1px solid var(--sep);font-size:14px}
.ss-time{color:var(--fg-2);white-space:nowrap}
.ss-sub{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ss-sub small{margin-left:6px;padding:1px 5px;border-radius:var(--r);background:var(--fill);font-size:10.5px;color:var(--muted)}
.ss-dur{font-weight:600;white-space:nowrap}
.ss-del{height:28px;padding:0 10px;border-radius:var(--r);background:var(--fill);font-size:12px;color:var(--muted);white-space:nowrap;transition:background-color .2s,color .2s}
.ss-del.armed{background:var(--danger);color:var(--on-danger)}
.ss-live{font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.ss-none{margin:0;padding:10px 0;font-size:13px;line-height:1.55;color:var(--muted)}
.ss-note{margin:10px 0 0;font-size:12px;color:var(--faint)}
.ss-add{margin-top:12px;height:34px;padding:0 13px;border-radius:var(--r);background:var(--accent-soft);font-size:13px;font-weight:600;color:var(--accent);transition:transform .2s var(--ease)}
.ss-add:active{transform:scale(.96)}
.sv-subj .pn-head .seg2{margin-left:auto}
.sv-rows{display:flex;flex-direction:column;gap:2px}
.sv-row{display:grid;grid-template-columns:96px minmax(0,1fr) 46px 38px;align-items:center;gap:10px;min-height:34px;font-size:14px}
.sv-n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sv-hm{font-weight:600;color:var(--fg-2);text-align:right}
.sv-p{font-size:12px;color:var(--muted);text-align:right}
.sa-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:10px}

/* 모의고사 첫 화면: 과목 칸 (세로로 긴 네모) */
.mk-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin:-4px 4px 14px;font-size:13px;color:var(--muted)}
.mk-sum b{margin-left:6px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.mk-sum .bad b{color:var(--fail)}
.mk-key{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-left:auto;font-size:12px}
.mk-key span{display:inline-flex;align-items:center;gap:5px}
.bd{display:inline-block;flex:none;width:10px;height:10px;border-radius:var(--r)}
.bd[data-band="good"],.mt-zone[data-band="good"],.mt-c[data-band="good"],.mk-zone[data-band="good"],.mk-pt[data-band="good"]{background:var(--lv5)}
.bd[data-band="mid"],.mt-zone[data-band="mid"],.mt-c[data-band="mid"],.mk-zone[data-band="mid"],.mk-pt[data-band="mid"]{background:var(--lv2)}
.bd[data-band="low"],.mt-zone[data-band="low"],.mt-c[data-band="low"],.mk-zone[data-band="low"],.mk-pt[data-band="low"]{background:var(--lv1)}
.bd[data-band="fail"],.mt-zone[data-band="fail"],.mt-c[data-band="fail"],.mk-zone[data-band="fail"],.mk-pt[data-band="fail"]{background:var(--fail)}
.sdot{display:inline-block;flex:none;width:8px;height:8px;margin-right:7px;border-radius:var(--r);vertical-align:1px}
.mt-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
@media (max-width:1000px){.mt-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.mt-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mt{container-type:inline-size;position:relative;display:flex;flex-direction:column;min-width:0;min-height:330px;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow);overflow:hidden;transition:background-color .3s}
.mt::before{content:"";position:absolute;left:0;right:0;top:0;z-index:1;height:3px;background:var(--scol)}
.mt.low{background:var(--fail-soft)}
.mt.none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fill-2)}
.mt-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:22px;padding:15px 14px 0}
.mt-n{display:flex;align-items:center;min-width:0;overflow:hidden;font-size:14px;font-weight:700;white-space:nowrap}
.mt-n .short{display:none}
.mt-dots{flex:none;display:flex;gap:5px}
.mt-dots button{position:relative;width:7px;height:7px;padding:0;border-radius:var(--r);background:var(--fill-2);transition:background-color .25s,transform .25s var(--ease)}

.mt-track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.mt-track::-webkit-scrollbar{display:none}
.mt-slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:6px;min-width:0;padding:6px 14px 13px;text-align:left}
.mt-slide:active .mt-v b{opacity:.7}
.mt-sn{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;font-size:12.5px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.mt-v{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.mt-v b{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:proportional-nums;transition:opacity .15s}
.mt-v small{font-size:14px;color:var(--muted)}
.mt-slide[data-band="fail"] .mt-v b{color:var(--fail)}
.mt-tag{flex:none;align-self:center;margin-left:auto;padding:2px 7px;border-radius:var(--r);background:var(--fail);font-size:11px;font-weight:700;color:#fff}
.mt-d{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:12px;color:var(--muted)}
