/* 사용자가 알려 준 모의고사 목록과 점수 기준(만점·목표·최소). 과락은 만점의 40%, 비율로 낸 값은 소수점 내림.
   앱에 한 번만 넣음(presets 표시). 같은 과목에 이름이 같은(띄어쓰기 무시, 한쪽이 다른 쪽을 품는) 모의고사가 있으면 기준만 바꿈 */
var MOCK_PRESET_ID='mock2611';
var MOCK_PRESET=[
  ['재무회계','기베모',35,32,28],['재무회계','함현재 모의고사',35,32,28],
  ['원가관리회계','기출',10,8,6],['원가관리회계','함현재 모의고사',10,8,6],
  ['세법','기출',40,32,25],['세법','함현재 모의고사',35,Math.floor(35*32/40),Math.floor(35*25/40)],
  ['재무관리','기출',24,22,20],['재무관리','이영우 모의고사',19,Math.floor(19*22/24),Math.floor(19*20/24)],
  ['상법','기출',40,38,32],['상법','빈지노',20,Math.floor(20*38/40),Math.floor(20*32/40)]
];
function presetKey(nm){return String(nm||'').replace(/\s+/g,'');}
function applyPresets(){
  if(!state)return false;
  if(state.presets&&state.presets[MOCK_PRESET_ID])return false;
  MOCK_PRESET.forEach(function(p){
    var sj=subjectByName(p[0]);if(!sj)return;
    p=[sj.id].concat(p.slice(1));
    var cfg={max:p[2],goal:p[3],min:p[4],fail:Math.floor(p[2]*0.4)},key=presetKey(p[1]);
    var ser=state.mocks.filter(function(m){
      if(m.subject!==p[0])return false;var mk=presetKey(m.name);
      return mk===key||(mk&&(mk.indexOf(key)>=0||key.indexOf(mk)>=0));
    })[0];
    if(ser)ser.cfg=cfg;
    else state.mocks.push({id:uid(),subject:p[0],name:p[1],rounds:[],cfg:cfg});
  });
  if(!state.presets)state.presets={};
  state.presets[MOCK_PRESET_ID]=1;
  return true;
}
/* 클라우드와 맞춘 뒤에 넣어야 오래된 기기 데이터가 최신 클라우드를 덮지 않음 */
function afterSyncPresets(){
  if(cloud.conflict||!state)return;
  if(applyPresets()){saveNow();if(ui.tab==='mock'||ui.tab==='settings')renderView();}
}

function freshState(){
  state=sanitize({v:2,subjects:defaultSubjects(),items:[]});
  state.presets={};state.presets[MOCK_PRESET_ID]=1;
  return state;
}
/* rec = 데이터베이스에서 읽은 {at, json}, idbRead = 데이터베이스를 제대로 읽었는지 */
function load(rec,idbRead){
  var raw=null,lsAt=0,loaded=null,c=[];
  try{raw=localStorage.getItem(KEY);lsAt=+(localStorage.getItem(KEY+'.at')||0)||0;IDB.marked=localStorage.getItem(KEY+'.idb')==='1';}catch(e){}
  if(rec&&typeof rec.json==='string')c.push({j:rec.json,at:+rec.at||0,idb:1});
  if(raw)c.push({j:raw,at:lsAt,idb:0});
  /* 데이터베이스를 쓰던 기기인데 못 읽었고 localStorage 사본도 최신 표시가 없으면: 보여만 주고 저장은 멈춤 */
  if(!idbRead&&IDB.marked&&!lsAt)IDB.ro=true;
  /* 고르는 순서: 데이터 안의 바뀐 시각(savedAt) → 저장한 시각(at) → 데이터베이스. 깨진 쪽은 따로 남겨 둠 */
  var ok=[];
  c.forEach(function(x){
    try{x.s=sanitize(JSON.parse(x.j));x.sa=+x.s.savedAt||0;ok.push(x);}
    catch(e){if(x.idb)idbPutKey('bak',x.j);else{try{localStorage.setItem(KEY+'.bak',x.j);}catch(e2){}}}
  });
  ok.sort(function(a,b){return (b.sa-a.sa)||(b.at-a.at)||(b.idb-a.idb);});
  if(ok.length)loaded=ok[0].s;
  state=loaded||freshState();
  delete state.chSeeded;
  saveNow();
}
/* 복습 직전 상태(before)는 최근 14일 것까지 남겨 둠 → 지난 날로 가서 점수를 다시 고르거나 취소할 수 있음 */
function prune(t){
  var changed=false,rt=realToday(),keep=pastMin();
  state.items.forEach(function(it){
    if(it.before&&(it.before.date<keep||it.before.date>rt)){delete it.before;changed=true;}
    if(it.pulledOn&&it.pulledOn<t){it.pulledOn=null;changed=true;}
  });
  return changed;
}
/* 하루 기록(목표·완료). 지난 날로 와 있을 땐 다시 계산하지 않고, 이동한 뒤 고친 만큼만 원래 기록에 더하고 뺌
   (그 뒤에 늦게 해치운 박스는 지금 계산하면 그날 목표에서 빠져 버리기 때문) */
function logToday(t){
  var st=dayStats(state.items,t),e=state.dayLog[t],off=e&&e.off?e.off:null,goal=st.goal,done=st.done;
  if(t!==realToday()){
    var pb=ui.pastBase;
    if(!pb||pb.d!==t)return;
    if(!e&&st.goal===pb.sg&&st.done===pb.sd)return;
    done=Math.max(0,pb.done+(st.done-pb.sd));
    goal=Math.max(done,pb.goal+(st.goal-pb.sg));
  }
  if(off&&off.kind!=='half')goal=done;
  if(!e||e.goal!==goal||e.done!==done){
    var n={goal:goal,done:done};if(off)n.off=off;
    state.dayLog[t]=n;scheduleSave();
  }
}

/* ---------- DOM ---------- */
/* 자식 바꾸기 (null은 건너뜀. 기본 replaceChildren은 null을 'null' 글자로 넣음) */
function setKids(el,k){el.replaceChildren();addKids(el,k);return el;}
function addKids(el,k){
  if(k==null||k===false)return;
  if(Array.isArray(k)){k.forEach(function(x){addKids(el,x);});return;}
  el.appendChild(k&&k.nodeType?k:document.createTextNode(String(k)));
}
function h(tag,props){
  var el=document.createElement(tag);
  if(props){for(var k in props){
    var v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='value')el.value=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,String(v));
  }}
  for(var i=2;i<arguments.length;i++)addKids(el,arguments[i]);
  return el;
}
var SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){var el=document.createElementNS(SVGNS,tag);for(var k in attrs)el.setAttribute(k,String(attrs[k]));return el;}
function iconEl(name){var s=document.createElement('span');s.className='ic';s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[name];return s;}

/* ---------- 움직임 ---------- */
var RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
function motion(){return !(RM&&RM.matches);}
function anim(el,kf,opt){if(!el||!motion()||!el.animate)return null;try{return el.animate(kf,opt);}catch(e){return null;}}
function finished(a){return (a&&a.finished)?a.finished.then(function(){},function(){}):Promise.resolve();}
function cancelAnims(el){if(el&&el.getAnimations)el.getAnimations().forEach(function(a){a.cancel();});}
function nextFrame(fn){requestAnimationFrame(function(){requestAnimationFrame(fn);});}
function flip(container,sel,mutate){
  var before={};
  container.querySelectorAll(sel).forEach(function(el){before[el.getAttribute('data-key')]=el.getBoundingClientRect();});
  mutate();
  if(!motion())return;
  container.querySelectorAll(sel).forEach(function(el){
    var b=before[el.getAttribute('data-key')],a=el.getBoundingClientRect();
    if(b){
      var dx=b.left-a.left,dy=b.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)anim(el,[{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:400,easing:EASE});
    }else anim(el,[{opacity:0,transform:'scale(.98)'},{opacity:1,transform:'none'}],{duration:300,delay:90,easing:EASE,fill:'backwards'});
  });
}
function measureSq(root){
  var m={};
  if(!root)return m;
  root.querySelectorAll('.sq[data-id]').forEach(function(el){
    var cs=getComputedStyle(el);
    m[el.getAttribute('data-id')]={r:el.getBoundingClientRect(),bg:cs.backgroundColor,fg:cs.color};
  });
  return m;
}
function morph(els,old){
  if(!motion())return;
  var i=0;
  els.forEach(function(el){
    var o=old[el.getAttribute('data-id')];if(!o)return;
    var r=el.getBoundingClientRect();if(!r.width)return;
    var cs=getComputedStyle(el);
    var dx=o.r.left-r.left,dy=o.r.top-r.top,sx=o.r.width/r.width,sy=o.r.height/r.height;
    anim(el,[{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',backgroundColor:o.bg,color:o.fg},{transform:'none',backgroundColor:cs.backgroundColor,color:cs.color}],{duration:580,easing:EASE,delay:Math.min(i++,40)*7,fill:'backwards'});
  });
}
function countUp(el,to,dur){
  if(!motion()){el.textContent=String(to);return;}
  var t0=null;
  function step(ts){if(t0==null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=String(Math.round(to*e));if(p<1)requestAnimationFrame(step);}
  el.textContent='0';requestAnimationFrame(step);
}

/* ---------- 토스트 ---------- */
var toastEl=null,toastTimer=null,toastSeq=0;
function toast(msg){
  if(!toastEl){toastEl=h('div',{class:'toast',role:'status','aria-live':'polite'});document.body.appendChild(toastEl);}
  var seq=++toastSeq;
  cancelAnims(toastEl);
  toastEl.textContent=msg;toastEl.hidden=false;toastEl.classList.remove('has-act');
  anim(toastEl,[{opacity:0,transform:'translate(-50%,10px) scale(.96)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:340,easing:EASE});
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){
    var a=anim(toastEl,[{opacity:1},{opacity:0}],{duration:240,fill:'forwards'});
    finished(a).then(function(){if(seq!==toastSeq)return;toastEl.hidden=true;if(a)a.cancel();});
  },1900);
}

/* 함현재 출석 박스: 남은 시간이 1초마다 줄고, 빨간 게이지가 왼쪽부터 차오름. 5분 남으면 진하게, 시각 되면 '출석!' */
var ATT_WD=['일','월','화','수','목','금','토'];
function attLabel(x){return (x.days===0?'':x.days===1?'내일 ':ATT_WD[x.dow]+' ')+x.n+'교시';}
function attRemain(ms){
  var s=Math.max(0,Math.ceil(ms/1000)),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
  return hh?(hh>=3?hh+'시간':hh+'시간 '+mm+'분'):(mm?mm+'분 '+pad2(ss)+'초':ss+'초');
}
function tickAtt(){
  var el=document.getElementById('rail-att');if(!el)return;
  var x=state&&!state.attOff?attNext(Date.now()):null;
  if(!x){if(!el.hidden)el.hidden=true;return;}
  el.hidden=false;
  var now=Date.now(),rem=x.at-now,p=x.live?1:Math.max(0,Math.min(1,(now-x.from)/(x.at-x.from)));
  el.firstChild.style.transform='scaleX('+p.toFixed(4)+')';
  el.children[1].textContent=attLabel(x);
  var at=new Date(x.at);

/* ---------- 메모 수식: $…$ 는 줄 안에, $$…$$ 는 한 줄 크게 (노션처럼 \frac{1}{2}, \times …) ----------

   KaTeX는 수식이 든 메모를 처음 볼 때만 내려받고, 못 받으면(인터넷 없음) 글자 그대로 보여 줌.
   달러 기호를 글자로 쓰려면 \$ */
var KATEX_URL='https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js';

/* 감사보고서 테마: '제 N일 ○년 ○월 ○일 04시부터 다음 날 04시까지' + 하루 마감 때 감사의견 도장.
   N = 처음 기록한 날부터 센 날수. 의견: 퀘스트 다 함 적정, 70% 이상 한정, 그 아래 부적정, 하나도 안 함 의견거절 */
function firstDay(){
  var m=null;
  state.items.forEach(function(it){if(it.createdAt&&(!m||it.createdAt<m))m=it.createdAt;});
  (state.sessions||[]).forEach(function(x){var d=splitKey(x.s);if(d&&(!m||d<m))m=d;});
  return m;
}
function dartOpinion(t,st,full){
  if(full)return null;

  if(!closed)return {k:'ing',n:'감사 진행 중'};
  if(!st.goal)return {k:'ok',n:'적정'};
  var p=st.done/st.goal;
  return p>=1?{k:'ok',n:'적정'}:p>=.7?{k:'qual',n:'한정'}:p>0?{k:'adv',n:'부적정'}:{k:'dis',n:'의견거절'};
}
function dartTop(t,st,full){
  var f=firstDay(),n=f?Math.max(1,diffDays(t,f)+1):1,nx=addDays(t,1);
  var ymd=function(d){var a=d.split('-');return a[0]+'년 '+(+a[1])+'월 '+(+a[2])+'일';};
  var op=dartOpinion(t,st,full);

    h('div',{class:'dt-t'},'퀘 스 트 결 산 서'),

}

/* 오늘의 브리핑: 어느 과목이 많은지, 평소보다 얼마나 많은지, 먼저 챙길 것 */
function dayBrief(t){
  var req=state.items.filter(function(it){return isRequired(it,t);});
  var total=req.length,by={},doneN=0;
  req.forEach(function(it){var o=by[it.subject]||(by[it.subject]={n:0,left:0});o.n++;if(isDoneToday(it,t))doneN++;else o.left++;});
  var left=total-doneN;
  var subs=state.subjects.filter(function(s){return by[s.id]&&by[s.id].left;}).map(function(s){return {sid:s.id,name:s.name,n:by[s.id].n,left:by[s.id].left};}).sort(function(a,b){return b.left-a.left;});
  /* 평소 = 지난 14일 하루 할 일 평균 (휴무·할 일 없던 날 빼고, 3일 이상 있을 때만) */
  var sum=0,days=0;
  for(var i=1;i<=14;i++){var d=addDays(t,-i),e=state.dayLog[d];if(!e||(e.off&&e.off.kind!=='half')||!e.goal)continue;sum+=e.goal;days++;}
  var avg=days>=3?sum/days:null,ratio=avg?total/avg:null;
  /* 과목별 평소 = 지난 14일 그 과목 복습 수 ÷ 복습한 날 수 */
  var hs={},hd={},lo=addDays(t,-14);
  state.items.forEach(function(it){(it.history||[]).forEach(function(e){if(e.date<t&&e.date>=lo){hs[it.subject]=(hs[it.subject]||0)+1;hd[e.date]=1;}});});
  var nd=Object.keys(hd).length,c=questCounts(state.items,t);
  var tone='calm',tag='보통',lines=[],warn=null;
  if(!total){tone='light';tag='가벼운 날';lines.push('오늘은 복습할 퀘스트가 없어요. 반복퀘스트나 새 진도에 시간을 쓰세요.');}
  else if(!left){tone='done';tag='다 했어요';lines.push('오늘 복습 '+total+'개를 다 끝냈어요.');}
  else{
    var top=subs[0],sec=subs[1];
    if(sec)lines.push((doneN?'남은 '+left+'개 중 ':'오늘은 ')+top.name+'('+top.left+'개)'+josa(top.name,'이','가')+' 가장 많고, '+sec.name+'('+sec.left+'개)'+josa(sec.name,'이','가')+' 그다음이에요.');
    else lines.push((doneN?'남은 건 ':'오늘은 ')+top.name+' '+top.left+'개뿐이에요.');
    if(ratio!=null){
      var av=Math.round(avg);
      if(ratio>=1.6){tone='heavy';tag='아주 많은 날';lines.push('평소(하루 '+av+'개)의 '+fmtNum(Math.round(ratio*10)/10)+'배예요. 오래 걸릴 수 있으니 시간을 넉넉히 잡고 일찍 시작하세요.');}
      else if(ratio>=1.25){tone='busy';tag='많은 날';lines.push('평소(하루 '+av+'개)보다 '+Math.round((ratio-1)*100)+'% 많아서 시간이 더 걸릴 거예요.');}
      else if(ratio<=0.75){tone='light';tag='가벼운 날';lines.push('평소(하루 '+av+'개)보다 적은 날이에요.');}
      else lines.push('평소(하루 '+av+'개)와 비슷한 양이에요.');
    }else if(total>=60){tone='heavy';tag='아주 많은 날';lines.push('오늘 '+total+'개라 오래 걸릴 수 있어요. 시간을 넉넉히 잡아 두세요.');}
    else if(total>=35){tone='busy';tag='많은 날';lines.push('오늘 '+total+'개로 양이 꽤 돼요.');}
    var u=(nd>=3&&hs[top.sid])?hs[top.sid]/nd:null;
    if(u&&top.left>=8&&top.left>=u*1.5)warn=top.name+josa(top.name,'은','는')+' 평소(하루 '+Math.round(u)+'개)의 '+fmtNum(Math.round(top.left/u*10)/10)+'배라 제일 오래 걸릴 거예요. 먼저 시작하는 걸 추천해요.';
    else if(c.open>=10)warn='미해결이 '+c.open+'개 밀려 있어요. 오래 둘수록 더 잊으니 먼저 털어내요.';
    else if(c.imp>=5)warn='중요 복습이 '+c.imp+'개 있어요. 틀렸던 것들이라 시간이 더 걸려요.';
  }
  return {tone:tone,tag:tag,lines:lines,warn:warn,subs:subs,left:left};
}

function lvOf(it){return it.score==null?0:it.score;}
function activeFilters(f){return [1,2,3,4,5,0].filter(function(l){return !!f[l];});}
function detailShown(all){var a=activeFilters(ui.filter);return detailOrder(all).filter(function(i){return !a.length||a.indexOf(lvOf(i))>=0;});}
/* 챕터별 성취도에서 장을 누르면 그 장(또는 구분없음, 장 없는 과목은 전체)만 */
function inPart(it,sid,part){
  if(hasSubs(sid)&&part.sub!=null&&it.sub!==part.sub)return false;
  if(part.ch==='all')return true;
  if(part.ch==='none'){var chs=chaptersOf(sid,part.sub);return it.ch==null||!chs.some(function(c){return c.n===it.ch;});}
  return it.ch===part.ch;
}
function wrongInPart(w,sid,part){
  if(!(w.ch!=null||w.sub))return false;
  if(hasSubs(sid)&&part.sub!=null&&w.sub!==part.sub)return false;
  if(part.ch==='all')return true;
  if(part.ch==='none'){var chs=chaptersOf(sid,part.sub);return w.ch==null||!chs.some(function(c){return c.n===w.ch;});}
  return w.ch===part.ch;
}
function detailItems(sid){var all=state.items.filter(function(i){return i.subject===sid;});return ui.detailPart?all.filter(function(i){return inPart(i,sid,ui.detailPart);}):all;}
function detailKids(all,t,sid){return (ui.detailPart&&ui.detailPart.ch!=='all')?detailShown(all).map(function(it){return dtRow(it,t);}):detailListKids(all,t,sid);}
function partTitle(sid,part){
  if(part.ch==='all')return part.sub||'전체';
  if(part.ch==='none')return '구분없음';

function detailListKids(all,t,sid){
  var shown=detailShown(all),secs=structOf(sid);
  if(!secs.length)return shown.map(function(it){return dtRow(it,t);});
  var out=[];
  function meta(list){var a=achievement(list);return list.length+'개'+(a.n?' · '+a.pct+'%':'');}
  function chapterPart(chs,pool,poolAll,key){
    if(!chs.length){pool.forEach(function(it){out.push(dtRow(it,t));});return;}
    var gmap={},groups=chs.map(function(c){var g={key:key+'-'+c.n,label:c.n+'장 '+c.name,items:[],all:[]};gmap[c.n]=g;return g;});
    var none={key:key+'-none',label:'구분없음',items:[],all:[]};
    poolAll.forEach(function(it){((it.ch!=null&&gmap[it.ch])||none).all.push(it);});
    pool.forEach(function(it){((it.ch!=null&&gmap[it.ch])||none).items.push(it);});
    groups.concat([none]).forEach(function(g){
      if(!g.items.length)return;
      out.push(h('li',{class:'dt-ch','data-key':g.key},h('span',{class:'dt-ch-name'},g.label),h('span',{class:'dt-ch-meta'},meta(g.all))));
      g.items.forEach(function(it){out.push(dtRow(it,t));});
    });
  }
  if(!hasSubs(sid)){chapterPart(secs[0].chs,shown,all,'ch');return out;}
  var known={};secs.forEach(function(sec){known[sec.name]=1;});
  function subOf(it){return it.sub&&known[it.sub]?it.sub:null;}
  secs.concat([{name:null,chs:[]}]).forEach(function(sec,i){
    var pool=shown.filter(function(it){return subOf(it)===sec.name;});
    if(!pool.length)return;
    var poolAll=all.filter(function(it){return subOf(it)===sec.name;});
    out.push(h('li',{class:'dt-sec','data-key':'sec-'+i},h('span',{class:'dt-sec-name'},sec.name||'구분없음'),h('span',{class:'dt-ch-meta'},meta(poolAll))));
    chapterPart(sec.chs,pool,poolAll,'s'+i);
  });
  return out;
}

function projStrip(p,t){
  var f=projFinished(p),end=f&&f<p.to?f:p.to,out=[],g=0;
  for(var d=p.from;d<=end&&g++<400;d=addDays(d,1)){if(projOnDay(p,d))out.push(h('i',{class:projDayRes(p,d,t,state.dayLog)}));}

function projPanel(t){

  var rank={on:0,soon:1,done:2,ended:2};
  info.sort(function(a,b){
    if(rank[a.st]!==rank[b.st])return rank[a.st]-rank[b.st];
    if(rank[a.st]<2)return a.p.to<b.p.to?-1:a.p.to>b.p.to?1:0;
    var ea=a.f||a.p.to,eb=b.f||b.p.to;return ea<eb?1:ea>eb?-1:0;
  });
  var doneN=info.filter(function(x){return x.st==='done';}).length;
  var rows=info.map(function(x,k){
    var p=x.p,tag=x.st==='done'?'완료':x.st==='ended'?'끝':x.st==='soon'?fmtMD(p.from)+' 시작':(diffDays(p.to,t)?'D-'+diffDays(p.to,t):'마지막 날');

      projStrip(p,t),

/* ---------- 칸 옮기기: 꾹 누르면(0.45초) 칸이 들리고, 끌어다 놓으면 그 자리로 ----------

function rdPress(grid,target,x,y){

/* 페이지 칸: 저장된 순서대로 놓기. 저장에 없는 칸(새로 생긴 칸)은 기본 순서에서 바로 앞 칸 뒤에 */

  grid._def=def;
  var ord=state.layout&&state.layout[key];

    var pos={},base=LAYOUT_DEF[key]||def;
    ord.forEach(function(k,i){if(!(k in pos))pos[k]=i;});
    var eff=kids.map(function(el,i){

/* 끌어서 바꾼 순서 저장: 지금 안 보이는 칸(조건부로 숨은 칸)은 예전 자리 그대로 두고 보이는 칸끼리만 새 순서로 */

/* 끌고 있는 손가락이 화면 위아래 끝에 가면 천천히 스크롤 */

/* 과목 삭제: 그 과목의 박스·모의고사·반복퀘스트·목차·회독표도 함께 */

/* 옮긴 과목 하나만 새 이웃 옆으로. 다른 과목끼리의 순서는 그대로 */
function moveSubject(sid,afterSid,beforeSid){
  var list=state.subjects.slice(),i=-1,k;
  for(k=0;k<list.length;k++){if(list[k].id===sid)i=k;}
  if(i<0)return false;
  var s=list.splice(i,1)[0],j=-1;
  if(afterSid){for(k=0;k<list.length;k++){if(list[k].id===afterSid)j=k+1;}}

}

/* ---------- 공부 타이머 (왼쪽 틀) ----------

   멈추면 새벽 4시 경계로 잘라 날짜·과목별로 쌓음. 6시간 넘게 켜져 있으면 다음에 열 때 확인 */

/* 공부 기록 더하기·빼기: 날짜별 합계와 시간대 기록을 같이 고침 (30초 미만 조각은 합계에만) */

/* 과목 줄은 과목 목록(순서·이름)이 바뀔 때만 다시 만들고, 나머지는 글자·위치만 고침 */
function drawTrail(){

/* 네모 테두리가 1분에 한 바퀴. 다시 그릴 때마다 측정 시작 시각에 맞춰 위치를 바로잡음 */
var ringAnim=null;
function syncRing(on){
  var r=document.querySelector('#tr-go .tr-ring rect');if(!r)return;
  if(!on){if(ringAnim){ringAnim.cancel();ringAnim=null;}return;}
  if(!ringAnim){if(!r.animate)return;ringAnim=r.animate([{strokeDashoffset:100},{strokeDashoffset:0}],{duration:60000,iterations:Infinity});}
  ringAnim.currentTime=Math.max(0,Date.now()-state.timer.start)%60000;
}
function tickTrail(){
  var el=document.getElementById('trail');if(!el||!state)return;
  var t=realToday(),on=timerOn(),max=60,tot=studyOn(t),lv=Math.min(1,tot/goalSecs()),cl=on?0:closedAt(t);

    el.setAttribute('data-race',lead);

  el.querySelector('#tr-goal').textContent='목표 '+Math.floor(lv*100)+'%';
  var sess=el.querySelector('#tr-sess'),pick=el.querySelector('#tr-pick');

    pick.textContent=subjName(state.timer.sid)+' · '+clk;
  }else if(cl){
    setKids(sess,[h('span',{class:'tr-cl'},'마감'),h('b',{class:'tr-clt'},hhmm(cl))]);
    pick.textContent='마감 '+hhmm(cl);
  }else{
    var nx=trailNext(),rs=liveRest();if(rs<60000)rs=0;
    setKids(sess,[rs?h('span',{class:'tr-rest'},'휴식'):null,rs?h('b',{class:'tr-rt'},fmtRest(rs)):null,h('span',{class:'tr-next'},nx?subjShort(subjName(nx)):'')]);

    b.setAttribute('aria-label',subjName(id)+' 오늘 '+fmtDur(v)+(b.classList.contains('on')?', 측정 중, 누르면 멈춤':', 누르면 측정 시작'));

/* ---------- 하루 마감 · 휴식 ----------
   마감은 레일의 버튼을 눌러야만 됨(저절로 마감되는 일 없음). 누른 시각을 날짜별로 쌓아 둠.
   마감한 뒤 타이머를 다시 켜면 그날은 다시 열림(마감 시각은 남아서 그 사이는 휴식으로 안 셈).
   휴식 = 공부 사이 빈 시간. 4시간 넘게 비었거나 사이에 마감이 있으면 휴식이 아님 */
function closesOf(d){return (state.closed&&state.closed[d])||[];}
/* 새벽 4시가 지나 하루가 끝났는데 마감을 안 눌렀으면 그날 마지막 공부가 끝난 시각으로 마감(최근 7일) */
var acDay=null;
function autoCloseCheck(){var t=realToday();if(acDay===t||!state)return;acDay=t;if(autoClose(t)==='wait')acDay=null;}
function autoClose(t){
  var ch=false,wait=false;
  for(var i=1;i<=7;i++){
    var d=addDays(t,-i);
    if(timerOn()&&splitKey(state.timer.start)===d){wait=true;continue;}  /* 밤새 켜 둔 타이머: 멈춘 뒤 다음 확인 때 마감 */
    var segs=sessOnDay(state.sessions,d,DAY_START_H,0);if(!segs.length||closedAt(d))continue;
    var end=0;segs.forEach(function(g){if(g.e>end)end=g.e;});
    if(!state.closed)state.closed={};
    state.closed[d]=closesOf(d).concat([end]).slice(-6);ch=true;
  }
  if(ch)saveNow();
  return wait?'wait':ch;
}
function closedAt(d){
  var a=closesOf(d);if(!a.length)return 0;
  var c=a[a.length-1];
  if(timerOn()&&state.timer.start>c&&splitKey(state.timer.start)===d)return 0;
  for(var i=state.sessions.length-1;i>=0;i--){var x=state.sessions[i];if(x.s<=c)break;if(splitKey(x.s)===d)return 0;}
  return c;
}
/* 그날 공부한 시간대(재는 중인 것까지) */
function daySegs(d){
  var segs=sessOnDay(state.sessions,d,DAY_START_H,0);
  if(timerOn()){var w=dayWindow(d,DAY_START_H,0),s0=Math.max(state.timer.start,w[0]),e0=Math.min(Date.now(),w[1]);if(e0>s0)segs.push({x:null,sid:state.timer.sid,s:s0,e:e0,live:true});}
  return segs;
}
function restOn(d){return restOf(daySegs(d),closesOf(d));}
/* 지금 쉬는 중인 시간(ms): 오늘 마지막 공부가 끝난 뒤 4시간 안이고, 그 뒤에 마감을 안 눌렀을 때만 */
function liveRest(){
  if(timerOn()||!state.sessions.length)return 0;
  var t=realToday(),w=dayWindow(t,DAY_START_H,0),ss=state.sessions,last=0;
  for(var i=ss.length-1;i>=0&&i>=ss.length-40;i--){if(ss[i].e>last)last=ss[i].e;}
  var g=Date.now()-last;
  if(last<w[0]||g<=0||g>=REST_MAX)return 0;
  if(closesOf(t).some(function(c){return c>=last;}))return 0;
  return g;
}
function fmtRest(ms){var m=Math.floor(ms/60000);return m<60?m+'분':Math.floor(m/60)+':'+pad2(m%60);}
function updateCloseBtn(){

function clTile(k,v,sub){return h('div',{class:'cl-t'},h('span',{class:'k'},k),h('b',null,v),sub?h('small',null,sub):null);}
/* 마감 창: 오늘 공부·휴식·퀘스트를 한 장으로, 아직 남은 것, [마감하기]. 이미 마감했으면 [마감 풀기] */

    left.length?h('div',{class:'cl-left'},h('p',{class:'cl-lt'},'아직 남은 것'),rows,h('p',{class:'cl-note'},'그대로 마감하면 못 한 걸로 남아요.')):null,
    on?h('p',{class:'cl-note'},subjName(state.timer.sid)+' 측정도 멈춰요.'):null,go]});

/* ---------- 검색: 박스(제목·메모·단원·과목)와 모의고사 오답. 띄어쓰기 상관없이, 여러 낱말은 모두 들어간 것만 ---------- */
var srchQ='';
function normQ(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,'');}
function hitAll(hay,toks){for(var i=0;i<toks.length;i++){if(hay.indexOf(toks[i])<0)return false;}return true;}
function searchAll(q){
  var toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length)return null;
  var full=toks.join(''),items=[],wrongs=[];
  state.items.forEach(function(it){
    var sj=subjectById(it.subject);if(!sj)return;
    var tt=normQ(it.title),hay=tt+'|'+normQ(noteText(it))+'|'+normQ(partFull(it.subject,it.sub,it.ch))+'|'+normQ(sj.name)+'|'+normQ(subjShortOf(sj));
    if(!hitAll(hay,toks))return;
    items.push({it:it,sc:tt.indexOf(full)===0?4:tt.indexOf(full)>=0?3:hitAll(tt,toks)?2:1});
  });
  items.sort(function(a,b){return b.sc-a.sc||(a.it.createdAt<b.it.createdAt?1:a.it.createdAt>b.it.createdAt?-1:0);});
  allWrongs().forEach(function(x){
    var sid=studySid(x.ser.subject),tt=normQ(wrongTitle(sid,x.w));
    var hay=tt+'|'+normQ(x.w.memo)+'|'+normQ(wrongLabel(sid,x.w))+'|'+normQ(reasonName(x.w.reason))+'|'+normQ(x.ser.name)+'|'+normQ(mockSubjName(x.ser.subject));
    if(!hitAll(hay,toks))return;
    wrongs.push({x:x,sc:tt.indexOf(full)>=0?3:hitAll(tt,toks)?2:1});
  });
  wrongs.sort(function(a,b){return b.sc-a.sc;});
  var cards=[];
  (state.cards||[]).forEach(function(c){
    var sj=subjectById(c.sid),tt=normQ(c.title)+'|'+normQ(c.cue);
    if(!hitAll(tt+'|'+normQ(c.body)+'|'+normQ(sj?sj.name:''),toks))return;
    cards.push({c:c,sc:hitAll(tt,toks)?2:1});
  });
  cards.sort(function(a,b){return b.sc-a.sc;});
  return {toks:toks,items:items,wrongs:wrongs,cards:cards};
}
/* 찾은 낱말을 칠함(띄어쓰기 건너뛰고 맞춤) */
function markText(text,toks){
  text=String(text==null?'':text);
  var map=[],norm='',on=[],i;
  for(i=0;i<text.length;i++){var ch=text.charAt(i),lo=ch.toLowerCase();if(lo.length!==1)lo=ch;if(!/\s/.test(ch)){map.push(i);norm+=lo;}}
  toks.forEach(function(k){var p=0,j;while((j=norm.indexOf(k,p))>=0){for(var x=j;x<j+k.length;x++)on[map[x]]=1;p=j+k.length;}});
  var out=[],cur='',st=false;
  for(i=0;i<text.length;i++){var o=!!on[i];if(o!==st&&cur){out.push(st?h('mark',null,cur):cur);cur='';}st=o;cur+=text.charAt(i);}
  if(cur)out.push(st?h('mark',null,cur):cur);
  return out;
}
/* 메모에서 찾은 곳 앞뒤만 잘라 보여 줌 */
function snippet(text,toks){
  text=String(text||'').replace(/\s+/g,' ').trim();
  var map=[],norm='',i,best=-1;
  for(i=0;i<text.length;i++){var ch=text.charAt(i),lo=ch.toLowerCase();if(lo.length!==1)lo=ch;if(ch!==' '){map.push(i);norm+=lo;}}
  toks.forEach(function(k){var j=norm.indexOf(k);if(j>=0&&(best<0||j<best))best=j;});
  if(best<0)return '';
  var at=map[best],a=Math.max(0,at-14),b=Math.min(text.length,at+46);
  return (a>0?'…':'')+text.slice(a,b)+(b<text.length?'…':'');
}

회사에 적용"]]},{id:'law-1111b',subj:'상법',cards:[["소상인의 범위", "지상등장", "- 자본금 1천만원 미만 + 회사가 아닌 자\n    - 지배인, 상호, 상업등기, 상업장부 규정 적용하지 않음\n        - 다만 행위의무가 아니므로 굳이 해도 상관은 없다.\n    - 단순히 ‘소상인은 자본금 1천만원 미만인 자‘라고 제시된 경우 회사가 아닌 자를 포함하지 않으므로 틀린 문장이다."], ["쌍방적 상행위여야만 상법이 적용되는 경우", "쌍대일유 공경 검보확", "- 대리상 특별상사유치권\n- 일반상사유치권\n- 매도인 목적물 공탁 • 경매권\n    - 단, 위탁매매인의 매수물에 대한 공탁•경매권은 위탁자가 비상인이라도 적용가능\n- 매수인 목적물 검사 • 하자 통지 의무\n- 계약 해지시 매수인 목적물 보관 • 공탁의무\n- 확정기 매매의 해제"], ["상업사용인의 경업금지의무", "2주 1년 · 사무이", "- 거래금지의무 → 2주, 1년\n    - 영업주의 영업부류에 속한 거래 불가\n    - 위반한 거래의 효력은 상대방의 선의 및 악의를 불문하고 유효하나 영업주는 개입권 행사 가능\n        - 개입권\n            - 그 거래를 안 날로부터 2주 내 행사 가능\n                - 이사의 개입권에는 이 규정이 없음\n            - 그 거래가 있은 날로부터 1년 내 행사 가능\n        - 개입권 행사와 별개로 손해배상청구가능\n- 겸직제한의무 → 사무이\n    - 상업사용인은 다른회사의 사용인, 무한책임사원, 이사 가되지 못함.\n        - (비교 : 이사의 겸직제한의무 → 다른회사의 무한책임사원, 이사 )\n    - 동종이 아니더라도 적용함.\n    - 참고로 같은 회사에서는 감사의 겸직이 불가하다. 다만 업무집행사원과 (상무)이사는 겸직이 가능하다."], ["상업사용인의 종임", "사성파", "- 당연종임사유 : 사성파\n    - 지배인(본인)의 사망, 성년후견인의 개시, 파산\n    → 영업주의 사망은 지배인의 당연종임사유에 해당하지 않는다.\n- 영업의 종료\n    - 영업의 폐지, 영업주의 파산, 회사의 해산\n- 기타 종임사유\n    - 지배인의 사임의사표시, 임기만료, 영업주의 해임\n    → 회사의 경우 지배인의 해임에도 선임과 같은 의사결정 절차를 거쳐야 한다."], ["상호전용권 행사가 가능한 경우", "상호등기인 · 부오손", "→ 해당 시 상호의 폐지청구, 손해배상청구, 등기말소청구 가능\n→ 해당 시 상호의 폐지청구 가능, 손해배상청구 가능, 등기말소청구 가능\n- 상호전용권 행사(상호폐지청구)가 가능한 자\n    - 상호를 등기한 자\n    - 또는 부오손이 있는 자에게 상호전용권을 행사하는 경우\n        - 부정한 목적\n            - 동일한 시군에서 동종영업으로 타인이 등기한 상호를 사용하는 자는 부정한 목적으로 사용하는 것으로 추정한다\n            - (↔)인접한 지역은 상관없다.\n                - “인접” → 표현은 주주총회 장소 설정시 본점과 인접 규정과, 영업양도시 경업금지의무 규정에서만 나온다. → 주총장소는 외웠으니 헷갈리는건 인접양도로 외우기\n        - 타인의 영업으로 오인할 수 있는 상호\n            - 오인가능성은 동종영업에 한정되지 않고 종합적으로 판단한다.\n            - 동일한 상호가 아니라 하더라도 영업의 종류,규모,지역성 등을 고려하여 타인의 영업으로 오인할 수 있는 상호가 될 수 있다.\n        - 손해를 받을 염려"], ["상호속용 관련 책임", "등통광통", "- 원칙적으로 상호속용 시 영업양도인이 기존에 보유하던 채무에는 양수인도 변제할 책임이 존재한다. → 외관상 같으므로 연대책임\n- 예외 : 등통광통\n    - 상호속용시 책임 안지려면 → 등기 또는 통지\n        - 양수인이 지체없이 등기\n        양도인과 양수인이 함께 지체없이 통 ], ["중개업자", "견교한 통일을 말없이 이행 · 보급", "- 의무\n    - 견품보관의무\n    - 결약서 교부의무\n        - 계약이 성립된 때 지체없이 결약서 교부의무\n    - 통지의무 (결약서 교부와 관련한)\n        - 일방이 결약서 수령을 거부하거나 기명날인 또는 서명하지 아니한 경우 상대방에게 그 통지 의무\n    - 일기장(중개장부) 작성 및 등본교부의무\n        - 당사자는 언제든지 중개업자에게 장부의 등본의 교부 청구 가능\n    - 묵비의무\n        - 북한이 전투기를 록하트마틴으로부터 구입시 대리상에게 나 북한인거 비밀로 해달라고 할 수 있음\n    - 이행담보책임 (묵비의무 하)\n        - 묵비의무로 인해 북한이 누군지 록하트마틴에게 공개하지 않았을때, 북한이 돈을 내지 않는다면 중개인이 이행해야 함. →중개인의 개입 의무\n        - 개입의무를 이행한다 하여도 전투기는 여전히 북한꺼임\n        - 구상권 청구해서 돈 돌려받아야 함\n- 권리\n    - 보수청구권\n        - 결약서 교부의무절차 종료 시 활성화\n        - 계약이행 및 중개장부 작성 여부와 무관하게 교부의무만 마치면 활성화됨\n    - 급여수령대리권\n        - 약정이나 관습이 있는 경우에만 당사자를 위하여 대리수령 가능"], ["수하인", "돈줄게 내놔", "- 의무\n    - 운임지급의무\n- 권리\n    - 운송물인도청구권"], ["운송주선인", "하자거지계", "- 거지계이에서 이(이행담보책임)만 빠짐\n- 의무 (이행담보책임 제외 위탁매매인과 동일)\n    - 하자통지의무\n    - 지정가액준수의무\n    - 거래통지의무\n    - 계산서제출의무\n- 권리\n    - 보수청구권\n        - 시효 1년\n    - 특별상사유치권\n    - 개입권\n        - 다른 약정이 없으면 직접 운송 가능 (위탁매매인과 달리 ‘시세가 있는 경우’ 조건 X)\n        - 위탁자가 청구하여 화물상환증을 작성한 경우 직접 운송하는 것으로 간주한다\n            - 화물상환증은 원래 운송인이 발행하는 증권이므로 운송주선인이 화물상환증을 발행하였다는 것은 운송인이 되기로 결정한 것이다. 반면에, 운송업에서 운송인이 송하인의 요구에 따라 화물상환증을 발행한 경우에는 운송인과 송하인 사이에 화물상환증에 적힌 대로 운송계약이 체결되고 운송물을 수령한 것으로 추정한다."], ["상법 총칙·상행위법 추정규정", "공리영상부 추정", "- 공권의 추정\n- 리스수령증의 추정\n- 영업을 위하여 추정\n- 상호사용의 부정한 목적 추정\n    - →동동등"]]},{id:'law-1111c',subj:'상법',cards:[["공인회계사의 의무", "성공비전 손공장", "- 성실\n- 공정\n- 비밀엄수(유지)\n- 전문가적 적격성과 정당한 주의 • 전문가적 품위\n- 손해배상책임 보장조치\n- 공인회계사회 회칙 준수\n- 장부 작성 • 비치"], ["공인회계사의 금지사항", "계부 2명 금지", "- 계쟁권리의 양수\n- 부정청탁의 수수\n- 2개 이상의 사무소 개설\n    - 회계법인의 경우 주사무소 외의 1개 이상의 분사무소를 둘 수 있으며, 각 분사무소에는 3인 이상의 공인회계사가 상근하여야 한다.\n- 명의대여"], ["개업공인회계사 직무제한 (공§21)", "사보택 · 무약회 퇴비삼 집신담보", "- 본인\n    - 1년이내 임원, 직원\n    - 본인과 채권 채무 있는 곳 (배우자는 제외) →사보택\n        - 무상으로 또는 저가로 사무소나 영업용 차량을 제공하고 있는 곳\n        - CPA 업무 외의 업무로 계속적 보수를 지급하고 있는 곳\n        - 자기회사의 주식 CB BW 주식선택권을 제공하였거나 제공하기로 한 곳\n- 배우자\n    - 1년이내 임원, 재무 직원 이었던 곳\n- 본인 + 배우자\n    - 출자지분을 보유한 곳 (1주라도)\n    - 감사기간 중 합병 function seedPacks(){
  var done=(state.packs||[]).slice(),ch=false;
  CARD_PACKS.forEach(function(p){
    if(done.indexOf(p.id)>=0)return;
    var sj=state.subjects.filter(function(x){return x.name===p.subj;})[0];
    if(!sj)return;
    if(!state.cards)state.cards=[];
    var key=function(t){return String(t||'').replace(/\s+/g,'');},have={},d=realToday();
    state.cards.forEach(function(c){if(c.sid===sj.id)have[key(c.title)]=1;});
    p.cards.forEach(function(c){if(have[key(c[0])])return;have[key(c[0])]=1;state.cards.push({id:uid(),sid:sj.id,title:c[0],cue:c[1],body:c[2],d:d});});
    done.push(p.id);ch=true;
  });
  if(ch)state.packs=done;
  return ch;
}

/* 비슷한 카드 찾기(퀘스트 추가 때 쓰는 것과 같은 방식). 같은 과목이면 조금 더 위로 */
function similarCards(text,sid,k,skip,lim){
  var q=normT(text),out=[];if(q.length<4)return out;
  (state.cards||[]).forEach(function(c){
    if(c.id===skip||cardK(c)!==k)return;
    var sc=simScore(q,normT(c.title||c.cue));if(sc)out.push({c:c,raw:sc,sc:sc+(c.sid===sid?.2:0)});

  return out.slice(0,lim||4);
}

/* 고른 글자를 ==…== 로 감싸거나(파랑) 이미 감싸져 있으면 풀기. 여러 줄을 고르면 줄마다 따로 */
function toggleBlue(ta){
  var v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;
  while(s<e&&/\s/.test(v[s]))s++;
  while(e>s&&/\s/.test(v[e-1]))e--;
  if(s>=2&&v.slice(s-2,s)==='=='&&v.slice(e,e+2)==='=='){ta.value=v.slice(0,s-2)+v.slice(s,e)+v.slice(e+2);ta.setSelectionRange(s-2,e-2);}
  else if(e-s>=4&&v.slice(s,s+2)==='=='&&v.slice(e-2,e)==='=='&&v.slice(s+2,e-2).indexOf('==')<0){ta.value=v.slice(0,s)+v.slice(s+2,e-2)+v.slice(e);ta.setSelectionRange(s,e-4);}
  else if(s===e){ta.value=v.slice(0,s)+'===='+v.slice(s);ta.setSelectionRange(s+2,s+2);}
  else{
    var seg=v.slice(s,e).split('\n').map(function(l){var m=l.match(/^(\s*(?:[-•·*]\s+)?)(.*?)(\s*)$/);return m[2]?m[1]+'=='+m[2].replace(/==/g,'')+'=='+m[3]:l;}).join('\n');
    ta.value=v.slice(0,s)+seg+v.slice(e);ta.setSelectionRange(s,s+seg.length);
  }
  ta.focus();
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}

function cxFlip(){

/* 끌기: 가로로 10px 넘게 움직이면 카드가 손가락을 따라옴. 110px 넘게 밀거나 빠르게 튕기면 넘김, 아니면 제자리 */
function cxDrag(C){
  var el=C.el,x0=0,y0=0,t0=0,dx=0,down=false,drag=false,moved=false,pid=null;
  function tf(x){return 'translateX('+x+'px) rotate('+(x/22).toFixed(2)+'deg)';}
  el.addEventListener('pointerdown',function(e){
    if(C.anim||C.gone||CX.busy||(e.button&&e.button>0))return;
    down=true;drag=false;moved=false;x0=e.clientX;y0=e.clientY;t0=performance.now();dx=0;pid=e.pointerId;
  });
  el.addEventListener('pointermove',function(e){
    if(!down||e.pointerId!==pid)return;
    var mx=e.clientX-x0,my=e.clientY-y0;
    if(!drag){
      if(Math.abs(mx)>8||Math.abs(my)>8)moved=true;
      if(!(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.2))return;
      drag=true;el.classList.add('drag');try{el.setPointerCapture(pid);}catch(_){}
    }
    dx=mx;el.style.transform=tf(dx);
    var p=Math.min(1,Math.abs(dx)/110);

  });
  function up(e,cancel){
    if(!down||e.pointerId!==pid)return;
    down=false;
    if(!drag){if(!cancel&&!moved)cxFlip();return;}
    drag=false;el.classList.remove('drag');
    var v=dx/Math.max(1,performance.now()-t0);
    if(!cancel&&(Math.abs(dx)>110||(Math.abs(dx)>40&&Math.abs(v)>.55))){cxSwipe(dx>0,dx);return;}
    el.style.transform='';
    anim(el,[{transform:tf(dx)},{transform:'none'}],{duration:440,easing:SPRING});
    [C.stOk,C.stNo].forEach(function(st){var o=+st.style.opacity||0;st.style.opacity='';if(o)anim(st,[{opacity:o},{opacity:0}],{duration:200});});
  }

/* ---------- 공부 기록: 합계, 최근 14일, 공부 잔디(11~2월), 그날의 시간대, 과목별 ---------- */
function durEl(sec){
  sec=Math.max(0,Math.round(sec));var hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60);
  if(hh>=100)return [String(hh),h('small',null,'시간')];
  if(hh)return [String(hh),h('small',null,'시간'),' '+mm,h('small',null,'분')];
  return [String(mm),h('small',null,'분')];
}
function hhmm(ms){var d=new Date(ms);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
/* 연속 공부: 30분 넘게 한 날이 끊기지 않고 이어진 날 수 (오늘 아직 30분 전이면 어제까지) */
function studyStreak(t){
  var n=0,d=t;
  if(studyOn(d)<1800)d=addDays(d,-1);
  for(var k=0;k<500;k++){if(studyOn(d)>=1800){n++;d=addDays(d,-1);}else break;}
  return n;
}
function studyTotal(){var n=0;for(var d in state.study)n+=sumDay(state.study[d]);if(timerOn())n+=(Date.now()-state.timer.start)/1000;return n;}
/* 잔디 칸 색: 0 · 2시간 · 4시간 · 6시간 · 8시간 넘음 */
function studyLevel(v){return v<60?0:v<7200?1:v<14400?2:v<21600?3:v<28800?4:5;}

    kpi('이번 달',durEl(month),h('span',{class:'k2'},(+t.slice(5,7))+'월')),
    kpi('하루 평균',durEl(s7/7),h('span',{class:'k2'},'지난 7일')),
    kpi('연속 공부',studyStreak(t)+'일',h('span',{class:'k2'},'30분 넘긴 날')),

  root.appendChild(unit(panelSec('half','공부 시작 · 끝',null,'3주',studyRangeBox(t)),'range'));
  root.appendChild(unit(panelSec('half','공부 · 휴식',null,'7일',studyRestBox(t)),'rest'));

/* 최근 14일 막대: 고른 날과 오늘만 값을 적고, 점선은 지난 7일 하루 평균 */
function studyCols(t,pick){
  var days=[],max=0,i;
  for(i=13;i>=0;i--){var d=addDays(t,-i),v=studyOn(d);days.push({d:d,v:v});if(v>max)max=v;}
  var top=Math.max(3600,Math.ceil(max/3600)*3600),s7=0;

  for(var g=1;g<=2;g++)bars.appendChild(h('i',{class:'sv-grid',style:'bottom:'+(g*50)+'%'}));
  if(avg>=60)bars.appendChild(h('i',{class:'sv-avg',style:'bottom:'+(avg/top*100).toFixed(2)+'%'},h('span',null,'평균 '+fmtHM(avg))));
  var seen={};

    state.subjects.forEach(function(s){var v=studyOn(x.d,s.id);if(v<60)return;seen[s.id]=1;stack.appendChild(h('i',{style:'flex:'+v.toFixed(0)+';background:'+scol(s.name)}));});

      stack,

  var yl=h('div',{class:'sv-y','aria-hidden':'true'},[1,2].map(function(g){return h('span',{style:'bottom:'+(g*50)+'%'},fmtNum(top*g/2/3600)+'시간');}));
  return h('div',{class:'sv-chart'},h('div',{class:'sv-plot'},bars,yl),dates);

/* 공부 잔디: 한 칸이 하루, 세로 한 줄이 한 주(월~일). 진할수록 오래 함 */
function studyGrass(t,pick){
  var weeks=[];
  for(var ws=weekStart(CAL_START);ws<=CAL_END;ws=addDays(ws,7))weeks.push(ws);
  var months=h('div',{class:'sg-m','aria-hidden':'true',style:'--wk:'+weeks.length},weeks.map(function(ws){
    var lab='';for(var k=0;k<7;k++){var d=addDays(ws,k);if(d.slice(8)==='01'&&d>=CAL_START&&d<=CAL_END)lab=(+d.slice(5,7))+'월';}
    return h('span',null,lab);
  }));
  var grid=h('div',{class:'sg',style:'--wk:'+weeks.length});
  weeks.forEach(function(ws){
    var col=h('div',{class:'sg-col'});
    for(var k=0;k<7;k++){
      var d=addDays(ws,k);
      if(d<CAL_START||d>CAL_END){col.appendChild(h('i',{class:'sg-c out'}));continue;}
      if(d>t){col.appendChild(h('i',{class:'sg-c fut'}));continue;}
      var v=studyOn(d);
      var c=h('button',{class:'sg-c'+(d===t?' today':'')+(d===ui.studySel?' sel':''),type:'button','data-d':d,'data-l':String(studyLevel(v)),'aria-label':fmtKMD(d)+' '+fmtDur(v)});

  var leg=h('div',{class:'sg-leg','aria-hidden':'true'},h('span',null,'0'),[0,1,2,3,4,5].map(function(l){return h('i',{'data-l':String(l)});}),h('span',null,'8시간+'));
  return h('div',{class:'sg-box'},h('div',{class:'sg-wrap'},h('span'),months,wd,grid),leg);
}
/* 그날: 새벽 4시 ~ 다음 날 4시 띠에 공부한 시간대, 아래에 기록 목록(지우기), 직접 넣기 */
function studyDayKids(d,t){

  rest.gaps.forEach(function(g){restAt[g.e]=g;});

  var span=w[1]-w[0],bar=h('div',{class:'tl-bar',role:'img','aria-label':segs.length?segs.map(function(g){return hhmm(g.s)+'부터 '+hhmm(g.e)+'까지 '+subjName(g.sid);}).join(', '):'시간대 기록 없음'});
  for(var k=1;k<6;k++)bar.appendChild(h('i',{class:'tl-tick',style:'left:'+(k*4/24*100).toFixed(3)+'%'}));
  rest.gaps.forEach(function(g){bar.appendChild(h('i',{class:'tl-rest',style:'left:'+((g.s-w[0])/span*100).toFixed(3)+'%;width:'+((g.e-g.s)/span*100).toFixed(3)+'%'}));});
  segs.forEach(function(g){
    var l=(g.s-w[0])/span*100,wd=(g.e-g.s)/span*100;
    var nm=subjName(g.sid);
    bar.appendChild(h('span',{class:'tl-seg'+(g.live?' live':''),style:'left:'+l.toFixed(3)+'%;width:'+Math.max(wd,.4).toFixed(3)+'%;background:'+scol(nm)+';color:'+scolInk(nm)},wd>=7?subjShort(nm):''));
  });
  var xl=h('div',{class:'tl-x','aria-hidden':'true'},[0,4,8,12,16,20,24].map(function(hh){return h('span',{style:'left:'+(hh/24*100).toFixed(3)+'%'},String((hh+DAY_START_H)%24));}));
  body.appendChild(h('div',{class:'tl'},bar,xl));
  var subs=state.subjects.map(function(s){return {n:s.name,v:studyOn(d,s.id)};}).filter(function(x){return x.v>=60;}).sort(function(a,b){return b.v-a.v;});
  if(subs.length||rest.sec>=60)body.appendChild(h('div',{class:'sv-chips'},subs.map(function(x){return h('span',null,sdot(x.n),x.n,h('b',null,fmtHM(x.v)));}),rest.sec>=60?h('span',{class:'rest-chip'},h('i'),'휴식',h('b',null,fmtHM(rest.sec))):null));
  var list=h('div',{class:'ss-list'});
  segs.forEach(function(g){
    var gp=restAt[g.s];if(gp){delete restAt[g.s];list.appendChild(h('div',{class:'ss-rest'},h('i'),'휴식 '+fmtDur((gp.e-gp.s)/1000)));}
    var row=h('div',{class:'ss-row'+(g.live?' live':'')},
      h('span',{class:'ss-time'},hhmm(g.s)+' – '+(g.live?'지금':hhmm(g.e))),
      h('span',{class:'ss-sub'},sdot(subjName(g.sid)),subjName(g.sid),g.x&&g.x.m?h('small',null,'직접'):null),
      h('span',{class:'ss-dur'},fmtDur((g.e-g.s)/1000)));
    if(g.live)row.appendChild(h('span',{class:'ss-live'},'재는 중'));
    else row.appendChild(confirmBtn('ss-'+g.x.s,'지우기','한 번 더',function(){removeStudy(g.x);saveNow();renderView();drawTrail();toast('그 기록을 지웠어요');},'ss-del'));
    list.appendChild(row);
  });
  if(!segs.length)list.appendChild(h('p',{class:'ss-none'},tot>=60?'이날은 시간대 없이 합계만 남아 있어요.':(d===t?'아직 오늘 기록이 없어요':'이날은 기록이 없어요.')));
  var cl0=closedAt(d),lr=d===realToday()?liveRest():0;if(lr<60000)lr=0;
  if(cl0)list.appendChild(h('div',{class:'ss-rest cl'},iconEl('moon'),hhmm(cl0)+' 마감'));
  else if(lr)list.appendChild(h('div',{class:'ss-rest now'},h('i'),'쉬는 중 · '+fmtRest(lr)));
  body.appendChild(list);
  var sum=0;segs.forEach(function(g){sum+=(g.e-g.s)/1000;});
  if(segs.length&&tot-sum>=60)body.appendChild(h('p',{class:'ss-note'},'시간대 없이 합계로만 남은 시간 '+fmtDur(tot-sum)));
  var addB=h('button',{class:'ss-add',type:'button'},'+ 이날 기록 직접 넣기');
  addB.addEventListener('click',function(){openStudyAdd(d);});
  body.appendChild(addB);
  return [head,body];
}
/* 과목별: 7일 · 30일 · 전체 */
function studySubjKids(t,redraw){

  if(n){for(d=addDays(t,-(n-1));d<=t;d=addDays(d,1))days.push(d);}
  else{days=Object.keys(state.study).filter(function(x){return x<=t;});if(days.indexOf(t)<0)days.push(t);}

  var seg=h('div',{class:'seg2',role:'group','aria-label':'기간'},[['7','7일'],['30','30일'],['all','전체']].map(function(o){
    var b=h('button',{type:'button','aria-pressed':String(R===o[0])},o[1]);
    b.addEventListener('click',function(){if(ui.studyRange===o[0])return;ui.studyRange=o[0];redraw();});
    return b;
  }));
  var mx=list.length?list[0].v:1;

  })):h('p',{class:'ss-none'},'이 기간에는 기록이 없어요.');

/* ---------- 공부 기록 분석 (열품타식) ---------- */
/* 오늘 재는 중인 것까지 넣은 시간대 기록 */
function liveSessions(){
  var list=state.sessions.slice();
  if(timerOn()&&Date.now()-state.timer.start>=30000)list.push({sid:state.timer.sid,s:state.timer.start,e:Date.now(),live:true});
  return list;
}
function fmtSigned(sec){return (sec>=0?'+':'−')+fmtHM(Math.abs(sec));}
/* 이번 주 · 지난주: 월요일부터 쌓인 시간. 회색 계단 = 지난주, 파란 막대 = 이번 주 */
function studyWeekBox(t){
  var ws=weekStart(t),lw=addDays(ws,-7),ti=diffDays(t,ws),prev=[],cur=[],a=0,b=0,i;
  for(i=0;i<7;i++){b+=studyOn(addDays(lw,i));prev.push(b);if(i<=ti){a+=studyOn(addDays(ws,i));cur.push(a);}}
  var diff=a-prev[ti],top=Math.max(3600,prev[6],a)*1.08;
  var plot=h('div',{class:'sx-plot'});
  for(i=0;i<7;i++){
    var col=h('div',{class:'sx-col'},h('i',{class:'sx-prev',style:'height:'+(prev[i]/top*100).toFixed(2)+'%'}));
    if(i<cur.length)col.appendChild(h('i',{class:'sx-cur'+(i===ti?' now':''),style:'height:'+Math.max(cur[i]?1.5:0,cur[i]/top*100).toFixed(2)+'%;animation-delay:'+(i*45)+'ms'}));
    plot.appendChild(col);
  }
  var x=h('div',{class:'sx-x','aria-hidden':'true'},'월화수목금토일'.split('').map(function(c,k){return h('span',{class:k===ti?'today':null},c);}));
  return h('div',{class:'sx'},
    h('div',{class:'sx-top'},h('b',{class:'sx-big '+(diff>=0?'up':'down')},fmtSigned(diff)),h('span',{class:'sx-cap'},'지난주 이맘때보다'),
      h('span',{class:'sx-leg'},h('span',null,h('i',{class:'c'}),'이번 주 '+fmtHM(a)),h('span',null,h('i',{class:'p'}),'지난주 '+fmtHM(prev[6])))),

function sband(ser,v){var c=scfg(ser);return v>=c.goal?'good':v>=c.min?'mid':v>c.fail?'low':'fail';}
function spct(ser,v){var c=scfg(ser);return Math.max(0,Math.min(100,v/c.max*100));}
function mockSubjData(ms){
  var rounds=[],k=0;
  state.mocks.forEach(function(ser){if(ser.subject!==ms.k)return;ser.rounds.forEach(function(r,i){rounds.push({v:r.score,date:r.date,ser:ser,r:r,prev:i>0?ser.rounds[i-1].score:null,_i:k++});});});
  rounds.sort(function(a,b){var da=a.date||'',db=b.date||'';return da<db?-1:da>db?1:a._i-b._i;});
  var sum=0,best=null;rounds.forEach(function(x){sum+=x.v;if(best==null||x.v>best)best=x.v;});
  return {k:ms.k,n:ms.n,rounds:rounds,series:state.mocks.filter(function(ser){return ser.subject===ms.k;}),
    last:rounds.length?rounds[rounds.length-1]:null,avg:rounds.length?Math.round(sum/rounds.length*10)/10:null,best:best};
}
function seriesSlide(ser,x,k){

  var sl=h('button',{class:'mt-slide',type:'button','data-band':band,'aria-label':(ser.name||'모의고사')+(n?', 최근 '+fmtNum(last)+'점 / '+fmtNum(c.max)+', '+n+'회':', 기록 없음')+', 자세히 보기'},
    h('span',{class:'mt-sn'},ser.name||'모의고사'));
  if(last==null){sl.appendChild(h('span',{class:'mt-empty'},iconEl('plus'),h('span',null,'첫 점수 넣기')));}
  else{
    sl.appendChild(h('span',{class:'mt-v'},h('b',null,fmtNum(last)),h('small',null,'/ '+fmtNum(c.max)),band==='fail'?h('span',{class:'mt-tag'},'과락'):null));
    sl.appendChild(h('span',{class:'mt-d'},deltaEl(last,prev)||h('small',null,'첫 회'),h('span',null,n+'회'+(rs[n-1].date?' · '+fmtMD(rs[n-1].date):''))));

    });

    sl.appendChild(cols);

    sl.appendChild(h('span',{class:'mt-foot'},h('span',null,'평균 ',h('b',null,fmtNum(Math.round(sum/n*10)/10))),h('span',null,'최고 ',h('b',null,fmtNum(best))),h('span',null,'목표 ',h('b',null,fmtNum(c.goal)))));
  }

function mockTile(x,k){
  var tile=h('div',{class:'mt','data-k':x.k,'data-sid':subjectById(x.k)?x.k:null,style:'--scol:'+scol(x.n),role:'group','aria-label':x.n+' 모의고사'});
  var dots=h('span',{class:'mt-dots'});
  tile.appendChild(h('div',{class:'mt-top'},h('span',{class:'mt-n'},sdot(x.n),h('span',{class:'full'},x.n),h('span',{class:'short'},subjShort(x.n))),dots));
  var track=h('div',{class:'mt-track'});
  if(!x.series.length){
    var e=h('button',{class:'mt-slide',type:'button'},h('span',{class:'mt-empty'},iconEl('plus'),h('span',null,'첫 모의고사 넣기')));
    e.addEventListener('click',function(){openNewSeriesSheet(x.k);});
    track.appendChild(e);tile.classList.add('none');
  }else x.series.forEach(function(ser){track.appendChild(seriesSlide(ser,x,k));});
  tile.appendChild(track);
  var slides=track.children,n=slides.length;
  if(n>1){
    for(var i=0;i<n;i++)(function(i){
      var d=h('button',{type:'button','aria-label':(i+1)+'번째 모의고사'});
      d.addEventListener('click',function(){track.scrollTo({left:i*track.clientWidth,behavior:motion()?'smooth':'auto'});});
      dots.appendChild(d);
    })(i);
  }
  function mark(){
    var idx=Math.max(0,Math.min(n-1,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));
    ui.mtIdx[x.k]=idx;
    dots.querySelectorAll('button').forEach(function(d,j){d.setAttribute('aria-current',String(j===idx));});
    tile.classList.toggle('low',slides[idx]&&slides[idx].getAttribute('data-band')==='fail');
  }
  track.addEventListener('scroll',function(){requestAnimationFrame(mark);},{passive:true});
  var start=Math.min(n-1,ui.mtIdx[x.k]||0);
  requestAnimationFrame(function(){if(start)track.scrollLeft=start*track.clientWidth;mark();});
  tile.classList.toggle('low',slides[start]&&slides[start].getAttribute('data-band')==='fail');
  return tile;
}

/* 과목마다 만점과 과락 점수를 직접 넣기 (회계학처럼 만점이 다른 과목) */
var CFG_F=[['max','만점'],['goal','목표'],['min','최소'],['fail','과락']];
function cfgInputs(c,label){
  var ins={},row=h('div',{class:'cf-row'});
  CFG_F.forEach(function(f){ins[f[0]]=h('input',{class:'field',type:'text',inputmode:'decimal',value:String(c[f[0]]),'aria-label':(label?label+' ':'')+f[1],autocomplete:'off'});row.appendChild(h('label',null,h('span',null,f[1]),ins[f[0]]));});
  return {el:row,ins:ins,read:function(){
    var v={};
    for(var j=0;j<CFG_F.length;j++){var raw=ins[CFG_F[j][0]].value.trim().replace(',','.'),x=Number(raw);if(raw===''||!isFinite(x)||x<0||x>1000)return {err:CFG_F[j][1]+' 점수를 숫자로 넣어 주세요',el:ins[CFG_F[j][0]]};v[CFG_F[j][0]]=Math.round(x*10)/10;}
    if(v.max<1)return {err:'만점은 1 이상이어야 해요',el:ins.max};
    if(!(v.max>=v.goal&&v.goal>=v.min&&v.min>=v.fail))return {err:'만점 ≥ 목표 ≥ 최소 ≥ 과락 순서로 넣어 주세요',el:ins.goal};
    return {v:v};
  }};
}
function bandLegend(){return h('div',{class:'mc-leg'},BANDS.map(function(b){return h('span',null,h('i',{class:'bd','data-band':b.k}),b.n);}));}
/* 점수 기준 한눈에: 모의고사(종류)마다 만점·목표·최소·과락 */
function openMockCfgSheet(){
  if(activeSheet||busy)return;
  if(!state.mocks.length){toast('먼저 모의고사를 추가해 주세요');return;}
  var rows=[],body=[];
  mockSubjects().forEach(function(ms){
    var list=state.mocks.filter(function(x){return x.subject===ms.k;});if(!list.length)return;
    body.push(h('div',{class:'mc-sub'},sdot(ms.n),ms.n));
    list.forEach(function(ser){var ci=cfgInputs(scfg(ser),ser.name);rows.push({ser:ser,ci:ci});body.push(h('div',{class:'mc-row'},h('span',{class:'mc-n'},ser.name||'모의고사'),ci.el));});
  });
  var mkk={};mockSubjects().forEach(function(ms){mkk[ms.k]=1;});
  var etc=state.mocks.filter(function(x){return !mkk[x.subject];});
  if(etc.length){
    body.push(h('div',{class:'mc-sub'},'기타'));
    etc.forEach(function(ser){var ci=cfgInputs(scfg(ser),ser.name);rows.push({ser:ser,ci:ci});body.push(h('div',{class:'mc-row'},h('span',{class:'mc-n'},ser.name||'모의고사'),ci.el));});
  }
  var err=h('p',{class:'sh-err'});
  var api=openSheet({title:'점수 기준',primary:'저장',body:[body,bandLegend(),err],onPrimary:function(){
    var res=[];
    for(var i=0;i<rows.length;i++){var r=rows[i].ci.read();if(r.err){err.textContent=(rows[i].ser.name||'모의고사')+': '+r.err;r.el.focus();return;}res.push(r.v);}
    rows.forEach(function(x,i){x.ser.cfg=res[i];});
    saveNow();api.close();renderView();toast('점수 기준을 저장했어요');
  }});
}
/* 모의고사 과목 ↔ 공부 과목(이름이 같은 과목). 그 과목의 목차로 틀린 파트를 고름 */
function studySid(k){return subjectById(k)?k:null;}
function wrongLabel(sid,w){
  if(w.sub||w.ch!=null){
    if(sid&&structOf(sid).length)return partFull(sid,w.sub,w.ch);
    return [w.sub||'',w.ch!=null?w.ch+'장':''].join(' ').trim();
  }
  return w.part||'파트 미지정';
}
function reasonName(k){for(var i=0;i<REASONS.length;i++){if(REASONS[i].k===k)return REASONS[i].n;}return '';}
/* ---------- 모의고사 틀린 파트 한 줄 ----------
   접으면 제목(없으면 파트)만. 누르면 파트·이유·메모와 [고치기][일퀘로 복사][삭제].
   고치기에선 파트·이유·제목·메모를 모두 바꿈. 일퀘 복사는 언제든 되고, 복사한 박스를 지웠으면 다시 복사 대상 */
var wrOpen={};
function wrongCopied(w){return w&&w.q?findItem(w.q):null;}
function wrongTitle(sid,w){if(w.note)return w.note;var l=wrongLabel(sid,w);return l!=='파트 미지정'?l:reasonName(w.reason);}
function wrongSrc(ser,r){return (ser.name||'모의고사')+' '+r.n+'회';}
function wrNewest(a,b){
  var da=a.r.date||'',db=b.r.date||'';if(da!==db)return da>db?-1:1;
  if(a._s!==b._s)return (a._s||0)-(b._s||0);
  if(a.r.n!==b.r.n)return b.r.n-a.r.n;
  return (a._i||0)-(b._i||0);
}
function allWrongs(){
  var out=[],k=0;
  state.mocks.forEach(function(ser,si){ser.rounds.forEach(function(r){(r.wrongs||[]).forEach(function(w){out.push({ser:ser,r:r,w:w,_s:si,_i:k++});});});});
  return out.sort(wrNewest);
}
/* 일퀘(오늘 신규 복습 박스)로 복사: 제목은 틀린 파트의 제목(없으면 장 이름 → 적은 파트 → 회차), 메모는 그대로 */
function copyWrong(ser,r,w){
  var sid=studySid(ser.subject);if(!sid)return null;
  var st=!!structOf(sid).length,chn=st&&w.ch!=null?chapterName(chaptersOf(sid,w.sub),w.ch):'';
  var it=blankItem(uid(),sid,String(w.note||chn||w.part||wrongSrc(ser,r)).slice(0,120),w.memo||'',today(),state.intervals);
  if(st){it.sub=w.sub||null;it.ch=w.ch!=null?w.ch:null;}
  it.src={m:ser.id,r:r.id,w:w.id};
  state.items.push(it);w.q=it.id;
  return it;
}
function copyWrongs(list){
  var n=0,miss=0;
  list.forEach(function(x){if(copyWrong(x.ser,x.r,x.w))n++;else miss++;});
  if(n){saveNow();updateBadges();toast(n+'개를 일퀘에 복사했어요'+(miss?' · '+miss+'개는 공부 과목이 없어 못 했어요':''));}
  else if(miss)toast('공부 과목이 없어서 복사할 수 없어요');
  return n;
}
/* 모의고사에서 복사한 박스: 어느 회차의 어느 틀린 파트인지 */
function itemSrc(it){
  if(!it||!it.src)return null;
  var ser=seriesById(it.src.m),r=null,w=null;if(!ser)return null;
  ser.rounds.forEach(function(x){if(x.id===it.src.r)r=x;});if(!r)return null;
  (r.wrongs||[]).forEach(function(x){if(x.id===it.src.w)w=x;});
  return {ser:ser,r:r,w:w};

/* 감쇠 스프링을 프레임으로 뽑아 WAAPI에 넘김: 살짝 넘쳤다가 제자리 */
function springKF(fromPx,toPx,dur,w0,z){
  var n=Math.max(2,Math.round(dur/16.7)),wd=w0*Math.sqrt(1-z*z),out=[];
  for(var i=0;i<=n;i++){
    var s=i/n*dur/1000,e=Math.exp(-z*w0*s);
    var p=i===n?1:1-e*(Math.cos(wd*s)+(z*w0/wd)*Math.sin(wd*s));
    out.push({transform:'translateY('+(fromPx+(toPx-fromPx)*p).toFixed(2)+'px)'});
  }
  return out;
}
function sheetY(el){
  var tf=getComputedStyle(el).transform;
  if(!tf||tf==='none')return 0;
  try{return new DOMMatrixReadOnly(tf).m42;}catch(e){var m=tf.match(/matrix\(([^)]+)\)/);return m?(+m[1].split(',')[5]||0):0;}

async function exportFile(){

    setRow(actBtn('백업 파일 저장',exportFile)),
    setRow(actBtn(S.exportText!=null?'텍스트 백업 닫기':'텍스트로 백업',function(){S.exportText=S.exportText!=null?null:backupJson();renderView();}))
  ];
  if(S.exportText!=null){
    var ta=h('textarea',{class:'set-ta',id:'export-text',readonly:true,rows:'6','aria-label':'백업 텍스트'});ta.value=S.exportText;
    var r1=h('div',{class:'set-row col'},ta,h('div',{class:'set-ctl'},actBtn('복사',copyExport,'mini accent')));bRows.push(r1);
  }
  var fileIn=h('input',{type:'file',id:'import-file',accept:'.json,application/json,text/plain',class:'vh'});
  fileIn.addEventListener('change',function(){
    var f=fileIn.files&&fileIn.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){stageImport(String(rd.result||''));};
    rd.onerror=function(){S.importErr='파일을 읽지 못했어요.';renderView();};
    rd.readAsText(f);
  });
  bRows.push(setRow(h('label',{class:'set-btn',for:'import-file'},'파일로 복원'),fileIn));
  var paste=h('textarea',{class:'set-ta',id:'paste-text',rows:'3',placeholder:'백업 텍스트 붙여넣기','aria-label':'백업 텍스트 붙여넣기'});
  bRows.push(h('div',{class:'set-row col'},paste,h('div',{class:'set-ctl'},actBtn('텍스트로 복원',function(){stageImport(paste.value);},'mini accent'))));
  if(S.pending){
    var P=S.pending;
    bRows.push(h('div',{class:'set-row col'},
      h('p',{class:'set-pend'},'과목 '+P.subjects.length+'개 · 박스 '+P.items.length+'개 · 모의고사 '+P.mocks.length+'개. 복원하면 지금 데이터는 사라져요.'),
      h('div',{class:'set-ctl'},confirmBtn('do-import','이 백업으로 복원','한 번 더 누르면 복원해요',doImport,'mini danger'),actBtn('취소',function(){S.pending=null;renderView();},'mini'))));
  }
  var iv=h('input',{type:'text',id:'set-iv',class:'set-in',value:state.intervals.join(', '),inputmode:'numeric',autocomplete:'off',style:'width:150px'});
  var ivSave=actBtn('저장',function(){
    var parts=iv.value.split(/[,\s]+/).filter(Boolean).map(Number);
    if(!parts.length||parts.length>20||!parts.every(function(n){return Number.isInteger(n)&&n>=1&&n<=365;})){S.ivErr='1~365 사이 정수를 쉼표로 구분해 넣어 주세요.';renderView();return;}
    state.intervals=parts;S.ivErr=null;saveNow();renderView();toast('복습 간격을 저장했어요');
  },'mini accent');
  var dayList=[0];for(var s=0;s<5;s++)dayList.push(stageDay(state.intervals,s));
  kids.push(setSec('복습',[setRow(h('label',{class:'lbl',for:'set-iv'},'간격 (일)'),h('div',{class:'set-ctl'},iv,ivSave))],
    S.ivErr||('0일 → '+dayList.join(' · ')+'일차 … 마지막 간격은 반복돼요'),!!S.ivErr));

  kids.push(setSec('색',[1,2,3,4,5,0].map(function(l){return setRow(h('span',{class:'sq lv'+l,'aria-hidden':'true'}),h('span',{class:'lbl'},l?l+'점 · '+LV[l]:'검사대상 · 복습 전'));})));

  var goalIn=h('input',{type:'text',id:'set-goal',class:'set-in',value:fmtNum(state.studyGoal||GOAL_DEF),inputmode:'decimal',autocomplete:'off',style:'width:70px'});
  goalIn.addEventListener('change',function(){
    var v=Number(goalIn.value.trim().replace(',','.'));
    if(!(isFinite(v)&&v>=1&&v<=18)){goalIn.value=fmtNum(state.studyGoal||GOAL_DEF);toast('1~18시간 사이로 넣어 주세요');return;}
    state.studyGoal=Math.round(v*2)/2;goalIn.value=fmtNum(state.studyGoal);saveNow();drawTrail();toast('하루 공부 목표를 '+fmtNum(state.studyGoal)+'시간으로 바꿨어요');
  });
  var pc=paceOf(),hm=function(m){return pad2(Math.floor(m/60))+':'+pad2(m%60);},mh=function(v){var m=/^(\d{1,2}):(\d{2})/.exec(v||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60+(+m[2]):null;};
  var pFrom=h('input',{type:'time',class:'set-in pc-t','aria-label':'페이스 시작',value:hm(pc.from)});
  var pTo=h('input',{type:'time',class:'set-in pc-t','aria-label':'페이스 끝',value:hm(pc.to)});
  var pH=h('input',{type:'text',class:'set-in',value:fmtNum(pc.h),inputmode:'decimal',autocomplete:'off','aria-label':'페이스 시간',style:'width:56px'});
  function savePace(){
    var f=mh(pFrom.value),e=mh(pTo.value),v=Number(pH.value.trim().replace(',','.'));
    var rel=function(x){return ((x-DAY_START_H*60)%1440+1440)%1440;};
    if(f==null||e==null||rel(e)<=rel(f)){pFrom.value=hm(paceOf().from);pTo.value=hm(paceOf().to);toast('끝 시각이 시작보다 뒤여야 해요');return;}
    if(!(isFinite(v)&&v>=0&&v<=18)){pH.value=fmtNum(paceOf().h);toast('0~18시간 사이로 넣어 주세요');return;}
    state.pace={from:f,to:e,h:Math.round(v*2)/2};pH.value=fmtNum(state.pace.h);saveNow();drawTrail();
  }
  [pFrom,pTo,pH].forEach(function(x){x.addEventListener('change',savePace);});
  kids.push(setSec('공부 시간',[
    setRow(h('label',{class:'lbl',for:'set-goal'},'하루 목표'),h('div',{class:'set-ctl'},goalIn,h('span',{class:'set-unit'},'시간'))),
    setRow(h('span',{class:'lbl'},'페이스'),h('div',{class:'set-ctl'},pFrom,h('span',{class:'set-unit'},'~'),pTo,pH,h('span',{class:'set-unit'},'시간')))],
    '파랑은 오늘, 회색은 페이스 (0시간이면 꺼짐)'));

  kids.push(themeSection());
  kids.push(setSec('출석',[
    setRow(h('span',{class:'lbl'},'함현재 출석 카운트다운'),switchEl(!state.attOff,'함현재 출석 카운트다운',function(v){if(v)delete state.attOff;else state.attOff=true;saveNow();tickAtt();toast(v?'출석 카운트다운을 켰어요':'출석 카운트다운을 껐어요');}))],
    '월~금 9:00 · 10:30 · 1:30 · 3:00 · 4:30 · 7:00 · 8:30, 토요일은 4:30까지, 일요일은 없음. 오른쪽 위 빨간 박스를 누르면 그날 출석 시간이 떠요.'));
  kids.push(setSec('하루 첫 화면',[
    setRow(h('span',{class:'lbl'},'첫 접속 인트로'),switchEl(!state.introOff,'하루 첫 접속 인트로',function(v){if(v)delete state.introOff;else state.introOff=true;saveNow();toast(v?'하루 첫 화면을 켰어요':'하루 첫 화면을 껐어요');})),
    setRow(h('span',{class:'lbl'},'지금 다시 보기'),actBtn('보기',function(){playIntro();},'mini'))]));
  kids.push(pastSection());
  kids.push(cloudSection());
  kids.push(setSec('저장',storeRows(),'데이터는 기기 데이터베이스에 저장돼요. 삭제 방지가 켜져 있으면 기기 공간이 모자라도 브라우저가 이 앱 데이터를 지우지 않아요. 그래도 백업 파일이나 클라우드는 따로 챙겨 두세요.'));
  kids.push(setSec('백업',bRows,S.importErr||null,!!S.importErr));

  kids.push(setSec('데이터',[setRow(confirmBtn('wipe','전체 데이터 지우기','한 번 더 누르면 모두 지워요',wipeAll))]));
  var lay=actBtn('처음대로',function(){
    if(!state.layout){toast('이미 처음 배치예요');return;}
    delete state.layout;saveNow();renderView();toast('배치를 처음대로 돌렸어요');
  },'mini');
  var SK={'클라우드 저장':'cloud','시험':'exam','지난 날 고치기':'past','하루 첫 화면':'intro','공부 시간':'study','복습':'review','테마':'theme','색':'color','과목':'subj','챕터':'ch','저장':'store','백업':'backup','데이터':'data','출석':'att'};
  var su=h('div',{class:'set-units'}),rest=[];
  kids.forEach(function(el,i){
    if(el&&el.classList&&el.classList.contains('set-sec')){var tt=el.querySelector('.set-title');el.setAttribute('data-unit',SK[tt?tt.textContent:'']||'s'+i);su.appendChild(el);}
    else rest.push(el);
  });
  su.insertBefore(unit(setSec('화면 배치',[setRow(h('span',{class:'lbl'},'카드를 꾹 눌러 끌면 옮겨져요'),lay)]),'layout'),su.querySelector('[data-unit="past"]'));
  applyLayout(su,'settings');
  /* 바로가기: 누르면 그 묶음의 첫 칸으로 */
  var jump=h('div',{class:'set-jump',role:'navigation','aria-label':'설정 바로가기'},[['시험·과목','exam'],['복습','review'],['공부','study'],['화면','theme'],['지난 날','past'],['데이터','cloud']].map(function(j){
    var bt=h('button',{class:'set-jb',type:'button'},j[0]);
    bt.addEventListener('click',function(){var el=su.querySelector('[data-unit="'+j[1]+'"]');if(el)el.scrollIntoView({behavior:motion()?'smooth':'auto',block:'start'});});
    return bt;}));
  rest.splice(1,0,jump);
  return h('section',{class:'settings'},rest,su);
}

/* ---------- 그리기 ---------- */
function renderView(){
  var view=document.getElementById('view');
  if(ui.pastDay&&(ui.pastDay>=realToday()||ui.pastDay<pastMin())){ui.pastDay=null;ui.pastBase=null;}
  syncPastBar();
  var t=today();
  lastDay=t;
  if(prune(t))saveNow();
  logToday(t);
  var v;
  try{
    if(!state.subjects.length)state.subjects=defaultSubjects();
    if(ui.tab==='home')v=homeView(t);
    else if(ui.tab==='quest')v=questView(t);
    else if(ui.tab==='stats')v=statsView(t);
    else if(ui.tab==='study')v=studyView(t);
    else if(ui.tab==='mock')v=mockView(t);
    else if(ui.tab==='reads')v=readsView(t);
    else if(ui.tab==='cards')v=cardsView(t);
    else v=settingsView(t);
  }catch(e){
    v=h('div',{class:'err-box'},'화면을 그리다 오류가 났어요: '+(e&&e.message?e.message:e));
    if(window.console)console.error(e);
  }
  /* 퀘스트 보드를 다시 그려도 미해결·중요 칸 안의 스크롤 위치는 그대로 */
  var keep={};
  view.querySelectorAll('[data-cell]>.qc-body').forEach(function(b){if(b.scrollTop)keep[b.parentNode.getAttribute('data-cell')]=b.scrollTop;});
  view.replaceChildren(v);
  Object.keys(keep).forEach(function(k){var b=view.querySelector('[data-cell="'+k+'"]>.qc-body');if(b)b.scrollTop=keep[k];});
  updateBadges();
  applyTheme();
}
function checkDay(){autoCloseCheck();var t=today();if(t!==lastDay&&!activeSheet&&!busy)renderView();}

/* 데이터베이스를 먼저 열어 읽고 시작. 6초 안에 답이 없으면 localStorage로 시작(이번엔 데이터베이스에 안 씀) */
function init(){
  cloudMetaLoad();
  var started=false;
  function go(rec,ok,db){
    if(started){if(db){try{db.close();}catch(e){}}return;}
    started=true;
    if(ok&&db){IDB.db=db;IDB.off=false;}else{IDB.off=true;if(db){try{db.close();}catch(e){}}}
    load(rec,ok);
    if(IDB.ro){cloud.meta=null;storeOk();}
    init2();
  }
  var tm=setTimeout(function(){go(null,false,null);},6000);
  idbOpen(function(db){
    if(!db){clearTimeout(tm);go(null,false,null);return;}
    idbGet(db,'state',function(ok,rec){clearTimeout(tm);go(rec,ok,db);});
  });
}
function init2(){
  if(TABS.indexOf(ui.tab)<0)ui.tab='home';
  if(!cloud.meta&&applyPresets())saveNow();
  if((seedCards()|seedPacks())&&!IDB.ro)saveNow();
  autoCloseCheck();
  buildTrail();
  buildTabbar();
  buildFab();
  renderView();
  var view=document.getElementById('view');
  anim(view,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:600,easing:EASE});
  afterEnter(ui.tab,view);
  maybeIntro();
  window.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;if(RD.drag)rdMove(e.clientX,e.clientY);else rdMaybeCancel(e.clientX,e.clientY);});
  window.addEventListener('pointerup',function(e){if(e.pointerType==='touch')return;if(RD.drag)rdEnd();else rdCancel();});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){saveNow();if(cloud.ready&&(state.savedAt||0)>(cloud.meta&&cloud.meta.base||0))cloudPush();}
    else{checkDay();drawTrail();maybeIntro();checkLongRun();if(cloud.meta)cloudSync();}
  });
  window.addEventListener('online',function(){if(cloud.meta)cloudSync();});
  if(cloud.meta)cloudSync();else setCloud('off');
  window.addEventListener('resize',function(){requestAnimationFrame(lateFade);});
  setTimeout(checkLongRun,900);
  window.addEventListener('pagehide',saveNow);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&activeSheet){activeSheet.close();return;}
    if(activeSheet||busy||e.isComposing||e.altKey)return;
    var cmdK=(e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K'),slash=e.key==='/'&&!e.metaKey&&!e.ctrlKey;
    if(!cmdK&&!slash)return;
    var tg=e.target,tn=tg&&tg.tagName;
    if(slash&&(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||(tg&&tg.isContentEditable)))return;
    e.preventDefault();openSearch();
  });
  setInterval(checkDay,60000);
  setInterval(function(){if(!trailTick)tickTrail();},30000);
  persistCheck(true);
  if(IDB.ro)setTimeout(function(){toast('저장소를 못 열어서 이번엔 저장을 멈췄어요. 앱을 완전히 닫았다가 다시 열어 주세요');},700);
  window.__cpahReady=true;
}
init();
})();
</script>
